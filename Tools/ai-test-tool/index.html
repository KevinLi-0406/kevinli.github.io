<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI API 测试工具</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-primary: #0a0b10;
    --bg-card: #1a1b26;
    --bg-hover: #24253a;
    --bg-input: #16171f;
    --accent: #7c6aef;
    --accent-light: #a78bfa;
    --accent-glow: rgba(124,106,239,0.15);
    --text-primary: #e4e4ed;
    --text-secondary: #8888a0;
    --text-muted: #55556a;
    --border: #2a2b3d;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .top-bar {
    background: rgba(18,19,26,0.95);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 13px;
  }
  .card-body { padding: 12px; }

  .input-field {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
  }
  .input-field:focus { border-color: var(--accent); }

  .btn {
    padding: 7px 14px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #6347e0); color: white; }
  .btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .btn-xs { padding: 3px 8px; font-size: 10px; }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-dot.connected { background: var(--success); box-shadow: 0 0 6px rgba(34,197,94,0.5); }
  .status-dot.disconnected { background: var(--danger); }
  .status-dot.testing { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* 主布局 */
  .main-layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    height: calc(100vh - 49px);
  }
  .left-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .right-panel {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 模型区域 */
  .model-section {
    flex-shrink: 0;
    max-height: 220px;
    display: flex;
    flex-direction: column;
  }
  .model-section .card-body {
    overflow-y: auto;
    flex: 1;
  }
  .model-group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--bg-input);
    border-radius: 6px;
    margin-bottom: 6px;
    font-size: 11px;
    font-weight: 600;
  }
  .model-group-header .count {
    margin-left: auto;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 3px;
    background: rgba(255,255,255,0.05);
  }
  .model-group-header.available { color: var(--success); }
  .model-group-header.unavailable { color: var(--danger); }

  .model-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 6px;
  }
  .model-chip {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
    position: relative;
  }
  .model-chip:hover { border-color: var(--accent); }
  .model-chip.selected { border-color: var(--accent); background: var(--accent-glow); }
  .model-chip.unavailable { opacity: 0.5; }
  .model-chip .icon {
    width: 22px; height: 22px;
    border-radius: 4px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    flex-shrink: 0;
  }
  .model-chip .info { overflow: hidden; flex: 1; }
  .model-chip .name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .model-chip .meta {
    font-size: 9px;
    color: var(--text-muted);
    display: flex;
    gap: 4px;
  }
  .model-tag {
    font-size: 8px;
    font-weight: 600;
    padding: 1px 4px;
    border-radius: 3px;
  }
  .model-chip .check {
    position: absolute;
    top: 4px; right: 4px;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 8px;
  }
  .model-chip.selected .check { display: flex; }

  /* 筛选栏 */
  .filter-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .search-box {
    position: relative;
    flex: 1;
    min-width: 120px;
  }
  .search-box input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 6px 10px 6px 26px;
    border-radius: 6px;
    font-size: 11px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box .icon {
    position: absolute;
    left: 8px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 10px;
  }
  .vendor-filters {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
  }
  .vendor-btn {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .vendor-btn:hover { border-color: var(--border); }
  .vendor-btn.active { border-color: var(--accent); background: var(--accent-glow); color: var(--accent-light); }

  /* 对话区域 */
  .chat-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .message-round {
    padding: 10px;
    background: rgba(26,27,38,0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .round-user-msg {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    align-self: flex-start;
    max-width: 70%;
    margin-bottom: 8px;
  }
  .round-user-msg .label { font-size: 9px; opacity: 0.7; margin-bottom: 2px; }
  .result-section { margin-top: 6px; }
  .result-header {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    padding: 4px 8px;
    background: var(--bg-input);
    border-radius: 4px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .result-header:hover { background: var(--bg-hover); }
  .result-header .count { margin-left: auto; font-size: 9px; }
  .result-header.success { color: var(--success); }
  .result-header.failure { color: var(--danger); }
  .round-models-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 6px;
  }
  .model-response-col {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    background: var(--bg-card);
  }
  .model-response-col.error { border-color: rgba(239,68,68,0.4); }
  .model-response-header {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    background: var(--bg-input);
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    font-weight: 600;
  }
  .model-response-header .icon {
    width: 16px; height: 16px;
    border-radius: 3px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    display: flex; align-items: center; justify-content: center;
    font-size: 8px;
  }
  .model-response-header .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .model-response-header .speed {
    font-size: 9px;
    color: var(--accent-light);
    background: rgba(124,106,239,0.15);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .model-response-body {
    padding: 8px;
    max-height: 150px;
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.5;
  }
  .model-response-body.collapsed { max-height: 40px; overflow: hidden; }
  .model-response-bubble {
    background: var(--bg-hover);
    border-radius: 4px;
    padding: 8px;
    word-break: break-word;
  }
  .model-response-bubble pre {
    background: rgba(0,0,0,0.3);
    border-radius: 4px;
    padding: 6px;
    overflow-x: auto;
    margin: 4px 0;
    font-size: 11px;
  }
  .model-response-bubble code { font-size: 11px; }
  .collapse-toggle {
    padding: 3px;
    background: var(--bg-input);
    border-top: 1px solid var(--border);
    cursor: pointer;
    font-size: 9px;
    color: var(--text-muted);
    text-align: center;
  }

  .chat-input-area {
    border-top: 1px solid var(--border);
    padding: 10px;
    display: flex;
    gap: 6px;
    align-items: flex-end;
  }
  .chat-input-area textarea {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
    resize: none;
    min-height: 34px;
    max-height: 80px;
    font-family: inherit;
  }
  .send-btn {
    width: 34px; height: 34px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    border: none;
    color: white;
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .stop-btn {
    width: 34px; height: 34px;
    border-radius: 6px;
    background: var(--danger);
    border: none;
    color: white;
    font-size: 12px;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
  }
  .stop-btn.visible { display: flex; }

  .typing-indicator { display: flex; gap: 2px; padding: 2px 0; }
  .typing-indicator span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: typing 1.4s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%,60%,100% { opacity: 0.3; } 30% { opacity: 1; } }

  /* 右侧面板 */
  .right-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .right-section:last-child { border-bottom: none; }
  .right-section .card-body { overflow-y: auto; flex: 1; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 10px;
  }
  .stat-item {
    background: var(--bg-input);
    border-radius: 6px;
    padding: 8px;
    text-align: center;
  }
  .stat-item .val {
    font-size: 16px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-light), #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-item .lbl { font-size: 9px; color: var(--text-muted); }

  .model-stat-item {
    background: var(--bg-input);
    border-radius: 6px;
    padding: 8px;
    margin-bottom: 6px;
  }
  .model-stat-item .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 4px;
  }
  .model-stat-item .name { font-size: 11px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-stat-item .speed { font-size: 11px; font-weight: 700; color: var(--accent-light); }
  .model-stat-item .bar {
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .model-stat-item .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    border-radius: 2px;
  }
  .model-stat-item .meta {
    display: flex;
    justify-content: space-between;
    font-size: 9px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .history-list {
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow-y: auto;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 11px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item:hover { background: var(--bg-hover); }
  .history-item .text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item .time { font-size: 9px; color: var(--text-muted); }
  .history-item .retry-btn {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .history-item .retry-btn:hover { background: var(--accent-glow); color: var(--accent-light); }

  .toast-container {
    position: fixed; top: 12px; right: 12px; z-index: 9999;
    display: flex; flex-direction: column; gap: 4px;
  }
  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    animation: toastIn 0.3s ease;
    display: flex; align-items: center; gap: 6px;
  }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--accent); }
  .toast.warning { border-left: 3px solid var(--warning); }
  @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    gap: 6px;
  }
  .empty-state .icon { font-size: 28px; opacity: 0.4; }
  .empty-state p { font-size: 12px; }

  @media (max-width: 900px) {
    .main-layout { grid-template-columns: 1fr; }
    .right-panel { display: none; }
  }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="font-size:18px;">🤖</span>
    <span style="font-size:14px;font-weight:700;">AI API 测试工具</span>
  </div>
  <div style="display:flex;align-items:center;gap:10px;">
    <input type="text" id="apiBase" class="input-field" style="width:240px;" value="https://ai-service.segway-ninebot.com" placeholder="API 地址">
    <div style="position:relative;">
      <input type="password" id="apiKey" class="input-field" style="width:160px;padding-right:28px;" placeholder="API Key">
      <button onclick="toggleKeyVisibility()" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:12px;" id="eyeBtn">👁️</button>
    </div>
    <button class="btn btn-primary" id="testBtn" onclick="testConnection()">📡 测试连通</button>
    <button class="btn btn-warning" onclick="testAllModels()" id="testAllBtn" disabled>🔍 批量测试</button>
    <button class="btn btn-success" onclick="aiAnalysis()" id="aiAnalysisBtn" disabled>🧠 AI分析</button>
    <span id="connStatus" style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-muted);">
      <span class="status-dot disconnected" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </span>
  </div>
</div>

<div class="main-layout">
  <!-- 左侧 -->
  <div class="left-panel">
    <!-- 模型选择 -->
    <div class="model-section card" style="margin:10px 10px 0;">
      <div class="card-header">
        <span>🧠</span> 模型
        <span id="modelCount" style="margin-left:auto;font-size:10px;color:var(--text-muted);"></span>
        <button class="btn btn-xs btn-secondary" id="selectAllBtn" onclick="toggleSelectAll()" style="display:none;">全选</button>
        <button class="btn btn-xs btn-danger" id="clearUnavailableBtn" onclick="clearUnavailableModels()" style="display:none;">清除不可用</button>
      </div>
      <div class="card-body">
        <div class="filter-bar">
          <div class="search-box">
            <span class="icon">🔍</span>
            <input type="text" id="modelSearch" placeholder="搜索..." oninput="handleSearch()">
          </div>
          <div class="vendor-filters" id="vendorFilters"></div>
        </div>
        <div id="modelListContainer">
          <div class="empty-state" style="height:60px;">
            <p>点击「测试连通」加载模型</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 对话 -->
    <div class="chat-section card" style="margin:10px;flex:1;">
      <div class="card-header">
        <span>💬</span> 对话
        <span id="chatModelHint" style="margin-left:4px;font-size:10px;color:var(--text-muted);"></span>
        <button class="btn btn-xs btn-secondary" style="margin-left:auto;" onclick="clearChat()">清空</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="empty-state">
          <div class="icon">💬</div>
          <p>选择模型后输入消息</p>
        </div>
      </div>
      <div class="chat-input-area">
        <textarea id="chatInput" placeholder="输入消息... (Enter 发送)" rows="1" onkeydown="handleInputKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
        <button class="stop-btn" id="stopBtn" onclick="stopAllRequests()">⏹</button>
      </div>
    </div>
  </div>

  <!-- 右侧 -->
  <div class="right-panel">
    <div class="right-section">
      <div class="card-header">
        <span>📊</span> 统计
      </div>
      <div class="card-body">
        <div class="stats-grid">
          <div class="stat-item"><div class="val" id="statTotal">0</div><div class="lbl">请求</div></div>
          <div class="stat-item"><div class="val" id="statSuccess">0</div><div class="lbl">成功</div></div>
          <div class="stat-item"><div class="val" id="statFailed">0</div><div class="lbl">失败</div></div>
          <div class="stat-item"><div class="val" id="statAvgSpeed">-</div><div class="lbl">平均</div></div>
        </div>
        <div id="modelStats" style="max-height:180px;overflow-y:auto;">
          <div style="color:var(--text-muted);font-size:11px;text-align:center;padding:10px;">暂无数据</div>
        </div>
      </div>
    </div>

    <div class="right-section">
      <div class="card-header">
        <span>📜</span> 历史
        <span style="margin-left:auto;font-size:9px;color:var(--text-muted);">最近10条</span>
      </div>
      <div class="card-body">
        <div class="history-list" id="historyPanel">
          <div style="color:var(--text-muted);font-size:11px;text-align:center;padding:12px;">暂无历史</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// 供应商配置
const VENDOR_CONFIG = {
  'gpt': { label: 'OpenAI', color: '#10a37f' },
  'o1': { label: 'OpenAI', color: '#10a37f' },
  'o3': { label: 'OpenAI', color: '#10a37f' },
  'o4': { label: 'OpenAI', color: '#10a37f' },
  'claude': { label: 'Anthropic', color: '#d97706' },
  'gemini': { label: 'Google', color: '#4285f4' },
  'llama': { label: 'Meta', color: '#0668E1' },

function getVendor(modelId) {
  const id = modelId.toLowerCase();
  // 先去掉 external/ 前缀
  const cleanId = id.replace(/^external\//, '');
  for (const [key, config] of Object.entries(VENDOR_CONFIG)) {
    if (cleanId.includes(key)) return config;
  }
  return { label: 'Other', color: '#666' };
}

function getModelIcon(modelId) {
  const vendor = getVendor(modelId);
  const icons = {
    'OpenAI': '🧠', 'Anthropic': '🎭', 'Google': '💎', 'Meta': '🦙',
    'Qwen': '🔮', 'DeepSeek': '🔍', 'Zhipu': '📚', 'Mistral': '🌊',
    'Yi': '🌟', 'Baichuan': '🐟', 'Other': '🤖'
  };
  return icons[vendor.label] || '🤖';
}

const state = {
  models: [],
  selectedModels: new Set(),
  requestLog: [],
  messageHistory: [],
  isConnected: false,
  isSending: false,
  searchQuery: '',
  activeVendor: null,
  currentAbortController: null,
  modelConnectivity: new Map(),
};

document.addEventListener('DOMContentLoaded', () => {
  const savedBase = localStorage.getItem('ai_test_api_base');
  if (savedBase) document.getElementById('apiBase').value = savedBase;

  const textarea = document.getElementById('chatInput');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 80) + 'px';
    updateSendBtnState();
  });
});

function updateSendBtnState() {
  const hasText = document.getElementById('chatInput').value.trim().length > 0;
  document.getElementById('sendBtn').disabled = !hasText || state.isSending;
}

function getApiBase() { return document.getElementById('apiBase').value.replace(/\/+$/, ''); }
function getApiKey() { return document.getElementById('apiKey').value.trim(); }
function getHeaders() {
  const key = getApiKey();
  const h = { 'Content-Type': 'application/json' };
  if (key) h['Authorization'] = `Bearer ${key}`;
  return h;
}

function toggleKeyVisibility() {
  const input = document.getElementById('apiKey');
  const btn = document.getElementById('eyeBtn');
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.textContent = input.type === 'password' ? '👁️' : '🙈';
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  toast.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    toast.style.transition = 'all 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

function formatTime(ms) {
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function renderMarkdown(text) {
  if (!text) return '';
  return text
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function esc(v) { return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(v) { return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

// 测试连通并获取模型
async function testConnection() {
  if (!getApiKey()) { showToast('请先输入 API Key', 'error'); return; }

  const btn = document.getElementById('testBtn');
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');

  btn.disabled = true;
  btn.innerHTML = '<span class="status-dot testing" style="width:10px;height:10px;"></span> 测试中...';
  dot.className = 'status-dot testing';
  text.textContent = '测试中...';

  const startTime = performance.now();

  try {
    const resp = await fetch(`${getApiBase()}/v1/models`, { method: 'GET', headers: getHeaders() });
    const elapsed = Math.round(performance.now() - startTime);

    if (resp.ok) {
      const data = await resp.json();
      const modelCount = data.data ? data.data.length : 0;
      state.isConnected = true;
      dot.className = 'status-dot connected';
      text.textContent = `已连接 (${elapsed}ms)`;
      showToast(`连接成功！${modelCount} 个模型`, 'success');
      localStorage.setItem('ai_test_api_base', getApiBase());
      document.getElementById('testAllBtn').disabled = false;
      document.getElementById('aiAnalysisBtn').disabled = false;

      if (data.data) {
        state.models = data.data;
        state.modelConnectivity.clear();
        autoSelectAllModels();
        renderVendorFilters();
        renderModels();
        updateSendBtnState();
      }
    } else {
      throw new Error(`HTTP ${resp.status}`);
    }
  } catch (e) {
    state.isConnected = false;
    dot.className = 'status-dot disconnected';
    text.textContent = '连接失败';
    showToast(`连接失败: ${e.message}`, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '📡 测试连通';
}

// 批量测试所有模型
async function testAllModels() {
  if (state.models.length === 0) { showToast('请先获取模型列表', 'warning'); return; }
  if (!getApiKey()) { showToast('请先输入 API Key', 'error'); return; }

  const btn = document.getElementById('testAllBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="status-dot testing" style="width:10px;height:10px;"></span> 测试中...';
  showToast(`测试 ${state.models.length} 个模型...`, 'info');

  state.modelConnectivity.clear();
  let successCount = 0;

  const promises = state.models.map(async (model) => {
    const modelId = model.id;
    const startTime = performance.now();
    try {
      const resp = await fetch(`${getApiBase()}/v1/chat/completions`, {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({ model: modelId, messages: [{ role: 'user', content: 'Hi' }], max_tokens: 5 }),
      });
      const elapsed = Math.round(performance.now() - startTime);
      if (resp.ok) {
        state.modelConnectivity.set(modelId, { success: true, elapsed });
        successCount++;
      } else {
        const err = await resp.json().catch(() => ({}));
        state.modelConnectivity.set(modelId, { success: false, error: err.error?.message || `HTTP ${resp.status}` });
      }
    } catch (e) {
      state.modelConnectivity.set(modelId, { success: false, error: e.message });
    }
  });

  await Promise.all(promises);

  btn.disabled = false;
  btn.innerHTML = '🔍 批量测试';
  const failCount = state.models.length - successCount;
  showToast(`完成：${successCount} 可用，${failCount} 不可用`, successCount > 0 ? 'success' : 'error');
  renderModels();
}

// 清除不可用模型
function clearUnavailableModels() {
  const unavailableIds = [];
  state.modelConnectivity.forEach((status, id) => {
    if (!status.success) unavailableIds.push(id);
  });
  
  state.models = state.models.filter(m => !unavailableIds.includes(m.id));
  unavailableIds.forEach(id => {
    state.selectedModels.delete(id);
    state.modelConnectivity.delete(id);
  });
  
  renderVendorFilters();
  renderModels();
  updateSendBtnState();
  showToast(`已清除 ${unavailableIds.length} 个不可用模型`, 'success');
}

function autoSelectAllModels() {
  state.selectedModels.clear();
  getFilteredModels().forEach(m => state.selectedModels.add(m.id));
}

function toggleSelectAll() {
  const filtered = getFilteredModels();
  const allSelected = filtered.every(m => state.selectedModels.has(m.id));
  if (allSelected) {
    filtered.forEach(m => state.selectedModels.delete(m.id));
  } else {
    filtered.forEach(m => state.selectedModels.add(m.id));
  }
  renderModels();
  updateSendBtnState();
}

function handleSearch() {
  state.searchQuery = document.getElementById('modelSearch').value.trim().toLowerCase();
  renderModels();
}

function renderVendorFilters() {
  const container = document.getElementById('vendorFilters');
  const vendors = new Map();
  state.models.forEach(m => {
    const vendor = getVendor(m.id);
    vendors.set(vendor.label, (vendors.get(vendor.label) || 0) + 1);
  });

  let html = `<button class="vendor-btn ${!state.activeVendor ? 'active' : ''}" onclick="filterByVendor(null)">全部</button>`;
  vendors.forEach((count, label) => {
    const isActive = state.activeVendor === label;
    html += `<button class="vendor-btn ${isActive ? 'active' : ''}" onclick="filterByVendor('${label}')">${label} (${count})</button>`;
  });
  container.innerHTML = html;
}

function filterByVendor(vendor) {
  state.activeVendor = vendor;
  renderVendorFilters();
  renderModels();
}

function getFilteredModels() {
  let filtered = state.models;
  if (state.searchQuery) {
    filtered = filtered.filter(m => m.id.toLowerCase().includes(state.searchQuery));
  }
  if (state.activeVendor) {
    filtered = filtered.filter(m => getVendor(m.id).label === state.activeVendor);
  }
  return filtered;
}

function renderModels() {
  const container = document.getElementById('modelListContainer');
  const countEl = document.getElementById('modelCount');
  const selectAllBtn = document.getElementById('selectAllBtn');
  const clearBtn = document.getElementById('clearUnavailableBtn');

  if (state.models.length === 0) {
    container.innerHTML = '<div style="padding:16px;text-align:center;color:var(--text-muted);font-size:12px;">暂无模型</div>';
    countEl.textContent = '';
    selectAllBtn.style.display = 'none';
    clearBtn.style.display = 'none';
    return;
  }

  const filtered = getFilteredModels();
  const allSelected = filtered.every(m => state.selectedModels.has(m.id));
  selectAllBtn.textContent = allSelected ? '取消全选' : '全选';
  selectAllBtn.style.display = '';

  // 检查是否有不可用模型
  const hasUnavailable = [...state.modelConnectivity.values()].some(s => !s.success);
  clearBtn.style.display = hasUnavailable ? '' : 'none';

  countEl.textContent = `${filtered.length}/${state.models.length} · 已选 ${state.selectedModels.size}`;

  // 分组：可用和不可用
  const availableModels = [];
  const unavailableModels = [];
  
  filtered.forEach(m => {
    const conn = state.modelConnectivity.get(m.id);
    if (conn && !conn.success) {
      unavailableModels.push(m);
    } else {
      availableModels.push(m);
    }
  });

  let html = '';

  // 可用模型
  if (availableModels.length > 0) {
    html += `<div class="model-group-header available">✅ 可用模型 <span class="count">${availableModels.length}</span></div>`;
    html += '<div class="model-grid">';
    availableModels.forEach(m => {
      const isSelected = state.selectedModels.has(m.id);
      const vendor = getVendor(m.id);
      const conn = state.modelConnectivity.get(m.id);
      const speedText = conn?.elapsed ? formatTime(conn.elapsed) : '';
      html += `
        <div class="model-chip ${isSelected ? 'selected' : ''}" onclick="toggleModel('${escAttr(m.id)}')" title="${esc(m.id)}">
          <div class="icon">${getModelIcon(m.id)}</div>
          <div class="info">
            <div class="name">${esc(m.id)}</div>
            <div class="meta">
              <span class="model-tag" style="color:${vendor.color};background:${vendor.color}22;">${vendor.label}</span>
              ${speedText ? `<span style="color:var(--success);">⚡${speedText}</span>` : ''}
            </div>
          </div>
          <div class="check">✓</div>
        </div>
      `;
    });
    html += '</div>';
  }

  // 不可用模型
  if (unavailableModels.length > 0) {
    html += `<div class="model-group-header unavailable" style="margin-top:10px;">❌ 不可用模型 <span class="count">${unavailableModels.length}</span></div>`;
    html += '<div class="model-grid">';
    unavailableModels.forEach(m => {
      const isSelected = state.selectedModels.has(m.id);
      const vendor = getVendor(m.id);
      const conn = state.modelConnectivity.get(m.id);
      const errorText = conn?.error || '未知错误';
      html += `
        <div class="model-chip unavailable ${isSelected ? 'selected' : ''}" onclick="toggleModel('${escAttr(m.id)}')" title="${esc(errorText)}">
          <div class="icon" style="opacity:0.5;">${getModelIcon(m.id)}</div>
          <div class="info">
            <div class="name">${esc(m.id)}</div>
            <div class="meta">
              <span class="model-tag" style="color:${vendor.color};background:${vendor.color}22;">${vendor.label}</span>
              <span style="color:var(--danger);">✗ ${esc(errorText.substring(0, 20))}</span>
            </div>
          </div>
          <div class="check">✓</div>
        </div>
      `;
    });
    html += '</div>';
  }

  container.innerHTML = html;
  updateChatModelHint();
}

function toggleModel(id) {
  if (state.selectedModels.has(id)) {
    state.selectedModels.delete(id);
  } else {
    state.selectedModels.add(id);
  }
  renderModels();
  updateSendBtnState();
}

function updateChatModelHint() {
  const hint = document.getElementById('chatModelHint');
  if (state.selectedModels.size === 0) {
    hint.textContent = '— 未选择模型';
    hint.style.color = 'var(--warning)';
  } else {
    hint.textContent = `— ${state.selectedModels.size} 个模型`;
    hint.style.color = 'var(--text-muted)';
  }
}

function createRoundContainer() {
  const messages = document.getElementById('chatMessages');
  const round = document.createElement('div');
  round.className = 'message-round';
  messages.appendChild(round);
  messages.scrollTop = messages.scrollHeight;
  return round;
}

function addUserMessage(text, round) {
  const div = document.createElement('div');
  div.className = 'round-user-msg';
  div.innerHTML = `<div class="label">👤 你 · ${new Date().toLocaleTimeString()}</div>${esc(text)}`;
  round.insertBefore(div, round.firstChild);
}

function createModelColumns(round, models, roundId) {
  const successSection = document.createElement('div');
  successSection.className = 'result-section';
  successSection.innerHTML = `
    <div class="result-header success" onclick="toggleSection(this)">
      <span>✅ 成功</span>
      <span class="count" id="success-count-${roundId}">0</span>
    </div>
    <div class="round-models-grid" id="success-grid-${roundId}"></div>
  `;
  
  const failureSection = document.createElement('div');
  failureSection.className = 'result-section';
  failureSection.innerHTML = `
    <div class="result-header failure" onclick="toggleSection(this)">
      <span>❌ 失败</span>
      <span class="count" id="failure-count-${roundId}">0</span>
    </div>
    <div class="round-models-grid" id="failure-grid-${roundId}"></div>
  `;
  
  round.appendChild(successSection);
  round.appendChild(failureSection);
  
  models.forEach(model => {
    const safeId = model.replace(/[^a-zA-Z0-9]/g, '_');
    const col = document.createElement('div');
    col.className = 'model-response-col';
    col.id = 'col-' + safeId;
    col.dataset.model = model;
    col.innerHTML = `
      <div class="model-response-header">
        <div class="icon">${getModelIcon(model)}</div>
        <span class="name" title="${escAttr(model)}">${esc(model)}</span>
        <span class="speed" id="speed-${safeId}" style="display:none;"></span>
      </div>
      <div class="model-response-body" id="body-${safeId}">
        <div class="typing-indicator" id="loading-${safeId}"><span></span><span></span><span></span></div>
      </div>
      <div class="collapse-toggle" onclick="toggleCollapse(this)">收起 ▲</div>
    `;
    document.getElementById('success-grid-' + roundId).appendChild(col);
  });
}

function toggleSection(header) {
  const grid = header.nextElementSibling;
  grid.style.display = grid.style.display === 'none' ? '' : 'none';
}

function toggleCollapse(toggle) {
  const body = toggle.previousElementSibling;
  if (body.classList.contains('collapsed')) {
    body.classList.remove('collapsed');
    toggle.textContent = '收起 ▲';
  } else {
    body.classList.add('collapsed');
    toggle.textContent = '展开 ▼';
  }
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  if (state.selectedModels.size === 0) { showToast('请先选择模型', 'warning'); return; }
  if (state.isSending) return;

  // 设置发送状态
  state.isSending = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('stopBtn').classList.add('visible');

  const messages = document.getElementById('chatMessages');
  if (messages.querySelector('.empty-state')) messages.innerHTML = '';

  const round = createRoundContainer();
  round.id = 'round-' + Date.now();
  addUserMessage(text, round);
  
  const models = [...state.selectedModels];
  createModelColumns(round, models, round.id);

  state.currentAbortController = new AbortController();
  const signal = state.currentAbortController.signal;

  const historyEntry = {
    id: round.id,
    text: text,
    timestamp: Date.now(),
    models: models,
    results: new Map(),
  };
  state.messageHistory.unshift(historyEntry);
  if (state.messageHistory.length > 10) state.messageHistory.pop();
  renderHistory();

  const promises = models.map(model => sendToModel(model, text, round.id, signal, historyEntry));
  await Promise.allSettled(promises);

  // 重置发送状态
  state.isSending = false;
  state.currentAbortController = null;
  document.getElementById('stopBtn').classList.remove('visible');
  updateSendBtnState();
  updateStats();
}

function stopAllRequests() {
  if (state.currentAbortController) {
    state.currentAbortController.abort();
    showToast('已停止', 'warning');
  }
}

function addAssistantMessage(model, text, elapsed, roundId) {
  const safeId = model.replace(/[^a-zA-Z0-9]/g, '_');
  const body = document.getElementById('body-' + safeId);
  if (!body) return;

  const bubble = document.createElement('div');
  bubble.className = 'model-response-bubble';
  bubble.innerHTML = renderMarkdown(text);
  body.appendChild(bubble);

  const speedEl = document.getElementById('speed-' + safeId);
  if (speedEl) {
    speedEl.textContent = '⚡' + formatTime(elapsed);
    speedEl.style.display = '';
  }
}

function addErrorMessage(model, error, roundId) {
  const safeId = model.replace(/[^a-zA-Z0-9]/g, '_');
  const body = document.getElementById('body-' + safeId);
  if (!body) return;

  const col = document.getElementById('col-' + safeId);
  if (col) {
    col.classList.add('error');
    const failureGrid = document.getElementById('failure-grid-' + roundId);
    if (failureGrid) {
      failureGrid.appendChild(col);
      const successCount = document.getElementById('success-grid-' + roundId).children.length;
      const failureCount = document.getElementById('failure-grid-' + roundId).children.length;
      document.getElementById('success-count-' + roundId).textContent = successCount;
      document.getElementById('failure-count-' + roundId).textContent = failureCount;
    }
  }

  const errDiv = document.createElement('div');
  errDiv.className = 'model-response-bubble';
  errDiv.style.borderColor = 'rgba(239,68,68,0.3)';
  errDiv.innerHTML = `<div style="color:var(--danger);font-size:11px;">❌ ${esc(error)}</div>`;
  body.appendChild(errDiv);
}

async function sendToModel(model, userText, roundId, signal, historyEntry) {
  const startTime = performance.now();
  try {
    const resp = await fetch(`${getApiBase()}/v1/chat/completions`, {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({ model, messages: [{ role: 'user', content: userText }], temperature: 0.7, max_tokens: 2048 }),
      signal,
    });
    const elapsed = Math.round(performance.now() - startTime);

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '(空回复)';
    
    addAssistantMessage(model, content, elapsed, roundId);
    historyEntry.results.set(model, { success: true, elapsed, content });

    state.requestLog.push({ model, elapsed, tokens: data.usage?.total_tokens || 0, timestamp: Date.now() });
  } catch (e) {
    const elapsed = Math.round(performance.now() - startTime);
    if (e.name === 'AbortError') {
      addErrorMessage(model, '已取消', roundId);
      historyEntry.results.set(model, { success: false, error: '已取消' });
    } else {
      addErrorMessage(model, e.message, roundId);
      historyEntry.results.set(model, { success: false, error: e.message, elapsed });
    }
    state.requestLog.push({ model, elapsed, error: true, timestamp: Date.now() });
  }
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// 清空对话但不清空历史
function clearChat() {
  state.requestLog = [];
  const messages = document.getElementById('chatMessages');
  messages.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>选择模型后输入消息</p></div>';
  updateStats();
}

function updateStats() {
  const logs = state.requestLog;
  const successLogs = logs.filter(l => !l.error);
  const total = logs.length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statSuccess').textContent = successLogs.length;
  document.getElementById('statFailed').textContent = total - successLogs.length;

  if (successLogs.length === 0) {
    document.getElementById('statAvgSpeed').textContent = '-';
    document.getElementById('modelStats').innerHTML = '<div style="color:var(--text-muted);font-size:11px;text-align:center;padding:10px;">暂无数据</div>';
    return;
  }

  const times = successLogs.map(l => l.elapsed);
  const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
  document.getElementById('statAvgSpeed').textContent = formatTime(avg);

  const modelMap = new Map();
  successLogs.forEach(l => {
    if (!modelMap.has(l.model)) modelMap.set(l.model, []);
    modelMap.get(l.model).push(l.elapsed);
  });

  // 按平均速度排序
  let entries = [...modelMap.entries()].sort((a, b) => {
    const avgA = a[1].reduce((x, y) => x + y, 0) / a[1].length;
    const avgB = b[1].reduce((x, y) => x + y, 0) / b[1].length;
    return avgA - avgB;
  });

  const fastest = Math.min(...times);
  const slowest = Math.max(...times);

  let html = '';
  entries.forEach(([model, modelTimes]) => {
    const modelAvg = Math.round(modelTimes.reduce((a, b) => a + b, 0) / modelTimes.length);
    const min = Math.min(...modelTimes);
    const max = Math.max(...modelTimes);
    const barWidth = Math.max(10, Math.min(100, (1 - (modelAvg - fastest) / (slowest - fastest || 1)) * 100));
    html += `
      <div class="model-stat-item">
        <div class="header">
          <span class="name" title="${esc(model)}">${getModelIcon(model)} ${esc(model)}</span>
          <span class="speed">${formatTime(modelAvg)}</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${barWidth}%;"></div></div>
        <div class="meta"><span>最快 ${formatTime(min)}</span><span>${modelTimes.length}次</span><span>最慢 ${formatTime(max)}</span></div>
      </div>
    `;
  });
  document.getElementById('modelStats').innerHTML = html;
}

function renderHistory() {
  const panel = document.getElementById('historyPanel');
  if (state.messageHistory.length === 0) {
    panel.innerHTML = '<div style="color:var(--text-muted);font-size:11px;text-align:center;padding:12px;">暂无历史</div>';
    return;
  }

  let html = '';
  state.messageHistory.forEach((entry, index) => {
    const successCount = [...entry.results.values()].filter(r => r.success).length;
    const totalCount = entry.results.size;
    html += `
      <div class="history-item" onclick="scrollToRound('${entry.id}')">
        <span class="text">${esc(entry.text)}</span>
        <span class="time">${new Date(entry.timestamp).toLocaleTimeString()}</span>
        <span style="font-size:9px;color:${successCount === totalCount ? 'var(--success)' : 'var(--warning)'};">${successCount}/${totalCount}</span>
        <button class="retry-btn" onclick="event.stopPropagation();retryMessage(${index})">重试</button>
      </div>
    `;
  });
  panel.innerHTML = html;
}

function scrollToRound(roundId) {
  const round = document.getElementById(roundId);
  if (round) {
    round.scrollIntoView({ behavior: 'smooth', block: 'center' });
    round.style.boxShadow = '0 0 0 2px var(--accent)';
    setTimeout(() => { round.style.boxShadow = ''; }, 2000);
  }
}

function retryMessage(index) {
  const entry = state.messageHistory[index];
  if (!entry) return;
  document.getElementById('chatInput').value = entry.text;
  updateSendBtnState();
  showToast('已填充消息，点击发送重试', 'info');
}

// AI 分析功能
async function aiAnalysis() {
  if (state.messageHistory.length === 0) {
    showToast('没有对话历史可分析', 'warning');
    return;
  }

  const btn = document.getElementById('aiAnalysisBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="status-dot testing" style="width:10px;height:10px;"></span> 分析中...';

  // 构建分析数据
  let analysisData = '请分析以下AI模型测试结果，给出简短评价（200字以内）：\n\n';
  
  state.messageHistory.slice(0, 3).forEach((entry, i) => {
    analysisData += `【对话${i+1}】用户问题：${entry.text}\n`;
    entry.results.forEach((result, model) => {
      if (result.success) {
        analysisData += `  - ${model}: 成功，耗时${result.elapsed}ms，回复长度${result.content?.length || 0}字\n`;
      } else {
        analysisData += `  - ${model}: 失败，${result.error}\n`;
      }
    });
    analysisData += '\n';
  });

  analysisData += '请从以下维度评价：1) 各模型响应速度对比 2) 成功率 3) 推荐使用的模型';

  try {
    const resp = await fetch(`${getApiBase()}/v1/chat/completions`, {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({
        model: 'glm-5.3-flash',
        messages: [{ role: 'user', content: analysisData }],
        temperature: 0.7,
        max_tokens: 500,
      }),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    const analysis = data.choices?.[0]?.message?.content || '分析失败';
    
    // 显示分析结果
    showToast('AI分析完成', 'success');
    alert('🧠 AI 分析结果\n\n' + analysis);
  } catch (e) {
    showToast(`分析失败: ${e.message}`, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '🧠 AI分析';
}
</script>
