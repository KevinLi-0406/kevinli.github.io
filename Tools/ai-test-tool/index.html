<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI API 测试工具</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-primary: #0a0b10;
    --bg-secondary: #12131a;
    --bg-card: #1a1b26;
    --bg-hover: #24253a;
    --bg-input: #16171f;
    --accent: #7c6aef;
    --accent-light: #a78bfa;
    --accent-glow: rgba(124,106,239,0.15);
    --text-primary: #e4e4ed;
    --text-secondary: #8888a0;
    --text-muted: #55556a;
    --border: #2a2b3d;
    --border-light: #353650;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
    --info: #3b82f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,106,239,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(59,130,246,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .top-bar {
    background: rgba(18,19,26,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .card:hover { border-color: var(--border-light); }
  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 15px;
  }
  .card-body { padding: 20px; }

  .input-field {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-field:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .input-field::placeholder { color: var(--text-muted); }

  .btn {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #6347e0);
    color: white;
    box-shadow: 0 4px 16px rgba(124,106,239,0.3);
  }
  .btn-primary:hover:not(:disabled) {
    box-shadow: 0 6px 24px rgba(124,106,239,0.45);
    transform: translateY(-1px);
  }
  .btn-secondary {
    background: var(--bg-hover);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--border); }
  .btn-success { background: var(--success); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-sm { padding: 7px 14px; font-size: 13px; border-radius: 8px; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-dot.connected { background: var(--success); box-shadow: 0 0 8px rgba(34,197,94,0.5); }
  .status-dot.disconnected { background: var(--danger); }
  .status-dot.testing { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .model-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
    max-height: 420px;
    overflow-y: auto;
    padding: 4px;
  }
  .model-chip {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    position: relative;
  }
  .model-chip:hover {
    border-color: var(--accent);
    background: var(--bg-hover);
  }
  .model-chip.selected {
    border-color: var(--accent);
    background: var(--accent-glow);
  }
  .model-chip .model-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .model-chip .model-info {
    overflow: hidden;
    flex: 1;
    min-width: 0;
  }
  .model-chip .model-name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .model-chip .model-id {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .model-chip .model-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .model-tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 5px;
    white-space: nowrap;
    line-height: 1.4;
  }
  .model-chip .check-mark {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: white;
  }
  .model-chip.selected .check-mark { display: flex; }

  /* ===== 【新增】搜索框样式 ===== */
  .search-box {
    position: relative;
    margin-bottom: 14px;
  }
  .search-box input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 10px 16px 10px 40px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .search-box input::placeholder { color: var(--text-muted); }
  .search-box .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 14px;
    pointer-events: none;
  }
  .search-box .clear-btn {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    display: none;
  }
  .search-box .clear-btn:hover { color: var(--text-primary); }
  .search-box.has-value .clear-btn { display: block; }

  /* ===== 标签筛选栏 ===== */
  .tag-filter-section {
    margin-bottom: 14px;
  }
  .tag-filter-group {
    margin-bottom: 10px;
  }
  .tag-filter-group-label {
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }
  .tag-filter-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag-filter-btn {
    font-size: 12px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-secondary);
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .tag-filter-btn:hover {
    border-color: var(--border-light);
    background: var(--bg-hover);
  }
  .tag-filter-btn.active {
    border-color: var(--accent);
    background: var(--accent-glow);
    color: var(--accent-light);
  }
  .tag-filter-btn .tag-count {
    font-size: 10px;
    background: rgba(255,255,255,0.08);
    padding: 1px 5px;
    border-radius: 4px;
    min-width: 16px;
    text-align: center;
  }
  .tag-filter-btn.active .tag-count {
    background: rgba(124,106,239,0.3);
  }

  .chat-container {
    display: flex;
    flex-direction: column;
    height: 600px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .message {
    display: flex;
    gap: 12px;
    animation: msgIn 0.3s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { flex-direction: row-reverse; }
  .message .avatar {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .message.user .avatar { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .message.assistant .avatar { background: linear-gradient(135deg, var(--accent), #6347e0); }
  .message .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.7;
    position: relative;
  }
  .message.user .bubble {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.assistant .bubble {
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .message .meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .message .meta .speed-badge {
    background: rgba(124,106,239,0.15);
    color: var(--accent-light);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
  }
  .message .meta .model-badge {
    background: rgba(59,130,246,0.12);
    color: #60a5fa;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 500;
  }

  .message-round {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 16px;
    background: rgba(26,27,38,0.5);
    border: 1px solid var(--border);
    border-radius: 14px;
    animation: msgIn 0.3s ease;
  }
  .round-user-msg {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.7;
    align-self: center;
    max-width: 85%;
    word-break: break-word;
    position: relative;
  }
  .round-user-msg .user-label {
    font-size: 11px;
    opacity: 0.7;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .round-models-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .model-response-col {
    display: flex;
    flex-direction: column;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg-card);
    transition: border-color 0.2s;
  }
  .model-response-col:hover {
    border-color: var(--border-light);
  }
  .model-response-col.col-error {
    border-color: rgba(239,68,68,0.4);
  }
  .model-response-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--bg-input);
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
  }
  .model-response-header .col-icon {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
  }
  .model-response-header .col-name {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .model-response-header .col-speed {
    font-size: 11px;
    color: var(--accent-light);
    background: rgba(124,106,239,0.15);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
    white-space: nowrap;
  }
  .model-response-body {
    padding: 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 50px;
    max-height: 400px;
    overflow-y: auto;
  }
  .model-response-bubble {
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    line-height: 1.7;
    word-break: break-word;
  }
  .model-response-bubble pre {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
  }
  .model-response-bubble code {
    background: rgba(0,0,0,0.2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .model-response-bubble pre code {
    background: none;
    padding: 0;
  }
  .model-response-bubble p { margin: 4px 0; }
  .model-response-bubble ul, .model-response-bubble ol { margin: 4px 0; padding-left: 20px; }
  .model-response-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 2px 4px;
  }
  .model-response-meta .speed-badge {
    background: rgba(124,106,239,0.15);
    color: var(--accent-light);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
  }

  .chat-input-area {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .chat-input-area textarea {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    font-family: inherit;
    line-height: 1.5;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .chat-input-area textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .send-btn {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) {
    box-shadow: 0 4px 16px rgba(124,106,239,0.4);
    transform: translateY(-1px);
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .typing-indicator {
    display: flex; gap: 4px; padding: 4px 0;
  }
  .typing-indicator span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: typing 1.4s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%,60%,100% { opacity: 0.3; transform: scale(0.8); }
    30% { opacity: 1; transform: scale(1); }
  }

  .toast-container {
    position: fixed; top: 20px; right: 20px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    animation: toastIn 0.3s ease;
    display: flex; align-items: center; gap: 10px;
    min-width: 300px;
  }
  .toast.success { border-left: 4px solid var(--success); }
  .toast.error { border-left: 4px solid var(--danger); }
  .toast.info { border-left: 4px solid var(--accent); }
  .toast.warning { border-left: 4px solid var(--warning); }
  @keyframes toastIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }
  .stat-item {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
  }
  .stat-item .val {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-light), #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-item .lbl {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .selected-models {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .selected-tag {
    background: var(--accent-glow);
    border: 1px solid rgba(124,106,239,0.3);
    color: var(--accent-light);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .selected-tag:hover {
    background: rgba(124,106,239,0.25);
  }
  .selected-tag .remove {
    font-size: 14px;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .selected-tag .remove:hover { opacity: 1; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    gap: 12px;
  }
  .empty-state .icon { font-size: 48px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  @media (max-width: 768px) {
    .model-grid { grid-template-columns: 1fr; }
    .message .bubble { max-width: 85%; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .round-models-grid { grid-template-columns: 1fr; }
    .round-user-msg { max-width: 100%; }
  }

  .bubble pre {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
  }
  .bubble code {
    background: rgba(0,0,0,0.2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .bubble pre code {
    background: none;
    padding: 0;
  }
  .bubble p { margin: 4px 0; }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="top-bar">
  <div class="max-w-[1400px] mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#6347e0);display:flex;align-items:center;justify-content:center;font-size:18px;">🤖</div>
      <div>
        <h1 style="font-size:18px;font-weight:700;">AI API 测试工具</h1>
        <p style="font-size:11px;color:var(--text-muted);">Model Comparison & Benchmark</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="connStatus" class="flex items-center gap-2 text-sm" style="color:var(--text-muted);">
        <span class="status-dot disconnected" id="statusDot"></span>
        <span id="statusText">未连接</span>
      </span>
    </div>
  </div>
</div>

<div class="max-w-[1400px] mx-auto px-6 py-6 relative z-10">

  <div class="card mb-5">
    <div class="card-header">
      <span>🔑</span> API 配置
    </div>
    <div class="card-body">
      <div class="flex flex-wrap gap-4 items-end">
        <div class="flex-1" style="min-width:300px;">
          <label style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px;">API 地址</label>
          <input type="text" id="apiBase" class="input-field" value="https://ai-service.segway-ninebot.com" placeholder="https://your-api-endpoint.com">
        </div>
        <div class="flex-1" style="min-width:250px;">
          <label style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px;">API Key（仅本次使用，不保存）</label>
          <div style="position:relative;">
            <input type="password" id="apiKey" class="input-field" placeholder="sk-xxxx 或你的 API Key" style="padding-right:44px;">
            <button onclick="toggleKeyVisibility()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;padding:4px;" id="eyeBtn">👁️</button>
          </div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-primary" id="testBtn" onclick="testConnection()">
            <span id="testBtnIcon">📡</span> 测试连通
          </button>
          <button class="btn btn-secondary" onclick="fetchModels()">
            📋 获取模型
          </button>
        </div>
      </div>
      <div id="testResult" class="mt-4 hidden" style="border-radius:10px;padding:14px 18px;font-size:13px;"></div>
    </div>
  </div>

  <div class="card mb-5">
    <div class="card-header">
      <span>🧠</span> 可用模型
      <span id="modelCount" style="margin-left:auto;font-size:12px;color:var(--text-muted);font-weight:400;"></span>
      <button class="btn btn-sm btn-secondary" id="selectAllBtn" onclick="toggleSelectAll()" style="display:none;">✅ 全选</button>
    </div>
    <div class="card-body">
      <!-- 【新增】搜索框 -->
      <div class="search-box" id="searchBox">
        <span class="search-icon">🔍</span>
        <input type="text" id="modelSearch" placeholder="搜索模型名称..." oninput="handleSearch()">
        <button class="clear-btn" onclick="clearSearch()">✕</button>
      </div>
      <div id="tagFilterContainer" style="display:none;"></div>
      <div id="modelListContainer">
        <div class="empty-state" style="height:120px;">
          <p>👆 点击「获取模型」或「测试连通」加载可用模型列表</p>
        </div>
      </div>
      <div id="selectedModelsArea" class="hidden">
        <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-top:16px;margin-bottom:4px;">
          已选模型（对话时将同时发送给所有已选模型）
        </div>
        <div class="selected-models" id="selectedModelsTags"></div>
      </div>
    </div>
  </div>

  <div class="flex gap-5 flex-wrap">
    <div class="card flex-1" style="min-width:400px;">
      <div class="card-header">
        <span>💬</span> 对话测试
        <span id="chatModelHint" style="margin-left:4px;font-size:12px;color:var(--text-muted);font-weight:400;"></span>
        <button class="btn btn-sm btn-secondary" style="margin-left:auto;" onclick="clearChat()">🗑️ 清空</button>
      </div>
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <div class="empty-state">
            <div class="icon">💬</div>
            <p>选择模型后输入消息开始测试</p>
          </div>
        </div>
        <div class="chat-input-area">
          <textarea id="chatInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1" onkeydown="handleInputKey(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
        </div>
      </div>
    </div>

    <div class="card" style="width:320px;min-width:280px;">
      <div class="card-header">
        <span>📊</span> 性能统计
      </div>
      <div class="card-body">
        <div class="stat-row" id="statsGrid">
          <div class="stat-item">
            <div class="val" id="statTotal">0</div>
            <div class="lbl">总请求</div>
          </div>
          <div class="stat-item">
            <div class="val" id="statAvgSpeed">-</div>
            <div class="lbl">平均耗时</div>
          </div>
          <div class="stat-item">
            <div class="val" id="statFastest">-</div>
            <div class="lbl">最快响应</div>
          </div>
          <div class="stat-item">
            <div class="val" id="statSlowest">-</div>
            <div class="lbl">最慢响应</div>
          </div>
        </div>
        <div style="margin-top:20px;">
          <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">各模型耗时</div>
          <div id="modelStats" class="flex flex-col gap-3">
            <div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px 0;">暂无数据</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 标签配置 ====================
const TAG_CONFIG = {
  'chat':      { label: '对话',     color: '#3b82f6', bg: 'rgba(59,130,246,0.12)' },
  'reasoning': { label: '推理',     color: '#f59e0b', bg: 'rgba(245,158,11,0.12)' },
  'vision':    { label: '视觉',     color: '#22c55e', bg: 'rgba(34,197,94,0.12)' },
  'embed':     { label: '嵌入',     color: '#a78bfa', bg: 'rgba(167,139,250,0.12)' },
  'rerank':    { label: '重排',     color: '#f472b6', bg: 'rgba(244,114,182,0.12)' },
  'tts':       { label: '语音合成', color: '#fb923c', bg: 'rgba(251,146,60,0.12)' },
  'stt':       { label: '语音识别', color: '#34d399', bg: 'rgba(52,211,53,0.12)' },
  'code':      { label: '代码',     color: '#60a5fa', bg: 'rgba(96,165,250,0.12)' },
  'image':     { label: '图像生成', color: '#e879f9', bg: 'rgba(232,121,249,0.12)' },
  'light':     { label: '轻量',     color: '#4ade80', bg: 'rgba(74,222,128,0.12)' },
  'medium':    { label: '标准',     color: '#fbbf24', bg: 'rgba(251,191,36,0.12)' },
  'heavy':     { label: '重度推理', color: '#f87171', bg: 'rgba(248,113,113,0.12)' },
};

const MODEL_TAG_RULES = [
  { pattern: /embed/i,                          tags: ['embed'] },
  { pattern: /rerank|rank/i,                    tags: ['rerank'] },
  { pattern: /whisper|asr|speech.*recog|stt/i,  tags: ['stt'] },
  { pattern: /tts|speech.*synth|voice/i,        tags: ['tts'] },
  { pattern: /dall|image.*gen|stable.*diff|flux|midjourney/i, tags: ['image'] },
  { pattern: /vision|vl|llava|qwen.*vl|gpt.*vision|gemini.*vision/i, tags: ['vision'] },
  { pattern: /code|codex|deepseek-coder|starcoder/i, tags: ['code', 'chat'] },
  { pattern: /o1(?!.*mini)|o3(?!.*mini)|deepseek-r1|qwq|reasoning|thinking/i, tags: ['reasoning', 'heavy'] },
  { pattern: /o1-mini|o3-mini|o4-mini|qwen.*plus|qwen.*max/i, tags: ['reasoning', 'medium'] },
  { pattern: /mini|nano|lite|tiny|flash|turbo|fast|haiku|gpt-4o-mini/i, tags: ['light'] },
  { pattern: /gpt|claude|gemini|llama|qwen|deepseek|glm|mistral|mixtral|yi|baichuan|chat/i, tags: ['chat'] },
];

function getModelTags(modelId) {
  const tags = [];
  const id = modelId || '';
  for (const rule of MODEL_TAG_RULES) {
    if (rule.pattern.test(id)) {
      tags.push(...rule.tags);
      break;
    }
  }
  return [...new Set(tags)];
}

// ==================== 状态 ====================
const state = {
  models: [],
  selectedModels: new Set(),
  chatHistory: [],
  requestLog: [],
  isConnected: false,
  isSending: false,
  activeTagFilters: new Set(),
  searchQuery: '',  // 【新增】搜索关键词
};

document.addEventListener('DOMContentLoaded', () => {
  const savedBase = localStorage.getItem('ai_test_api_base');
  if (savedBase) document.getElementById('apiBase').value = savedBase;

  const textarea = document.getElementById('chatInput');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    updateSendBtnState();
  });
});

function updateSendBtnState() {
  const hasText = document.getElementById('chatInput').value.trim().length > 0;
  document.getElementById('sendBtn').disabled = !hasText || state.isSending;
}

function getApiBase() {
  return document.getElementById('apiBase').value.replace(/\/+$/, '');
}
function getApiKey() {
  return document.getElementById('apiKey').value.trim();
}
function getHeaders() {
  const key = getApiKey();
  const h = { 'Content-Type': 'application/json' };
  if (key) h['Authorization'] = `Bearer ${key}`;
  return h;
}

function toggleKeyVisibility() {
  const input = document.getElementById('apiKey');
  const btn = document.getElementById('eyeBtn');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  toast.innerHTML = `<span>${icons[type] || ''}</span><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    toast.style.transition = 'all 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

function formatTime(ms) {
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(2) + 's';
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = text
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
  return html;
}

async function testConnection() {
  if (!getApiKey()) {
    showToast('请先输入 API Key', 'error');
    return;
  }

  const btn = document.getElementById('testBtn');
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const result = document.getElementById('testResult');

  btn.disabled = true;
  btn.innerHTML = '<span class="status-dot testing" style="width:12px;height:12px;"></span> 测试中...';
  dot.className = 'status-dot testing';
  text.textContent = '测试中...';

  const startTime = performance.now();

  try {
    const resp = await fetch(`${getApiBase()}/v1/models`, {
      method: 'GET',
      headers: getHeaders(),
    });
    const elapsed = Math.round(performance.now() - startTime);

    if (resp.ok) {
      const data = await resp.json();
      const modelCount = data.data ? data.data.length : 0;
      state.isConnected = true;
      dot.className = 'status-dot connected';
      text.textContent = `已连接 (${elapsed}ms)`;
      result.style.display = 'block';
      result.style.background = 'rgba(34,197,94,0.08)';
      result.style.border = '1px solid rgba(34,197,94,0.2)';
      result.style.color = '#4ade80';
      result.innerHTML = `✅ <strong>连接成功</strong> — 延迟 ${elapsed}ms，发现 ${modelCount} 个模型`;
      result.classList.remove('hidden');
      showToast(`连接成功！延迟 ${elapsed}ms`, 'success');

      localStorage.setItem('ai_test_api_base', getApiBase());

      if (data.data) {
        state.models = data.data;
        autoSelectAllModels();
        renderTagFilterBar();
        renderModels();
        updateSendBtnState();
      }
    } else {
      throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
    }
  } catch (e) {
    state.isConnected = false;
    dot.className = 'status-dot disconnected';
    text.textContent = '连接失败';
    result.style.display = 'block';
    result.style.background = 'rgba(239,68,68,0.08)';
    result.style.border = '1px solid rgba(239,68,68,0.2)';
    result.style.color = '#f87171';
    result.innerHTML = `❌ <strong>连接失败</strong> — ${e.message}`;
    result.classList.remove('hidden');
    showToast(`连接失败: ${e.message}`, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '<span id="testBtnIcon">📡</span> 测试连通';
}

async function fetchModels() {
  if (!getApiKey()) {
    showToast('请先输入 API Key', 'error');
    return;
  }

  const container = document.getElementById('modelListContainer');
  container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:var(--text-muted);"><div class="loader" style="width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;"></div> 正在获取模型列表...</div>';

  try {
    const resp = await fetch(`${getApiBase()}/v1/models`, {
      method: 'GET',
      headers: getHeaders(),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    state.models = data.data || [];

    localStorage.setItem('ai_test_api_base', getApiBase());

    autoSelectAllModels();
    renderTagFilterBar();
    renderModels();
    updateSendBtnState();
    showToast(`获取到 ${state.models.length} 个模型，已自动全选`, 'success');
  } catch (e) {
    container.innerHTML = `<div style="padding:20px;text-align:center;color:var(--danger);">❌ 获取失败: ${e.message}</div>`;
    showToast(`获取模型失败: ${e.message}`, 'error');
  }
}

function autoSelectAllModels() {
  state.selectedModels.clear();
  state.models.forEach(m => {
    const id = m.id || 'unknown';
    state.selectedModels.add(id);
  });
}

function toggleSelectAll() {
  if (state.selectedModels.size === state.models.length) {
    state.selectedModels.clear();
    showToast('已取消全选', 'info');
  } else {
    autoSelectAllModels();
    showToast('已全选所有模型', 'success');
  }
  renderModels();
  renderSelectedTags();
  updateSendBtnState();
}

// ==================== 【新增】搜索功能 ====================
function handleSearch() {
  const input = document.getElementById('modelSearch');
  const searchBox = document.getElementById('searchBox');
  state.searchQuery = input.value.trim().toLowerCase();
  
  if (state.searchQuery) {
    searchBox.classList.add('has-value');
  } else {
    searchBox.classList.remove('has-value');
  }
  
  renderModels();
}

function clearSearch() {
  const input = document.getElementById('modelSearch');
  const searchBox = document.getElementById('searchBox');
  input.value = '';
  state.searchQuery = '';
  searchBox.classList.remove('has-value');
  renderModels();
}

// ==================== 标签筛选栏渲染 ====================
function renderTagFilterBar() {
  const container = document.getElementById('tagFilterContainer');
  if (state.models.length === 0) {
    container.style.display = 'none';
    return;
  }

  const tagCounts = {};
  state.models.forEach(m => {
    const tags = getModelTags(m.id);
    tags.forEach(t => {
      tagCounts[t] = (tagCounts[t] || 0) + 1;
    });
  });

  const typeTags = ['chat', 'reasoning', 'vision', 'embed', 'rerank', 'code', 'image', 'tts', 'stt'];
  const strengthTags = ['light', 'medium', 'heavy'];

  let html = '<div class="tag-filter-section">';

  const hasTypeTags = typeTags.some(t => tagCounts[t]);
  if (hasTypeTags) {
    html += '<div class="tag-filter-group">';
    html += '<div class="tag-filter-group-label">📂 模型类型</div>';
    html += '<div class="tag-filter-bar">';
    html += '<button class="tag-filter-btn' + (state.activeTagFilters.size === 0 ? ' active' : '') + '" onclick="clearTagFilters()">全部 <span class="tag-count">' + state.models.length + '</span></button>';
    typeTags.forEach(t => {
      if (!tagCounts[t]) return;
      const cfg = TAG_CONFIG[t];
      const isActive = state.activeTagFilters.has(t);
      const style = isActive ? 'border-color:' + cfg.color + ';background:' + cfg.bg + ';color:' + cfg.color + ';' : '';
      html += '<button class="tag-filter-btn' + (isActive ? ' active' : '') + '" style="' + style + '" onclick="toggleTagFilter(\'' + t + '\')">' + cfg.label + ' <span class="tag-count">' + tagCounts[t] + '</span></button>';
    });
    html += '</div></div>';
  }

  const hasStrengthTags = strengthTags.some(t => tagCounts[t]);
  if (hasStrengthTags) {
    html += '<div class="tag-filter-group">';
    html += '<div class="tag-filter-group-label">⚡ 推理强度</div>';
    html += '<div class="tag-filter-bar">';
    strengthTags.forEach(t => {
      if (!tagCounts[t]) return;
      const cfg = TAG_CONFIG[t];
      const isActive = state.activeTagFilters.has(t);
      const style = isActive ? 'border-color:' + cfg.color + ';background:' + cfg.bg + ';color:' + cfg.color + ';' : '';
      html += '<button class="tag-filter-btn' + (isActive ? ' active' : '') + '" style="' + style + '" onclick="toggleTagFilter(\'' + t + '\')">' + cfg.label + ' <span class="tag-count">' + tagCounts[t] + '</span></button>';
    });
    html += '</div></div>';
  }

  html += '</div>';
  container.innerHTML = html;
  container.style.display = hasTypeTags || hasStrengthTags ? 'block' : 'none';
}

// ==================== 标签筛选交互 ====================
function toggleTagFilter(tag) {
  if (state.activeTagFilters.has(tag)) {
    state.activeTagFilters.delete(tag);
  } else {
    state.activeTagFilters.add(tag);
  }
  renderTagFilterBar();
  renderModels();
}

function clearTagFilters() {
  state.activeTagFilters.clear();
  renderTagFilterBar();
  renderModels();
}

// ==================== 【修改】模型列表渲染（增加搜索 + 标签筛选） ====================
function renderModels() {
  const container = document.getElementById('modelListContainer');
  const countEl = document.getElementById('modelCount');
  const selectAllBtn = document.getElementById('selectAllBtn');

  if (state.models.length === 0) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">暂无模型</div>';
    countEl.textContent = '';
    selectAllBtn.style.display = 'none';
    return;
  }

  // 【修改】按搜索关键词和标签筛选
  let filtered = state.models;
  
  // 搜索筛选
  if (state.searchQuery) {
    filtered = filtered.filter(m => {
      const id = (m.id || '').toLowerCase();
      const owner = (m.owned_by || '').toLowerCase();
      return id.includes(state.searchQuery) || owner.includes(state.searchQuery);
    });
  }
  
  // 标签筛选（OR 逻辑）
  if (state.activeTagFilters.size > 0) {
    filtered = filtered.filter(m => {
      const tags = getModelTags(m.id);
      return [...state.activeTagFilters].some(f => tags.includes(f));
    });
  }

  const visibleCount = filtered.length;
  const totalCount = state.models.length;
  const filterInfo = (state.searchQuery || state.activeTagFilters.size > 0) 
    ? ` · 筛选显示 ${visibleCount}/${totalCount}` 
    : '';
  countEl.textContent = `共 ${totalCount} 个 · 已选 ${state.selectedModels.size} 个${filterInfo}`;
  selectAllBtn.style.display = '';
  if (state.selectedModels.size === state.models.length) {
    selectAllBtn.textContent = '☑️ 取消全选';
  } else {
    selectAllBtn.textContent = '✅ 全选';
  }

  const sorted = [...filtered].sort((a, b) => (a.id || '').localeCompare(b.id || ''));

  if (sorted.length === 0) {
    container.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-muted);">没有匹配当前筛选条件的模型</div>';
    updateChatModelHint();
    return;
  }

  let html = '<div class="model-grid">';
  sorted.forEach(m => {
    const id = m.id || 'unknown';
    const isSelected = state.selectedModels.has(id);
    const icon = getModelIcon(id);
    const tags = getModelTags(id);

    let tagsHtml = '';
    if (tags.length > 0) {
      tagsHtml = '<div class="model-tags">';
      tags.forEach(t => {
        const cfg = TAG_CONFIG[t];
        if (cfg) {
          tagsHtml += '<span class="model-tag" style="color:' + cfg.color + ';background:' + cfg.bg + ';">' + cfg.label + '</span>';
        }
      });
      tagsHtml += '</div>';
    }

    html += `
      <div class="model-chip ${isSelected ? 'selected' : ''}" onclick="toggleModel('${id.replace(/'/g, "\\'")}')" title="${id}">
        <div class="model-icon">${icon}</div>
        <div class="model-info">
          <div class="model-name">${id}</div>
          <div class="model-id">${m.owned_by || m.object || 'model'}</div>
          ${tagsHtml}
        </div>
        <div class="check-mark">✓</div>
      </div>
    `;
  });
  html += '</div>';
  container.innerHTML = html;

  updateChatModelHint();
}

function getModelIcon(id) {
  const lower = id.toLowerCase();
  if (lower.includes('gpt') || lower.includes('openai')) return '🧠';
  if (lower.includes('claude')) return '🎭';
  if (lower.includes('gemini') || lower.includes('google')) return '💎';
  if (lower.includes('llama') || lower.includes('meta')) return '🦙';
  if (lower.includes('qwen') || lower.includes('通义')) return '🔮';
  if (lower.includes('deepseek')) return '🔍';
  if (lower.includes('glm') || lower.includes('chatglm')) return '📚';
  if (lower.includes('mistral') || lower.includes('mixtral')) return '🌊';
  if (lower.includes('yi') || lower.includes('零一')) return '🌟';
  if (lower.includes('baichuan')) return '🐟';
  if (lower.includes('dall') || lower.includes('image')) return '🎨';
  if (lower.includes('whisper') || lower.includes('audio')) return '🎤';
  if (lower.includes('embed')) return '📐';
  return '🤖';
}

function toggleModel(id) {
  if (state.selectedModels.has(id)) {
    state.selectedModels.delete(id);
  } else {
    state.selectedModels.add(id);
  }
  renderModels();
  renderSelectedTags();
  updateSendBtnState();
}

function renderSelectedTags() {
  const area = document.getElementById('selectedModelsArea');
  const tags = document.getElementById('selectedModelsTags');

  if (state.selectedModels.size === 0) {
    area.classList.add('hidden');
    return;
  }

  area.classList.remove('hidden');
  let html = '';
  state.selectedModels.forEach(id => {
    html += `<span class="selected-tag" onclick="toggleModel('${id.replace(/'/g, "\\'")}')">${id} <span class="remove">✕</span></span>`;
  });
  tags.innerHTML = html;

  updateChatModelHint();
}

function updateChatModelHint() {
  const hint = document.getElementById('chatModelHint');
  if (state.selectedModels.size === 0) {
    hint.textContent = '— 未选择模型';
    hint.style.color = 'var(--warning)';
  } else {
    hint.textContent = `— ${state.selectedModels.size} 个模型已选中`;
    hint.style.color = 'var(--text-muted)';
  }
}

function createRoundContainer() {
  const messages = document.getElementById('chatMessages');
  const round = document.createElement('div');
  round.className = 'message-round';
  messages.appendChild(round);
  messages.scrollTop = messages.scrollHeight;
  return round;
}

function createModelColumns(round, models) {
  const grid = document.createElement('div');
  grid.className = 'round-models-grid';
  round.appendChild(grid);

  models.forEach(function(model) {
    const safeId = model.replace(/[^a-zA-Z0-9]/g, '_');
    const col = document.createElement('div');
    col.className = 'model-response-col';
    col.id = 'col-' + safeId;
    col.innerHTML =
      '<div class="model-response-header">' +
        '<div class="col-icon">' + getModelIcon(model) + '</div>' +
        '<span class="col-name" title="' + escAttr(model) + '">' + esc(model) + '</span>' +
        '<span class="col-speed" id="speed-' + safeId + '" style="display:none;"></span>' +
      '</div>' +
      '<div class="model-response-body" id="body-' + safeId + '">' +
        '<div class="typing-indicator" id="loading-' + safeId + '"><span></span><span></span><span></span></div>' +
      '</div>';
    grid.appendChild(col);
  });

  const messages = document.getElementById('chatMessages');
  messages.scrollTop = messages.scrollHeight;
}

function esc(v) { return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(v) { return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  if (state.selectedModels.size === 0) {
    showToast('⚠️ 请先在上方选择至少一个模型', 'warning');
    return;
  }

  if (state.isSending) return;

  state.isSending = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  const messages = document.getElementById('chatMessages');
  if (messages.querySelector('.empty-state')) {
    messages.innerHTML = '';
  }

  const round = createRoundContainer();
  addUserMessage(text, round);
  state.chatHistory.push({ role: 'user', content: text });

  const models = [...state.selectedModels];
  createModelColumns(round, models);

  const promises = models.map(model => sendToModel(model, text));

  await Promise.allSettled(promises);

  state.isSending = false;
  updateSendBtnState();
  updateStats();
}

function addUserMessage(text, round) {
  const target = round || document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'round-user-msg';
  div.innerHTML = '<div class="user-label">👤 你 · ' + new Date().toLocaleTimeString() + '</div>' + esc(text);
  target.appendChild(div);
  const messages = document.getElementById('chatMessages');
  messages.scrollTop = messages.scrollHeight;
}

function addAssistantMessage(model, text, elapsed) {
  const safeId = model.replace(/[^a-zA-Z0-9]/g, '_');
  const body = document.getElementById('body-' + safeId);
  if (!body) return;

  const bubble = document.createElement('div');
  bubble.className = 'model-response-bubble';
  bubble.innerHTML = renderMarkdown(text);
  body.appendChild(bubble);

  const speedEl = document.getElementById('speed-' + safeId);
  if (speedEl) {
    speedEl.textContent = '⚡ ' + formatTime(elapsed);
    speedEl.style.display = '';
  }

  const meta = document.createElement('div');
  meta.className = 'model-response-meta';
  meta.innerHTML = '<span class="speed-badge">⚡ ' + formatTime(elapsed) + '</span><span>' + new Date().toLocaleTimeString() + '</span>';
  body.appendChild(meta);

  const messages = document.getElementById('chatMessages');
  messages.scrollTop = messages.scrollHeight;
}

function addLoadingMessage(model) {
  const safeId = model.replace(/[^a-zA-Z0-9]/g, '_');
  const el = document.getElementById('loading-' + safeId);
  if (el) el.style.display = 'flex';
}

function removeLoadingMessage(model) {
  const safeId = model.replace(/[^a-zA-Z0-9]/g, '_');
  const el = document.getElementById('loading-' + safeId);
  if (el) el.remove();
}

function addErrorMessage(model, error) {
  const safeId = model.replace(/[^a-zA-Z0-9]/g, '_');
  const body = document.getElementById('body-' + safeId);
  if (!body) return;

  const col = document.getElementById('col-' + safeId);
  if (col) col.classList.add('col-error');

  const errDiv = document.createElement('div');
  errDiv.className = 'model-response-bubble';
  errDiv.style.borderColor = 'rgba(239,68,68,0.3)';
  errDiv.innerHTML = '<div style="color:var(--danger);font-size:13px;">❌ ' + esc(error) + '</div>';
  body.appendChild(errDiv);

  const messages = document.getElementById('chatMessages');
  messages.scrollTop = messages.scrollHeight;
}

async function sendToModel(model, userText) {
  addLoadingMessage(model);
  const startTime = performance.now();

  try {
    const msgs = [];
    const history = state.chatHistory.slice(-10);
    for (const h of history) {
      msgs.push({ role: h.role, content: h.content });
    }

    const resp = await fetch(`${getApiBase()}/v1/chat/completions`, {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({
        model: model,
        messages: msgs,
        temperature: 0.7,
        max_tokens: 2048,
      }),
    });

    const elapsed = Math.round(performance.now() - startTime);

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '(空回复)';
    const usage = data.usage;

    removeLoadingMessage(model);
    addAssistantMessage(model, content, elapsed);

    state.chatHistory.push({ role: 'assistant', content, model });

    state.requestLog.push({
      model,
      elapsed,
      tokens: usage?.total_tokens || 0,
      promptTokens: usage?.prompt_tokens || 0,
      completionTokens: usage?.completion_tokens || 0,
      timestamp: Date.now(),
    });

  } catch (e) {
    const elapsed = Math.round(performance.now() - startTime);
    removeLoadingMessage(model);
    addErrorMessage(model, e.message);
    state.requestLog.push({
      model,
      elapsed,
      error: true,
      timestamp: Date.now(),
    });
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function clearChat() {
  state.chatHistory = [];
  state.requestLog = [];
  const messages = document.getElementById('chatMessages');
  messages.innerHTML = `
    <div class="empty-state">
      <div class="icon">💬</div>
      <p>选择模型后输入消息开始测试</p>
    </div>
  `;
  updateStats();
}

function updateStats() {
  const logs = state.requestLog.filter(l => !l.error);
  const total = state.requestLog.length;

  document.getElementById('statTotal').textContent = total;

  if (logs.length === 0) {
    document.getElementById('statAvgSpeed').textContent = '-';
    document.getElementById('statFastest').textContent = '-';
    document.getElementById('statSlowest').textContent = '-';
    document.getElementById('modelStats').innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px 0;">暂无数据</div>';
    return;
  }

  const times = logs.map(l => l.elapsed);
  const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
  const fastest = Math.min(...times);
  const slowest = Math.max(...times);

  document.getElementById('statAvgSpeed').textContent = formatTime(avg);
  document.getElementById('statFastest').textContent = formatTime(fastest);
  document.getElementById('statSlowest').textContent = formatTime(slowest);

  const modelMap = new Map();
  logs.forEach(l => {
    if (!modelMap.has(l.model)) modelMap.set(l.model, []);
    modelMap.get(l.model).push(l.elapsed);
  });

  let html = '';
  const sorted = [...modelMap.entries()].sort((a, b) => {
    const avgA = a[1].reduce((x, y) => x + y, 0) / a[1].length;
    const avgB = b[1].reduce((x, y) => x + y, 0) / b[1].length;
    return avgA - avgB;
  });

  sorted.forEach(([model, times]) => {
    const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
    const min = Math.min(...times);
    const max = Math.max(...times);
    const count = times.length;
    const barWidth = Math.max(10, Math.min(100, (1 - (avg - fastest) / (slowest - fastest || 1)) * 100));
    html += `
      <div style="background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:12px 14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;" title="${model}">${getModelIcon(model)} ${model}</span>
          <span style="font-size:13px;font-weight:700;color:var(--accent-light);">${formatTime(avg)}</span>
        </div>
        <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;">
          <div style="height:100%;width:${barWidth}%;background:linear-gradient(90deg,var(--accent),var(--accent-light));border-radius:2px;transition:width 0.5s;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text-muted);">
          <span>最快 ${formatTime(min)}</span>
          <span>${count} 次</span>
          <span>最慢 ${formatTime(max)}</span>
        </div>
      </div>
    `;
  });

  document.getElementById('modelStats').innerHTML = html;
}

const style = document.createElement('style');
style.textContent = '@keyframes spin { to { transform: rotate(360deg); } }';
document.head.appendChild(style);
</script>
