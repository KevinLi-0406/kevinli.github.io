<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI API 测试工具</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-primary: #0a0b10;
    --bg-card: #1a1b26;
    --bg-hover: #24253a;
    --bg-input: #16171f;
    --accent: #7c6aef;
    --accent-light: #a78bfa;
    --accent-glow: rgba(124,106,239,0.15);
    --text-primary: #e4e4ed;
    --text-secondary: #8888a0;
    --text-muted: #55556a;
    --border: #2a2b3d;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .top-bar {
    background: rgba(18,19,26,0.95);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .card-header {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    font-size: 12px;
  }
  .card-body { padding: 10px; }

  .input-field {
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 12px;
    outline: none;
  }
  .input-field:focus { border-color: var(--accent); }

  .btn {
    padding: 6px 12px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #6347e0); color: white; }
  .btn-secondary { background: var(--bg-hover); color: var(--text-primary); border: 1px solid var(--border); }
  .btn-danger { background: var(--danger); color: white; }
  .btn-warning { background: var(--warning); color: white; }
  .btn-success { background: var(--success); color: white; }
  .btn-xs { padding: 3px 7px; font-size: 10px; }

  .status-dot { width: 8px; height: 8px; border-radius: 50%; }
  .status-dot.connected { background: var(--success); box-shadow: 0 0 6px rgba(34,197,94,0.5); }
  .status-dot.disconnected { background: var(--danger); }
  .status-dot.testing { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* 主布局 */
  .main-layout {
    display: grid;
    grid-template-columns: 1fr 300px;
    height: calc(100vh - 45px);
  }
  .left-panel {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .right-panel {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 模型区域 - 占比更大 */
  .model-section {
    flex: 0 0 42%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .model-section .card-body {
    overflow-y: auto;
    flex: 1;
  }

  /* 对话区域 - 占比更小 */
  .chat-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .model-group-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    background: var(--bg-input);
    border-radius: 5px;
    margin-bottom: 5px;
    font-size: 10px;
    font-weight: 600;
  }
  .model-group-header .count {
    margin-left: auto;
    font-size: 9px;
    padding: 1px 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.05);
  }
  .model-group-header.available { color: var(--success); }
  .model-group-header.unavailable { color: var(--danger); }

  .model-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 5px;
  }
  .model-chip {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 8px;
    font-size: 10px;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 5px;
    position: relative;
  }
  .model-chip:hover { border-color: var(--accent); }
  .model-chip.selected { border-color: var(--accent); background: var(--accent-glow); }
  .model-chip.unavailable { opacity: 0.5; }
  .model-chip .icon {
    width: 20px; height: 20px;
    border-radius: 4px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    flex-shrink: 0;
  }
  .model-chip .info { overflow: hidden; flex: 1; }
  .model-chip .name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 10px;
  }
  .model-chip .meta {
    font-size: 8px;
    color: var(--text-muted);
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
    margin-top: 1px;
  }
  .model-tag {
    font-size: 8px;
    font-weight: 600;
    padding: 0px 3px;
    border-radius: 2px;
  }
  .model-chip .check {
    position: absolute;
    top: 3px; right: 3px;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 7px;
  }
  .model-chip.selected .check { display: flex; }

  /* 筛选栏 */
  .filter-bar {
    display: flex;
    gap: 5px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .search-box {
    position: relative;
    flex: 1;
    min-width: 100px;
  }
  .search-box input {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 5px 8px 5px 22px;
    border-radius: 5px;
    font-size: 10px;
    outline: none;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box .icon {
    position: absolute;
    left: 7px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 9px;
  }
  .filter-btns {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-size: 9px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .filter-btn:hover { border-color: var(--border); }
  .filter-btn.active { border-color: var(--accent); background: var(--accent-glow); color: var(--accent-light); }

  /* 对话区域 */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .message-round {
    padding: 8px;
    background: rgba(26,27,38,0.5);
    border: 1px solid var(--border);
    border-radius: 8px;
  }
  .message-round.reconstructed { border-color: var(--accent); border-style: dashed; }
  .round-user-msg {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 11px;
    max-width: 70%;
    margin-bottom: 6px;
  }
  .round-user-msg .label { font-size: 8px; opacity: 0.7; margin-bottom: 1px; }
  .result-section { margin-top: 4px; }
  .result-header {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 9px;
    font-weight: 600;
    padding: 3px 6px;
    background: var(--bg-input);
    border-radius: 3px;
    cursor: pointer;
    margin-bottom: 3px;
  }
  .result-header:hover { background: var(--bg-hover); }
  .result-header .count { margin-left: auto; font-size: 8px; }
  .result-header.success { color: var(--success); }
  .result-header.failure { color: var(--danger); }
  .round-models-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 5px;
  }
  .model-response-col {
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow: hidden;
    background: var(--bg-card);
  }
  .model-response-col.error { border-color: rgba(239,68,68,0.4); }
  .model-response-header {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 4px 6px;
    background: var(--bg-input);
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    font-weight: 600;
  }
  .model-response-header .icon {
    width: 14px; height: 14px;
    border-radius: 3px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    display: flex; align-items: center; justify-content: center;
    font-size: 7px;
  }
  .model-response-header .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .model-response-header .speed {
    font-size: 8px;
    color: var(--accent-light);
    background: rgba(124,106,239,0.15);
    padding: 1px 4px;
    border-radius: 2px;
  }
  .model-response-body {
    padding: 6px;
    max-height: 120px;
    overflow-y: auto;
    font-size: 11px;
    line-height: 1.4;
  }
  .model-response-body.collapsed { max-height: 30px; overflow: hidden; }
  .model-response-bubble {
    background: var(--bg-hover);
    border-radius: 4px;
    padding: 6px;
    word-break: break-word;
  }
  .model-response-bubble pre {
    background: rgba(0,0,0,0.3);
    border-radius: 3px;
    padding: 4px;
    overflow-x: auto;
    margin: 3px 0;
    font-size: 10px;
  }
  .model-response-bubble code { font-size: 10px; }
  .collapse-toggle {
    padding: 2px;
    background: var(--bg-input);
    border-top: 1px solid var(--border);
    cursor: pointer;
    font-size: 8px;
    color: var(--text-muted);
    text-align: center;
  }

  .chat-input-area {
    border-top: 1px solid var(--border);
    padding: 8px;
    display: flex;
    gap: 5px;
    align-items: flex-end;
  }
  .chat-input-area textarea {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 11px;
    outline: none;
    resize: none;
    min-height: 30px;
    max-height: 60px;
    font-family: inherit;
  }
  .send-btn {
    width: 30px; height: 30px;
    border-radius: 5px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    border: none;
    color: white;
    font-size: 12px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .stop-btn {
    width: 30px; height: 30px;
    border-radius: 5px;
    background: var(--danger);
    border: none;
    color: white;
    font-size: 10px;
    cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
  }
  .stop-btn.visible { display: flex; }

  .typing-indicator { display: flex; gap: 2px; padding: 2px 0; }
  .typing-indicator span {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: typing 1.4s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing { 0%,60%,100% { opacity: 0.3; } 30% { opacity: 1; } }

  /* 右侧面板 */
  .right-section {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border-bottom: 1px solid var(--border);
  }
  .right-section.stats-section { flex: 3; }
  .right-section.history-section { flex: 2; border-bottom: none; }
  .right-section .card-body { overflow-y: auto; flex: 1; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 4px;
    margin-bottom: 8px;
  }
  .stat-item {
    background: var(--bg-input);
    border-radius: 5px;
    padding: 6px;
    text-align: center;
  }
  .stat-item .val {
    font-size: 14px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-light), #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-item .lbl { font-size: 8px; color: var(--text-muted); }

  .stats-controls {
    display: flex;
    gap: 4px;
    margin-bottom: 6px;
    flex-wrap: wrap;
    align-items: center;
  }

  .model-stat-item {
    background: var(--bg-input);
    border-radius: 5px;
    padding: 6px;
    margin-bottom: 4px;
  }
  .model-stat-item .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3px;
  }
  .model-stat-item .name { font-size: 10px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .model-stat-item .speed { font-size: 10px; font-weight: 700; color: var(--accent-light); }
  .model-stat-item .bar {
    height: 2px;
    background: var(--border);
    border-radius: 1px;
    overflow: hidden;
  }
  .model-stat-item .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    border-radius: 1px;
  }
  .model-stat-item .meta {
    display: flex;
    justify-content: space-between;
    font-size: 8px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .history-list {
    border: 1px solid var(--border);
    border-radius: 5px;
    overflow-y: auto;
    flex: 1;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 6px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 10px;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item:hover { background: var(--bg-hover); }
  .history-item .text { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .history-item .time { font-size: 8px; color: var(--text-muted); }
  .history-item .result-count { font-size: 8px; }
  .history-item .retry-btn {
    font-size: 8px;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    cursor: pointer;
  }
  .history-item .retry-btn:hover { background: var(--accent-glow); color: var(--accent-light); }

  .toast-container {
    position: fixed; top: 10px; right: 10px; z-index: 9999;
    display: flex; flex-direction: column; gap: 4px;
  }
  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 11px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    animation: toastIn 0.3s ease;
    display: flex; align-items: center; gap: 5px;
  }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--danger); }
  .toast.info { border-left: 3px solid var(--accent); }
  .toast.warning { border-left: 3px solid var(--warning); }
  @keyframes toastIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    gap: 4px;
  }
  .empty-state .icon { font-size: 24px; opacity: 0.4; }
  .empty-state p { font-size: 11px; }

  /* AI分析结果弹窗 */
  .analysis-modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 10000;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .analysis-content {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    max-width: 600px;
    width: 90%;
    max-height: 80vh;
    overflow-y: auto;
  }
  .analysis-content h3 { margin-bottom: 12px; font-size: 16px; }
  .analysis-content .result { font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .analysis-content .close-btn {
    margin-top: 16px;
    width: 100%;
  }

  @media (max-width: 900px) {
    .main-layout { grid-template-columns: 1fr; }
    .right-panel { display: none; }
  }
</style>
</head>
<body>

<div class="toast-container" id="toastContainer"></div>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="font-size:16px;">🤖</span>
    <span style="font-size:13px;font-weight:700;">AI API 测试工具</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <input type="text" id="apiBase" class="input-field" style="width:220px;" value="https://ai-service.segway-ninebot.com" placeholder="API 地址">
    <div style="position:relative;">
      <input type="password" id="apiKey" class="input-field" style="width:140px;padding-right:24px;" placeholder="API Key">
      <button onclick="toggleKeyVisibility()" style="position:absolute;right:3px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:11px;" id="eyeBtn">👁️</button>
    </div>
    <button class="btn btn-primary" id="fetchBtn" onclick="fetchModels()">📡 获取模型</button>
    <button class="btn btn-warning" onclick="testSelectedModels()" id="testSelBtn" disabled>🔍 测试选中模型</button>
    <span id="connStatus" style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text-muted);">
      <span class="status-dot disconnected" id="statusDot"></span>
      <span id="statusText">未连接</span>
    </span>
  </div>
</div>

<div class="main-layout">
  <!-- 左侧 -->
  <div class="left-panel">
    <!-- 模型选择 - 占比更大 -->
    <div class="model-section card" style="margin:8px 8px 0;">
      <div class="card-header">
        <span>🧠</span> 模型
        <span id="modelCount" style="margin-left:auto;font-size:9px;color:var(--text-muted);"></span>
        <button class="btn btn-xs btn-secondary" id="selectAllBtn" onclick="toggleSelectAll()" style="display:none;">全选</button>
        <button class="btn btn-xs btn-danger" id="clearUnavailableBtn" onclick="clearUnavailableModels()" style="display:none;">清除不可用</button>
      </div>
      <div class="card-body">
        <div class="filter-bar">
          <div class="search-box">
            <span class="icon">🔍</span>
            <input type="text" id="modelSearch" placeholder="搜索模型..." oninput="handleSearch()">
          </div>
          <div class="filter-btns" id="vendorFilters"></div>
        </div>
        <div class="filter-bar">
          <div class="filter-btns" id="typeFilters"></div>
        </div>
        <div id="modelListContainer">
          <div class="empty-state" style="height:50px;">
            <p>点击「获取模型」加载模型列表</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 对话 - 占比更小 -->
    <div class="chat-section card" style="margin:8px;">
      <div class="card-header">
        <span>💬</span> 对话
        <span id="chatModelHint" style="margin-left:4px;font-size:9px;color:var(--text-muted);"></span>
        <button class="btn btn-xs btn-secondary" style="margin-left:auto;" onclick="clearChat()">清空</button>
        <button class="btn btn-xs btn-success" onclick="aiAnalysis()" id="aiAnalysisBtn" disabled>🧠 AI分析</button>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="empty-state">
          <div class="icon">💬</div>
          <p>选择模型后输入消息</p>
        </div>
      </div>
      <div class="chat-input-area">
        <textarea id="chatInput" placeholder="输入消息... (Enter 发送)" rows="1" onkeydown="handleInputKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
        <button class="stop-btn" id="stopBtn" onclick="stopAllRequests()">⏹</button>
      </div>
    </div>
  </div>

  <!-- 右侧 -->
  <div class="right-panel">
    <div class="right-section stats-section">
      <div class="card-header">
        <span>📊</span> 统计
        <div style="margin-left:auto;display:flex;gap:3px;">
          <button class="btn btn-xs btn-secondary active" id="sortAscBtn" onclick="setStatsSort('asc')" title="快→慢">⚡快→慢</button>
          <button class="btn btn-xs btn-secondary" id="sortDescBtn" onclick="setStatsSort('desc')" title="慢→快">⚡慢→快</button>
        </div>
      </div>
      <div class="card-body">
        <div class="stats-grid">
          <div class="stat-item"><div class="val" id="statTotal">0</div><div class="lbl">请求</div></div>
          <div class="stat-item"><div class="val" id="statSuccess">0</div><div class="lbl">成功</div></div>
          <div class="stat-item"><div class="val" id="statFailed">0</div><div class="lbl">失败</div></div>
          <div class="stat-item"><div class="val" id="statAvgSpeed">-</div><div class="lbl">平均</div></div>
        </div>
        <div class="stats-controls">
          <div class="search-box" style="min-width:80px;">
            <span class="icon">🔍</span>
            <input type="text" id="statsSearch" placeholder="搜索..." oninput="handleStatsSearch()">
          </div>
          <div class="filter-btns" id="statsVendorFilters"></div>
        </div>
        <div id="modelStats" style="overflow-y:auto;flex:1;">
          <div style="color:var(--text-muted);font-size:10px;text-align:center;padding:8px;">暂无数据</div>
        </div>
      </div>
    </div>

    <div class="right-section history-section">
      <div class="card-header">
        <span>📜</span> 历史
        <span style="margin-left:auto;font-size:8px;color:var(--text-muted);">最近10条</span>
      </div>
      <div class="card-body" style="display:flex;flex-direction:column;overflow:hidden;">
        <div class="history-list" id="historyPanel">
          <div style="color:var(--text-muted);font-size:10px;text-align:center;padding:10px;">暂无历史</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ========== 供应商配置 ==========
const VENDOR_CONFIG = {
  'gpt': { label: 'OpenAI', color: '#10a37f' },
  'o1': { label: 'OpenAI', color: '#10a37f' },
  'o3': { label: 'OpenAI', color: '#10a37f' },
  'o4': { label: 'OpenAI', color: '#10a37f' },
  'claude': { label: 'Anthropic', color: '#d97706' },
  'gemini': { label: 'Google', color: '#4285f4' },
  'llama': { label: 'Meta', color: '#0668E1' },
  'qwen': { label: 'Qwen', color: '#615ced' },
  'deepseek': { label: 'DeepSeek', color: '#5b6dee' },
  'glm': { label: 'Zhipu', color: '#1e40af' },
  'mistral': { label: 'Mistral', color: '#ff7000' },
  'mixtral': { label: 'Mistral', color: '#ff7000' },
  'yi': { label: 'Yi', color: '#00c2b0' },
  'baichuan': { label: 'Baichuan', color: '#0052d9' },
  'dall': { label: 'OpenAI', color: '#10a37f' },
  'whisper': { label: 'OpenAI', color: '#10a37f' },
};

// ========== 类型配置 ==========
const TYPE_CONFIG = {
  'chat': { label: '对话', color: '#3b82f6', bg: 'rgba(59,130,246,0.15)' },
  'reasoning': { label: '推理', color: '#f59e0b', bg: 'rgba(245,158,11,0.15)' },
  'vision': { label: '视觉', color: '#22c55e', bg: 'rgba(34,197,94,0.15)' },
  'embed': { label: '嵌入', color: '#a78bfa', bg: 'rgba(167,139,250,0.15)' },
  'rerank': { label: '重排', color: '#f472b6', bg: 'rgba(244,114,182,0.15)' },
  'code': { label: '代码', color: '#60a5fa', bg: 'rgba(96,165,250,0.15)' },
  'image': { label: '图像', color: '#e879f9', bg: 'rgba(232,121,249,0.15)' },
};

function getVendor(modelId) {
  const id = modelId.toLowerCase().replace(/^external\//, '');
  for (const [key, config] of Object.entries(VENDOR_CONFIG)) {
    if (id.includes(key)) return config;
  }
  return { label: 'Other', color: '#666' };
}

function getModelTypes(modelId) {
  const id = modelId.toLowerCase().replace(/^external\//, '');
  if (/embed/i.test(id)) return ['embed'];
  if (/rerank|rank/i.test(id)) return ['rerank'];
  if (/vision|vl|llava/i.test(id)) return ['vision'];
  if (/dall|image|flux|sdxl|stable.?diff/i.test(id)) return ['image'];
  if (/code|codex|deepseek-coder/i.test(id)) return ['code'];
  if (/o1(?!.*mini)|o3(?!.*mini)|deepseek-r1|qwq/i.test(id)) return ['reasoning'];
  if (/gpt|claude|gemini|llama|qwen|deepseek|glm|mistral|yi|baichuan|chat/i.test(id)) return ['chat'];
  return ['chat'];
}

function getModelIcon(modelId) {
  const vendor = getVendor(modelId);
  const icons = {
    'OpenAI': '🧠', 'Anthropic': '🎭', 'Google': '💎', 'Meta': '🦙',
    'Qwen': '🔮', 'DeepSeek': '🔍', 'Zhipu': '📚', 'Mistral': '🌊',
    'Yi': '🌟', 'Baichuan': '🐟', 'Other': '🤖'
  };
  return icons[vendor.label] || '🤖';
}

// ========== 状态 ==========
const state = {
  models: [],
  selectedModels: new Set(),
  requestLog: [],
  messageHistory: [],
  isConnected: false,
  isSending: false,
  searchQuery: '',
  activeVendor: null,
  activeType: null,
  currentAbortController: null,
  modelConnectivity: new Map(),
  // 统计区域筛选状态
  statsSortOrder: 'asc',
  statsSearchQuery: '',
  statsActiveVendor: null,
};

// ========== 初始化 ==========
document.addEventListener('DOMContentLoaded', () => {
  const savedBase = localStorage.getItem('ai_test_api_base');
  if (savedBase) document.getElementById('apiBase').value = savedBase;

  const textarea = document.getElementById('chatInput');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 60) + 'px';
    updateSendBtnState();
  });
});

// ========== 工具函数 ==========
function updateSendBtnState() {
  const hasText = document.getElementById('chatInput').value.trim().length > 0;
  document.getElementById('sendBtn').disabled = !hasText || state.isSending;
}

function getApiBase() { return document.getElementById('apiBase').value.replace(/\/+$/, ''); }
function getApiKey() { return document.getElementById('apiKey').value.trim(); }
function getHeaders() {
  const key = getApiKey();
  const h = { 'Content-Type': 'application/json' };
  if (key) h['Authorization'] = `Bearer ${key}`;
  return h;
}

function toggleKeyVisibility() {
  const input = document.getElementById('apiKey');
  const btn = document.getElementById('eyeBtn');
  input.type = input.type === 'password' ? 'text' : 'password';
  btn.textContent = input.type === 'password' ? '👁️' : '🙈';
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  toast.innerHTML = `<span>${icons[type]}</span><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    toast.style.transition = 'all 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 3500);
}

function formatTime(ms) {
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(1) + 's';
}

function renderMarkdown(text) {
  if (!text) return '';
  return text
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function esc(v) { return String(v||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(v) { return String(v||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }

// 生成唯一的 DOM ID（包含 roundId 避免跨轮次冲突）
function makeSafeId(roundId, model) {
  return roundId + '_' + model.replace(/[^a-zA-Z0-9]/g, '_');
}

// ========== 获取模型（原"测试连通"） ==========
async function fetchModels() {
  if (!getApiKey()) { showToast('请先输入 API Key', 'error'); return; }

  const btn = document.getElementById('fetchBtn');
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');

  btn.disabled = true;
  btn.innerHTML = '<span class="status-dot testing" style="width:10px;height:10px;"></span> 获取中...';
  dot.className = 'status-dot testing';
  text.textContent = '获取中...';

  const startTime = performance.now();

  try {
    const resp = await fetch(`${getApiBase()}/v1/models`, { method: 'GET', headers: getHeaders() });
    const elapsed = Math.round(performance.now() - startTime);

    if (resp.ok) {
      const data = await resp.json();
      const modelCount = data.data ? data.data.length : 0;
      state.isConnected = true;
      dot.className = 'status-dot connected';
      text.textContent = `已连接 (${elapsed}ms)`;
      showToast(`获取成功！${modelCount} 个模型`, 'success');
      localStorage.setItem('ai_test_api_base', getApiBase());
      document.getElementById('testSelBtn').disabled = false;
      document.getElementById('aiAnalysisBtn').disabled = false;

      if (data.data) {
        state.models = data.data;
        state.modelConnectivity.clear();
        // 重置筛选
        state.searchQuery = '';
        state.activeVendor = null;
        state.activeType = null;
        document.getElementById('modelSearch').value = '';
        // 全选
        state.selectedModels.clear();
        state.models.forEach(m => state.selectedModels.add(m.id));
        renderVendorFilters();
        renderTypeFilters();
        renderModels();
        updateSendBtnState();
      }
    } else {
      throw new Error(`HTTP ${resp.status}`);
    }
  } catch (e) {
    state.isConnected = false;
    dot.className = 'status-dot disconnected';
    text.textContent = '连接失败';
    showToast(`连接失败: ${e.message}`, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '📡 获取模型';
}

// ========== 测试选中模型 ==========
async function testSelectedModels() {
  if (state.selectedModels.size === 0) { showToast('请先选择模型', 'warning'); return; }
  if (!getApiKey()) { showToast('请先输入 API Key', 'error'); return; }

  const btn = document.getElementById('testSelBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="status-dot testing" style="width:10px;height:10px;"></span> 测试中...';

  const modelsToTest = [...state.selectedModels];
  showToast(`测试 ${modelsToTest.length} 个选中模型...`, 'info');

  let successCount = 0;

  const promises = modelsToTest.map(async (modelId) => {
    const startTime = performance.now();
    try {
      const resp = await fetch(`${getApiBase()}/v1/chat/completions`, {
        method: 'POST',
        headers: getHeaders(),
        body: JSON.stringify({ model: modelId, messages: [{ role: 'user', content: 'Hi' }], max_tokens: 5 }),
      });
      const elapsed = Math.round(performance.now() - startTime);
      if (resp.ok) {
        state.modelConnectivity.set(modelId, { success: true, elapsed });
        successCount++;
      } else {
        const err = await resp.json().catch(() => ({}));
        state.modelConnectivity.set(modelId, { success: false, error: err.error?.message || `HTTP ${resp.status}` });
      }
    } catch (e) {
      state.modelConnectivity.set(modelId, { success: false, error: e.message });
    }
  });

  await Promise.all(promises);

  btn.disabled = false;
  btn.innerHTML = '🔍 测试选中模型';
  const failCount = modelsToTest.length - successCount;
  showToast(`完成：${successCount} 可用，${failCount} 不可用`, successCount > 0 ? 'success' : 'error');
  renderModels();
}

// ========== 清除不可用模型 ==========
function clearUnavailableModels() {
  const unavailableIds = [];
  state.modelConnectivity.forEach((status, id) => {
    if (!status.success) unavailableIds.push(id);
  });
  
  state.models = state.models.filter(m => !unavailableIds.includes(m.id));
  unavailableIds.forEach(id => {
    state.selectedModels.delete(id);
    state.modelConnectivity.delete(id);
  });
  
  renderVendorFilters();
  renderTypeFilters();
  renderModels();
  updateSendBtnState();
  showToast(`已清除 ${unavailableIds.length} 个不可用模型`, 'success');
}

// ========== 筛选 ==========
function toggleSelectAll() {
  const filtered = getFilteredModels();
  const allSelected = filtered.every(m => state.selectedModels.has(m.id));
  if (allSelected) {
    filtered.forEach(m => state.selectedModels.delete(m.id));
  } else {
    filtered.forEach(m => state.selectedModels.add(m.id));
  }
  renderModels();
  updateSendBtnState();
}

function handleSearch() {
  state.searchQuery = document.getElementById('modelSearch').value.trim().toLowerCase();
  renderModels();
}

function renderVendorFilters() {
  const container = document.getElementById('vendorFilters');
  const vendors = new Map();
  state.models.forEach(m => {
    const vendor = getVendor(m.id);
    vendors.set(vendor.label, (vendors.get(vendor.label) || 0) + 1);
  });

  let html = `<button class="filter-btn ${!state.activeVendor ? 'active' : ''}" onclick="filterByVendor(null)">全部</button>`;
  vendors.forEach((count, label) => {
    const isActive = state.activeVendor === label;
    html += `<button class="filter-btn ${isActive ? 'active' : ''}" onclick="filterByVendor('${label}')">${label}(${count})</button>`;
  });
  container.innerHTML = html;
}

function renderTypeFilters() {
  const container = document.getElementById('typeFilters');
  const types = new Map();
  state.models.forEach(m => {
    getModelTypes(m.id).forEach(t => {
      types.set(t, (types.get(t) || 0) + 1);
    });
  });

  let html = `<button class="filter-btn ${!state.activeType ? 'active' : ''}" onclick="filterByType(null)">全部类型</button>`;
  types.forEach((count, type) => {
    const config = TYPE_CONFIG[type];
    if (!config) return;
    const isActive = state.activeType === type;
    html += `<button class="filter-btn ${isActive ? 'active' : ''}" onclick="filterByType('${type}')" style="${isActive ? `border-color:${config.color};color:${config.color};background:${config.bg};` : ''}">${config.label}(${count})</button>`;
  });
  container.innerHTML = html;
}

function filterByVendor(vendor) {
  state.activeVendor = vendor;
  renderVendorFilters();
  renderModels();
}

function filterByType(type) {
  state.activeType = type;
  renderTypeFilters();
  renderModels();
}

function getFilteredModels() {
  let filtered = state.models;
  if (state.searchQuery) {
    filtered = filtered.filter(m => m.id.toLowerCase().includes(state.searchQuery));
  }
  if (state.activeVendor) {
    filtered = filtered.filter(m => getVendor(m.id).label === state.activeVendor);
  }
  if (state.activeType) {
    filtered = filtered.filter(m => getModelTypes(m.id).includes(state.activeType));
  }
  return filtered;
}

// ========== 渲染模型列表 ==========
function renderModels() {
  const container = document.getElementById('modelListContainer');
  const countEl = document.getElementById('modelCount');
  const selectAllBtn = document.getElementById('selectAllBtn');
  const clearBtn = document.getElementById('clearUnavailableBtn');

  if (state.models.length === 0) {
    container.innerHTML = '<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:11px;">暂无模型</div>';
    countEl.textContent = '';
    selectAllBtn.style.display = 'none';
    clearBtn.style.display = 'none';
    return;
  }

  const filtered = getFilteredModels();
  const allSelected = filtered.length > 0 && filtered.every(m => state.selectedModels.has(m.id));
  selectAllBtn.textContent = allSelected ? '取消全选' : '全选';
  selectAllBtn.style.display = '';

  const hasUnavailable = [...state.modelConnectivity.values()].some(s => !s.success);
  clearBtn.style.display = hasUnavailable ? '' : 'none';

  countEl.textContent = `${filtered.length}/${state.models.length} · 已选 ${state.selectedModels.size}`;

  const availableModels = [];
  const unavailableModels = [];
  
  filtered.forEach(m => {
    const conn = state.modelConnectivity.get(m.id);
    if (conn && !conn.success) {
      unavailableModels.push(m);
    } else {
      availableModels.push(m);
    }
  });

  let html = '';

  if (availableModels.length > 0) {
    html += `<div class="model-group-header available">✅ 可用 <span class="count">${availableModels.length}</span></div>`;
    html += '<div class="model-grid">';
    availableModels.forEach(m => {
      const isSelected = state.selectedModels.has(m.id);
      const vendor = getVendor(m.id);
      const types = getModelTypes(m.id);
      const conn = state.modelConnectivity.get(m.id);
      const speedText = conn?.elapsed ? formatTime(conn.elapsed) : '';
      const typeTags = types.map(t => {
        const cfg = TYPE_CONFIG[t];
        return cfg ? `<span class="model-tag" style="color:${cfg.color};background:${cfg.bg};">${cfg.label}</span>` : '';
      }).join('');
      html += `
        <div class="model-chip ${isSelected ? 'selected' : ''}" onclick="toggleModel('${escAttr(m.id)}')" title="${esc(m.id)}">
          <div class="icon">${getModelIcon(m.id)}</div>
          <div class="info">
            <div class="name">${esc(m.id)}</div>
            <div class="meta">
              <span class="model-tag" style="color:${vendor.color};background:${vendor.color}22;">${vendor.label}</span>
              ${typeTags}
              ${speedText ? `<span style="color:var(--success);">⚡${speedText}</span>` : ''}
            </div>
          </div>
          <div class="check">✓</div>
        </div>
      `;
    });
    html += '</div>';
  }

  if (unavailableModels.length > 0) {
    html += `<div class="model-group-header unavailable" style="margin-top:8px;">❌ 不可用 <span class="count">${unavailableModels.length}</span></div>`;
    html += '<div class="model-grid">';
    unavailableModels.forEach(m => {
      const isSelected = state.selectedModels.has(m.id);
      const vendor = getVendor(m.id);
      const conn = state.modelConnectivity.get(m.id);
      const errorText = conn?.error || '未知错误';
      html += `
        <div class="model-chip unavailable ${isSelected ? 'selected' : ''}" onclick="toggleModel('${escAttr(m.id)}')" title="${esc(errorText)}">
          <div class="icon" style="opacity:0.5;">${getModelIcon(m.id)}</div>
          <div class="info">
            <div class="name">${esc(m.id)}</div>
            <div class="meta">
              <span class="model-tag" style="color:${vendor.color};background:${vendor.color}22;">${vendor.label}</span>
              <span style="color:var(--danger);">✗ ${esc(errorText.substring(0, 15))}</span>
            </div>
          </div>
          <div class="check">✓</div>
        </div>
      `;
    });
    html += '</div>';
  }

  container.innerHTML = html;
  updateChatModelHint();
}

function toggleModel(id) {
  if (state.selectedModels.has(id)) {
    state.selectedModels.delete(id);
  } else {
    state.selectedModels.add(id);
  }
  renderModels();
  updateSendBtnState();
}

function updateChatModelHint() {
  const hint = document.getElementById('chatModelHint');
  if (state.selectedModels.size === 0) {
    hint.textContent = '— 未选择模型';
    hint.style.color = 'var(--warning)';
  } else {
    hint.textContent = `— ${state.selectedModels.size} 个模型`;
    hint.style.color = 'var(--text-muted)';
  }
}

// ========== 对话 ==========
function createRoundContainer() {
  const messages = document.getElementById('chatMessages');
  const round = document.createElement('div');
  round.className = 'message-round';
  messages.appendChild(round);
  messages.scrollTop = messages.scrollHeight;
  return round;
}

function addUserMessage(text, round) {
  const div = document.createElement('div');
  div.className = 'round-user-msg';
  div.innerHTML = `<div class="label">👤 你 · ${new Date().toLocaleTimeString()}</div>${esc(text)}`;
  round.insertBefore(div, round.firstChild);
}

function createModelColumns(round, models, roundId) {
  const successSection = document.createElement('div');
  successSection.className = 'result-section';
  successSection.innerHTML = `
    <div class="result-header success" onclick="toggleSection(this)">
      <span>✅ 成功</span>
      <span class="count" id="success-count-${roundId}">0</span>
    </div>
    <div class="round-models-grid" id="success-grid-${roundId}"></div>
  `;
  
  const failureSection = document.createElement('div');
  failureSection.className = 'result-section';
  failureSection.innerHTML = `
    <div class="result-header failure" onclick="toggleSection(this)">
      <span>❌ 失败</span>
      <span class="count" id="failure-count-${roundId}">0</span>
    </div>
    <div class="round-models-grid" id="failure-grid-${roundId}"></div>
  `;
  
  round.appendChild(successSection);
  round.appendChild(failureSection);
  
  models.forEach(model => {
    const safeId = makeSafeId(roundId, model);
    const col = document.createElement('div');
    col.className = 'model-response-col';
    col.id = 'col-' + safeId;
    col.dataset.model = model;
    col.innerHTML = `
      <div class="model-response-header">
        <div class="icon">${getModelIcon(model)}</div>
        <span class="name" title="${escAttr(model)}">${esc(model)}</span>
        <span class="speed" id="speed-${safeId}" style="display:none;"></span>
      </div>
      <div class="model-response-body" id="body-${safeId}">
        <div class="typing-indicator" id="loading-${safeId}"><span></span><span></span><span></span></div>
      </div>
      <div class="collapse-toggle" onclick="toggleCollapse(this)">收起 ▲</div>
    `;
    document.getElementById('success-grid-' + roundId).appendChild(col);
  });
}

function toggleSection(header) {
  const grid = header.nextElementSibling;
  grid.style.display = grid.style.display === 'none' ? '' : 'none';
}

function toggleCollapse(toggle) {
  const body = toggle.previousElementSibling;
  if (body.classList.contains('collapsed')) {
    body.classList.remove('collapsed');
    toggle.textContent = '收起 ▲';
  } else {
    body.classList.add('collapsed');
    toggle.textContent = '展开 ▼';
  }
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  if (state.selectedModels.size === 0) { showToast('请先选择模型', 'warning'); return; }
  if (state.isSending) return;

  state.isSending = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('stopBtn').classList.add('visible');

  const messages = document.getElementById('chatMessages');
  if (messages.querySelector('.empty-state')) messages.innerHTML = '';

  const roundId = 'round-' + Date.now();
  const round = createRoundContainer();
  round.id = roundId;
  addUserMessage(text, round);
  
  const models = [...state.selectedModels];
  createModelColumns(round, models, roundId);

  state.currentAbortController = new AbortController();
  const signal = state.currentAbortController.signal;

  const historyEntry = {
    id: roundId,
    text: text,
    timestamp: Date.now(),
    models: models,
    results: new Map(),
  };
  state.messageHistory.unshift(historyEntry);
  if (state.messageHistory.length > 10) state.messageHistory.pop();
  renderHistory();

  const promises = models.map(model => sendToModel(model, text, roundId, signal, historyEntry));
  await Promise.allSettled(promises);

  state.isSending = false;
  state.currentAbortController = null;
  document.getElementById('stopBtn').classList.remove('visible');
  updateSendBtnState();
  updateStats();
  renderHistory(); // 最终更新
}

function stopAllRequests() {
  if (state.currentAbortController) {
    state.currentAbortController.abort();
    showToast('已停止', 'warning');
  }
}

function addAssistantMessage(model, text, elapsed, roundId) {
  const safeId = makeSafeId(roundId, model);
  const body = document.getElementById('body-' + safeId);
  if (!body) return;

  // 移除 loading indicator
  const loading = document.getElementById('loading-' + safeId);
  if (loading) loading.remove();

  const bubble = document.createElement('div');
  bubble.className = 'model-response-bubble';
  bubble.innerHTML = renderMarkdown(text);
  body.appendChild(bubble);

  const speedEl = document.getElementById('speed-' + safeId);
  if (speedEl) {
    speedEl.textContent = '⚡' + formatTime(elapsed);
    speedEl.style.display = '';
  }
}

function addErrorMessage(model, error, roundId) {
  const safeId = makeSafeId(roundId, model);
  const body = document.getElementById('body-' + safeId);
  if (!body) return;

  // 移除 loading indicator
  const loading = document.getElementById('loading-' + safeId);
  if (loading) loading.remove();

  const col = document.getElementById('col-' + safeId);
  if (col) {
    col.classList.add('error');
    const failureGrid = document.getElementById('failure-grid-' + roundId);
    if (failureGrid) {
      failureGrid.appendChild(col);
      const successCount = document.getElementById('success-grid-' + roundId).children.length;
      const failureCount = document.getElementById('failure-grid-' + roundId).children.length;
      document.getElementById('success-count-' + roundId).textContent = successCount;
      document.getElementById('failure-count-' + roundId).textContent = failureCount;
    }
  }

  const errDiv = document.createElement('div');
  errDiv.className = 'model-response-bubble';
  errDiv.style.borderColor = 'rgba(239,68,68,0.3)';
  errDiv.innerHTML = `<div style="color:var(--danger);font-size:10px;">❌ ${esc(error)}</div>`;
  body.appendChild(errDiv);
}

async function sendToModel(model, userText, roundId, signal, historyEntry) {
  const startTime = performance.now();
  try {
    const resp = await fetch(`${getApiBase()}/v1/chat/completions`, {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({ model, messages: [{ role: 'user', content: userText }], temperature: 0.7, max_tokens: 2048 }),
      signal,
    });
    const elapsed = Math.round(performance.now() - startTime);

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '(空回复)';
    
    addAssistantMessage(model, content, elapsed, roundId);
    historyEntry.results.set(model, { success: true, elapsed, content });

    state.requestLog.push({ model, elapsed, tokens: data.usage?.total_tokens || 0, timestamp: Date.now() });
  } catch (e) {
    const elapsed = Math.round(performance.now() - startTime);
    if (e.name === 'AbortError') {
      addErrorMessage(model, '已取消', roundId);
      historyEntry.results.set(model, { success: false, error: '已取消' });
    } else {
      addErrorMessage(model, e.message, roundId);
      historyEntry.results.set(model, { success: false, error: e.message, elapsed });
    }
    state.requestLog.push({ model, elapsed, error: true, timestamp: Date.now() });
  }
  // 实时更新统计和历史
  updateStats();
  renderHistory();
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// 清空对话但不清空历史
function clearChat() {
  state.requestLog = [];
  const messages = document.getElementById('chatMessages');
  messages.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>选择模型后输入消息</p></div>';
  updateStats();
}

// ========== 统计 ==========
function handleStatsSearch() {
  state.statsSearchQuery = document.getElementById('statsSearch').value.trim().toLowerCase();
  updateStats();
}

function setStatsSort(order) {
  state.statsSortOrder = order;
  document.getElementById('sortAscBtn').classList.toggle('active', order === 'asc');
  document.getElementById('sortDescBtn').classList.toggle('active', order === 'desc');
  updateStats();
}

function renderStatsVendorFilters() {
  const container = document.getElementById('statsVendorFilters');
  const vendors = new Set();
  state.requestLog.forEach(l => {
    vendors.add(getVendor(l.model).label);
  });

  let html = `<button class="filter-btn ${!state.statsActiveVendor ? 'active' : ''}" onclick="setStatsVendor(null)">全部</button>`;
  vendors.forEach(label => {
    const isActive = state.statsActiveVendor === label;
    html += `<button class="filter-btn ${isActive ? 'active' : ''}" onclick="setStatsVendor('${label}')">${label}</button>`;
  });
  container.innerHTML = html;
}

function setStatsVendor(vendor) {
  state.statsActiveVendor = vendor;
  renderStatsVendorFilters();
  updateStats();
}

function updateStats() {
  const logs = state.requestLog;
  const successLogs = logs.filter(l => !l.error);
  const total = logs.length;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statSuccess').textContent = successLogs.length;
  document.getElementById('statFailed').textContent = total - successLogs.length;

  if (successLogs.length === 0) {
    document.getElementById('statAvgSpeed').textContent = '-';
    document.getElementById('modelStats').innerHTML = '<div style="color:var(--text-muted);font-size:10px;text-align:center;padding:8px;">暂无数据</div>';
    return;
  }

  const times = successLogs.map(l => l.elapsed);
  const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
  document.getElementById('statAvgSpeed').textContent = formatTime(avg);

  const modelMap = new Map();
  successLogs.forEach(l => {
    if (!modelMap.has(l.model)) modelMap.set(l.model, []);
    modelMap.get(l.model).push(l.elapsed);
  });

  // 按平均速度排序
  let entries = [...modelMap.entries()].sort((a, b) => {
    const avgA = a[1].reduce((x, y) => x + y, 0) / a[1].length;
    const avgB = b[1].reduce((x, y) => x + y, 0) / b[1].length;
    return state.statsSortOrder === 'asc' ? avgA - avgB : avgB - avgA;
  });

  // 应用供应商筛选
  if (state.statsActiveVendor) {
    entries = entries.filter(([model]) => getVendor(model).label === state.statsActiveVendor);
  }

  // 应用搜索筛选
  if (state.statsSearchQuery) {
    entries = entries.filter(([model]) => model.toLowerCase().includes(state.statsSearchQuery));
  }

  const fastest = Math.min(...times);
  const slowest = Math.max(...times);

  let html = '';
  entries.forEach(([model, modelTimes]) => {
    const modelAvg = Math.round(modelTimes.reduce((a, b) => a + b, 0) / modelTimes.length);
    const min = Math.min(...modelTimes);
    const max = Math.max(...modelTimes);
    const barWidth = Math.max(10, Math.min(100, (1 - (modelAvg - fastest) / (slowest - fastest || 1)) * 100));
    html += `
      <div class="model-stat-item">
        <div class="header">
          <span class="name" title="${esc(model)}">${getModelIcon(model)} ${esc(model)}</span>
          <span class="speed">${formatTime(modelAvg)}</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:${barWidth}%;"></div></div>
        <div class="meta"><span>最快 ${formatTime(min)}</span><span>${modelTimes.length}次</span><span>最慢 ${formatTime(max)}</span></div>
      </div>
    `;
  });
  document.getElementById('modelStats').innerHTML = html;
  renderStatsVendorFilters();
}

// ========== 历史 ==========
function renderHistory() {
  const panel = document.getElementById('historyPanel');
  const scrollTop = panel.scrollTop;

  if (state.messageHistory.length === 0) {
    panel.innerHTML = '<div style="color:var(--text-muted);font-size:10px;text-align:center;padding:10px;">暂无历史</div>';
    return;
  }

  let html = '';
  state.messageHistory.forEach((entry, index) => {
    const successCount = [...entry.results.values()].filter(r => r.success).length;
    const totalModels = entry.models.length;
    const completedCount = entry.results.size;
    const isComplete = completedCount >= totalModels;
    const countColor = successCount === completedCount && isComplete ? 'var(--success)' : (completedCount < totalModels ? 'var(--warning)' : 'var(--danger)');
    html += `
      <div class="history-item" onclick="scrollToRound('${entry.id}')">
        <span class="text">${esc(entry.text)}</span>
        <span class="time">${new Date(entry.timestamp).toLocaleTimeString()}</span>
        <span class="result-count" style="color:${countColor};">${successCount}/${totalModels}</span>
        <button class="retry-btn" onclick="event.stopPropagation();retryMessage(${index})" title="将此消息重新发送">重试</button>
      </div>
    `;
  });
  panel.innerHTML = html;
  panel.scrollTop = scrollTop;
}

function scrollToRound(roundId) {
  const round = document.getElementById(roundId);
  if (round) {
    round.scrollIntoView({ behavior: 'smooth', block: 'center' });
    round.style.boxShadow = '0 0 0 2px var(--accent)';
    setTimeout(() => { round.style.boxShadow = ''; }, 2000);
  } else {
    // 对话已被清空，重建历史对话
    const entry = state.messageHistory.find(e => e.id === roundId);
    if (entry) {
      reconstructRound(entry);
    }
  }
}

// 重建历史对话
function reconstructRound(entry) {
  const messages = document.getElementById('chatMessages');
  if (messages.querySelector('.empty-state')) messages.innerHTML = '';
  
  const round = document.createElement('div');
  round.className = 'message-round reconstructed';
  round.id = entry.id;
  
  // 用户消息
  addUserMessage(entry.text, round);
  
  // 成功/失败分组
  const successResults = [];
  const failureResults = [];
  entry.results.forEach((result, model) => {
    if (result.success) successResults.push({ model, ...result });
    else failureResults.push({ model, ...result });
  });

  // 成功区域
  const successSection = document.createElement('div');
  successSection.className = 'result-section';
  successSection.innerHTML = `
    <div class="result-header success" onclick="toggleSection(this)">
      <span>✅ 成功</span>
      <span class="count">${successResults.length}</span>
    </div>
    <div class="round-models-grid" id="success-grid-${entry.id}"></div>
  `;
  
  // 失败区域
  const failureSection = document.createElement('div');
  failureSection.className = 'result-section';
  failureSection.innerHTML = `
    <div class="result-header failure" onclick="toggleSection(this)">
      <span>❌ 失败</span>
      <span class="count">${failureResults.length}</span>
    </div>
    <div class="round-models-grid" id="failure-grid-${entry.id}"></div>
  `;
  
  round.appendChild(successSection);
  round.appendChild(failureSection);
  
  // 渲染成功结果
  successResults.forEach(r => {
    const safeId = makeSafeId(entry.id, r.model);
    const col = document.createElement('div');
    col.className = 'model-response-col';
    col.innerHTML = `
      <div class="model-response-header">
        <div class="icon">${getModelIcon(r.model)}</div>
        <span class="name" title="${escAttr(r.model)}">${esc(r.model)}</span>
        <span class="speed">⚡${formatTime(r.elapsed)}</span>
      </div>
      <div class="model-response-body">
        <div class="model-response-bubble">${renderMarkdown(r.content)}</div>
      </div>
      <div class="collapse-toggle" onclick="toggleCollapse(this)">收起 ▲</div>
    `;
    document.getElementById('success-grid-' + entry.id).appendChild(col);
  });

  // 渲染失败结果
  failureResults.forEach(r => {
    const col = document.createElement('div');
    col.className = 'model-response-col error';
    col.innerHTML = `
      <div class="model-response-header">
        <div class="icon">${getModelIcon(r.model)}</div>
        <span class="name" title="${escAttr(r.model)}">${esc(r.model)}</span>
      </div>
      <div class="model-response-body">
        <div class="model-response-bubble">
          <div style="color:var(--danger);font-size:10px;">❌ ${esc(r.error || '未知错误')}</div>
        </div>
      </div>
      <div class="collapse-toggle" onclick="toggleCollapse(this)">收起 ▲</div>
    `;
    document.getElementById('failure-grid-' + entry.id).appendChild(col);
  });

  // 添加重建标记
  const badge = document.createElement('div');
  badge.style.cssText = 'font-size:9px;color:var(--accent-light);text-align:center;padding:4px;opacity:0.6;';
  badge.textContent = '📜 历史重建';
  round.appendChild(badge);

  messages.appendChild(round);
  round.scrollIntoView({ behavior: 'smooth', block: 'center' });
  round.style.boxShadow = '0 0 0 2px var(--accent)';
  setTimeout(() => { round.style.boxShadow = ''; }, 2000);
}

function retryMessage(index) {
  const entry = state.messageHistory[index];
  if (!entry) return;
  document.getElementById('chatInput').value = entry.text;
  updateSendBtnState();
  showToast('已填充消息，点击发送重试', 'info');
}

// ========== AI 分析 ==========
function getAnalysisModel() {
  const modelIds = state.models.map(m => m.id);
  // 1. 精确匹配
  if (modelIds.includes('glm-5.3-flash')) return 'glm-5.3-flash';
  // 2. 包含 glm 和 flash
  const glmFlash = modelIds.find(id => {
    const clean = id.toLowerCase().replace(/^external\//, '');
    return clean.includes('glm') && clean.includes('flash');
  });
  if (glmFlash) return glmFlash;
  // 3. 包含 flash
  const flash = modelIds.find(id => id.toLowerCase().replace(/^external\//, '').includes('flash'));
  if (flash) return flash;
  // 4. 包含 glm
  const glm = modelIds.find(id => id.toLowerCase().replace(/^external\//, '').includes('glm'));
  if (glm) return glm;
  // 5. 任意可用模型
  if (modelIds.length > 0) return modelIds[0];
  return null;
}

async function aiAnalysis() {
  if (state.messageHistory.length === 0) {
    showToast('没有对话历史可分析', 'warning');
    return;
  }

  const analysisModel = getAnalysisModel();
  if (!analysisModel) {
    showToast('没有可用的模型进行分析', 'error');
    return;
  }

  const btn = document.getElementById('aiAnalysisBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="status-dot testing" style="width:8px;height:8px;"></span> 分析中...';

  // 构建分析数据
  let analysisData = '请分析以下AI模型测试结果，给出简短评价（200字以内）：\n\n';
  
  state.messageHistory.slice(0, 3).forEach((entry, i) => {
    analysisData += `【对话${i+1}】用户问题：${entry.text}\n`;
    entry.results.forEach((result, model) => {
      if (result.success) {
        analysisData += `  - ${model}: 成功，耗时${result.elapsed}ms，回复长度${result.content?.length || 0}字\n`;
      } else {
        analysisData += `  - ${model}: 失败，${result.error}\n`;
      }
    });
    analysisData += '\n';
  });

  analysisData += '请从以下维度评价：1) 各模型响应速度对比 2) 成功率 3) 推荐使用的模型';

  try {
    const resp = await fetch(`${getApiBase()}/v1/chat/completions`, {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({
        model: analysisModel,
        messages: [{ role: 'user', content: analysisData }],
        temperature: 0.7,
        max_tokens: 500,
      }),
    });

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const analysis = data.choices?.[0]?.message?.content || '分析结果为空';
    
    // 显示分析结果弹窗
    showAnalysisModal(analysis, analysisModel);
  } catch (e) {
    showToast(`分析失败: ${e.message}`, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '🧠 AI分析';
}

function showAnalysisModal(analysis, modelName) {
  const modal = document.createElement('div');
  modal.className = 'analysis-modal';
  modal.innerHTML = `
    <div class="analysis-content">
      <h3>🧠 AI 分析结果</h3>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:10px;">分析模型: ${esc(modelName)}</div>
      <div class="result">${renderMarkdown(analysis)}</div>
      <button class="btn btn-primary close-btn" onclick="this.closest('.analysis-modal').remove()">关闭</button>
    </div>
  `;
  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.remove();
  });
  document.body.appendChild(modal);
}
