<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1/64 比例小车模型收藏展</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        header { text-align: center; color: white; margin-bottom: 30px; }
        h1 { font-size: 2.5em; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .subtitle { font-size: 1.1em; opacity: 0.9; }
        .filters { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); margin-bottom: 30px; }
        .filter-group { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .filter-item { display: flex; flex-direction: column; }
        .filter-item label { font-weight: 600; margin-bottom: 5px; color: #333; font-size: 0.9em; }
        .filter-item select, .filter-item input { padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 0.95em; transition: border-color 0.3s; }
        .filter-item select:focus, .filter-item input:focus { outline: none; border-color: #667eea; }
        .btn-reset { background: #667eea; color: white; border: none; padding: 12px 30px; border-radius: 8px; font-size: 1em; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        .btn-reset:hover { background: #764ba2; }
        .stats { background: rgba(255,255,255,0.95); padding: 15px 25px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 5px 15px rgba(0,0,0,0.1); flex-wrap: wrap; gap: 10px; }
        .stats-text { font-size: 1.1em; color: #333; font-weight: 600; }
        .view-switcher { display: flex; gap: 8px; align-items: center; }
        .view-btn { background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: all 0.3s; }
        .view-btn:hover { background: rgba(255,255,255,0.3); }
        .view-btn.active { background: white; color: #667eea; border-color: white; font-weight: 600; }
        .cars-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .cars-grid.view-large { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; }
        .cars-grid.view-small { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
        .cars-grid.view-small .car-image { height: 120px; }
        .cars-grid.view-small .car-info { padding: 10px; }
        .cars-grid.view-small .car-name { font-size: 0.95em; }
        .cars-grid.view-mini { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
        .cars-grid.view-mini .car-image { height: 90px; }
        .cars-grid.view-mini .car-info { padding: 6px; }
        .cars-grid.view-mini .car-name { font-size: 0.8em; }
        .cars-grid.view-mini .car-details { display: none; }
        .cars-grid.view-list { display: block; }
        .cars-grid.view-list .car-card { display: flex; flex-direction: row; margin-bottom: 8px; height: 80px; }
        .cars-grid.view-list .car-image { width: 120px; min-width: 120px; height: 100%; }
        .cars-grid.view-list .car-info { flex: 1; display: flex; align-items: center; padding: 10px 20px; gap: 20px; }
        .car-card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 20px rgba(0,0,0,0.15); transition: transform 0.3s, box-shadow 0.3s; cursor: pointer; }
        .car-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
        .car-image { width: 100%; height: 200px; overflow: hidden; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); display: flex; align-items: center; justify-content: center; }
        .car-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
        .car-card:hover .car-image img { transform: scale(1.05); }
        .car-image-placeholder { font-size: 3em; color: #667eea; }
        .car-info { padding: 20px; }
        .car-brand { font-size: 0.85em; color: #667eea; font-weight: 600; text-transform: uppercase; margin-bottom: 5px; }
        .car-name { font-size: 1.2em; font-weight: 700; color: #333; margin-bottom: 10px; line-height: 1.3; }
        .car-details { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .detail-tag { background: #f0f0f0; padding: 5px 12px; border-radius: 15px; font-size: 0.8em; color: #555; }
        .detail-tag.year { background: #e3f2fd; color: #1976d2; }
        .detail-tag.color { background: #f3e5f5; color: #7b1fa2; }
        .no-results { text-align: center; padding: 60px 20px; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); grid-column: 1 / -1; }
        .no-results-icon { font-size: 4em; margin-bottom: 20px; }
        .no-results-text { font-size: 1.3em; color: #666; }
        footer { text-align: center; color: white; padding: 20px; opacity: 0.9; }
        #scroll-sentinel { text-align: center; padding: 30px; color: white; font-size: 1.1em; }
        .loading-dots::after { content: ''; animation: dots 1.5s steps(4, end) infinite; }
        @keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }
        @media (max-width: 768px) { h1 { font-size: 1.8em; } .cars-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } .filter-group { grid-template-columns: 1fr; } .stats { flex-direction: column; align-items: flex-start; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏎️ 1/64 比例小车模型收藏展</h1>
            <p class="subtitle">MINIGT · Kilo Works · TH 等品牌 | 共 <span id="total-models">0</span> 款车型</p>
        </header>
        <div class="filters">
            <div class="filter-group">
                <div class="filter-item"><label>品牌</label><select id="filter-brand"><option value="">全部品牌</option></select></div>
                <div class="filter-item"><label>车型</label><select id="filter-model"><option value="">全部车型</option></select></div>
                <div class="filter-item"><label>年份</label><select id="filter-year"><option value="">全部年份</option></select></div>
                <div class="filter-item"><label>颜色</label><select id="filter-color"><option value="">全部颜色</option></select></div>
            </div>
            <div class="filter-group">
                <div class="filter-item"><label>搜索</label><input type="text" id="search-text" placeholder="输入关键词搜索..."></div>
            </div>
            <button class="btn-reset" onclick="resetFilters()">重置筛选</button>
        </div>
        <div class="stats">
            <span class="stats-text">显示 <span id="display-count">0</span> / <span id="total-count">0</span> 款</span>
            <div class="view-switcher">
                <button class="view-btn" onclick="switchView('large')">️ 大</button>
                <button class="view-btn active" onclick="switchView('medium')">📷 中</button>
                <button class="view-btn" onclick="switchView('small')">🔍 小</button>
                <button class="view-btn" onclick="switchView('mini')">⚡ 迷你</button>
                <button class="view-btn" onclick="switchView('list')">📋 列表</button>
            </div>
        </div>
        <div class="cars-grid" id="cars-grid"></div>
        <footer>
            <p>数据来源：MINIGT 官方网站 · 共收录 <span id="footer-count">0</span> 款车型</p>
        </footer>
    </div>
    <script src="minigt_data.js"></script>
    <script>
        // 颜色映射
        const colorMap = {"Red":"红色","Blue":"蓝色","White":"白色","Black":"黑色","Yellow":"黄色","Green":"绿色","Orange":"橙色","Purple":"紫色","Violet":"紫色","Pink":"粉色","Silver":"银色","Gold":"金色","Grey":"灰色","Gray":"灰色"};
        function translateColor(c) { if (!c) return "未知"; if (colorMap[c]) return colorMap[c]; const l = c.toLowerCase(); for (const [k,v] of Object.entries(colorMap)) if (l.includes(k.toLowerCase())) return v; return c; }

        // 合并数据
        const carsData = (typeof minigtProducts !== 'undefined') ? minigtProducts.map(car => ({
            b: car.b, m: car.m, y: car.y, c: translateColor(car.c), n: car.n, i: car.i
        })) : [];

        // 初始化筛选器
        function initFilters() {
            const brands = [...new Set(carsData.map(c => c.b))].sort();
            const models = [...new Set(carsData.map(c => c.m))].sort();
            const years = [...new Set(carsData.map(c => c.y))].sort((a,b) => b-a);
            const colors = [...new Set(carsData.map(c => c.c))].sort();
            ['filter-brand','filter-model','filter-year','filter-color'].forEach((id, i) => {
                const sel = document.getElementById(id);
                [brands, models, years, colors][i].forEach(v => { const o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o); });
            });
        }

        // 分页变量
        const ITEMS_PER_PAGE = 12;
        let currentPage = 1, filteredData = [], isLoading = false, observer = null;

        // 渲染卡片
        function renderCars(cars, append = false) {
            const grid = document.getElementById('cars-grid');
            if (!append) { grid.innerHTML = ''; currentPage = 1; if (observer) observer.disconnect(); }
            if (cars.length === 0 && !append) {
                grid.innerHTML = '<div class="no-results"><div class="no-results-icon">🔍</div><div class="no-results-text">没有找到匹配的车型</div></div>';
                return;
            }
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = Math.min(currentPage * ITEMS_PER_PAGE, cars.length);
            cars.slice(start, end).forEach(car => {
                const card = document.createElement('div');
                card.className = 'car-card';
                const img = car.i ? `<img data-src="${BP}${car.i}" alt="${car.m}" class="lazy-img">` : '<div class="car-image-placeholder">🏎️</div>';
                card.innerHTML = `<div class="car-image">${img}</div><div class="car-info"><div class="car-brand">${car.b}</div><div class="car-name">${car.m}</div><div class="car-details"><span class="detail-tag year">${car.y}</span><span class="detail-tag color">${car.c}</span></div><div style="margin-top:10px;font-size:0.85em;color:#999">编号:${car.n}</div></div>`;
                grid.appendChild(card);
            });
            lazyLoadImages();
            if (end < cars.length) setupScrollObserver(cars);
            else { const f = document.querySelector('footer'); const m = document.createElement('p'); m.style.cssText = 'color:white;text-align:center;margin:20px 0'; m.textContent = `已显示全部 ${cars.length} 款 🎉`; f.before(m); }
        }

        // 图片懒加载
        function lazyLoadImages() {
            const imgs = document.querySelectorAll('img.lazy-img:not([src])');
            const io = new IntersectionObserver((entries) => {
                entries.forEach(e => { if (e.isIntersecting) { const img = e.target; img.src = img.dataset.src; img.classList.remove('lazy-img'); img.onerror = () => img.parentElement.innerHTML = '<div class="car-image-placeholder">🏎️</div>'; io.unobserve(img); } });
            }, { rootMargin: '100px' });
            imgs.forEach(img => io.observe(img));
        }

        // 滚动自动加载
        function setupScrollObserver(cars) {
            if (observer) observer.disconnect();
            let sentinel = document.getElementById('scroll-sentinel');
            if (sentinel) sentinel.remove();
            sentinel = document.createElement('div');
            sentinel.id = 'scroll-sentinel';
            sentinel.innerHTML = '加载中<span class="loading-dots"></span>';
            document.getElementById('cars-grid').after(sentinel);
            observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting && !isLoading) {
                    isLoading = true;
                    setTimeout(() => { currentPage++; renderCars(cars, true); isLoading = false; }, 100);
                }
            }, { rootMargin: '200px' });
            observer.observe(sentinel);
        }

        // 筛选
        function applyFilters() {
            const b = document.getElementById('filter-brand').value;
            const m = document.getElementById('filter-model').value;
            const y = document.getElementById('filter-year').value;
            const c = document.getElementById('filter-color').value;
            const s = document.getElementById('search-text').value.toLowerCase();
            let filtered = carsData;
            if (b) filtered = filtered.filter(c => c.b === b);
            if (m) filtered = filtered.filter(c => c.m === m);
            if (y) filtered = filtered.filter(c => c.y === y);
            if (c) filtered = filtered.filter(c => c.c === c);
            if (s) filtered = filtered.filter(c => c.b.toLowerCase().includes(s) || c.m.toLowerCase().includes(s) || c.n.toLowerCase().includes(s));
            filteredData = filtered;
            renderCars(filtered);
            document.getElementById('display-count').textContent = filtered.length;
        }

        function resetFilters() { ['filter-brand','filter-model','filter-year','filter-color'].forEach(id => document.getElementById(id).value = ''); document.getElementById('search-text').value = ''; applyFilters(); }

        // 视图切换
        function switchView(type) {
            const grid = document.getElementById('cars-grid');
            grid.classList.remove('view-large','view-small','view-mini','view-list');
            if (type !== 'medium') grid.classList.add('view-' + type);
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            localStorage.setItem('carView', type);
        }

        function restoreView() {
            const v = localStorage.getItem('carView');
            if (v && v !== 'medium') {
                document.getElementById('cars-grid').classList.add('view-' + v);
                document.querySelectorAll('.view-btn').forEach(btn => { if (btn.textContent.includes(v === 'large' ? '大' : v === 'small' ? '小' : v === 'mini' ? '迷你' : '列表')) btn.classList.add('active'); else btn.classList.remove('active'); });
            }
        }

        // 事件监听
        ['filter-brand','filter-model','filter-year','filter-color'].forEach(id => document.getElementById(id).addEventListener('change', applyFilters));
        document.getElementById('search-text').addEventListener('input', applyFilters);

        // 初始化
        initFilters();
        applyFilters();
        restoreView();
        document.getElementById('total-models').textContent = carsData.length;
        document.getElementById('footer-count').textContent = carsData.length;
        document.getElementById('total-count').textContent = carsData.length;
    </script>
</body>
</html>
