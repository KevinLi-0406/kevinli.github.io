<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>杰尼龟 - 虚拟宠物</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(180deg, #E0F4FF 0%, #FFF8EE 100%);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  align-items: center;
  user-select: none;
  -webkit-user-select: none;
}

/* ===== 顶部状态区 ===== */
.status-bar {
  width: 100%;
  max-width: 480px;
  padding: 18px 20px 8px;
  text-align: center;
}

.pet-name {
  font-size: 22px;
  font-weight: 700;
  color: #2E86AB;
  margin-bottom: 10px;
  letter-spacing: 3px;
}

.status-row {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 4px;
  background: #FFF;
  border-radius: 20px;
  padding: 4px 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

.status-icon { font-size: 14px; }

.status-track {
  width: 70px;
  height: 8px;
  background: #E8E0D8;
  border-radius: 4px;
  overflow: hidden;
}

.status-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.5s ease;
}

.status-fill.hunger { background: linear-gradient(90deg, #FF8C42, #FFB347); }
.status-fill.mood { background: linear-gradient(90deg, #FF6B8A, #FF8E9E); }
.status-fill.energy { background: linear-gradient(90deg, #4FC3F7, #81D4FA); }

.warn-text {
  font-size: 13px;
  color: #E88;
  margin-top: 6px;
  opacity: 0;
  transition: opacity 0.3s;
}
.warn-text.show { opacity: 1; }

/* ===== 宠物场景 ===== */
.scene {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  width: 100%;
  max-width: 480px;
  min-height: 300px;
}

.ground {
  position: absolute;
  bottom: 50px;
  width: 220px;
  height: 22px;
  background: radial-gradient(ellipse, rgba(180,210,230,0.4), transparent);
  border-radius: 50%;
}

/* 气泡 */
.bubble {
  position: absolute;
  top: 10px;
  font-size: 30px;
  opacity: 0;
  pointer-events: none;
  z-index: 10;
}
.bubble.show { animation: bubbleFloat 1.8s ease-out forwards; }

@keyframes bubbleFloat {
  0% { opacity: 1; transform: translateY(0) scale(0.5); }
  30% { opacity: 1; transform: translateY(-30px) scale(1.2); }
  100% { opacity: 0; transform: translateY(-80px) scale(0.8); }
}

/* 水泡群 */
.water-bubble {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.95), rgba(173,216,255,0.4));
  border: 1.5px solid rgba(173,216,255,0.5);
  pointer-events: none;
  opacity: 0;
}
.water-bubble.show { animation: waterFloat 1.6s ease-out forwards; }

@keyframes waterFloat {
  0% { opacity: 0.9; transform: translateY(0) scale(0.2); }
  40% { opacity: 0.7; }
  100% { opacity: 0; transform: translateY(-70px) scale(1.1); }
}

/* ZZZ */
.zz-bubble {
  position: absolute;
  top: 5px;
  right: 15px;
  font-size: 20px;
  font-weight: 700;
  color: #8899AA;
  opacity: 0;
  pointer-events: none;
}
.zz-bubble.show { animation: zzFloat 2s ease-in-out infinite; }

@keyframes zzFloat {
  0% { opacity: 0; transform: translate(0,0) scale(0.6); }
  50% { opacity: 1; transform: translate(12px,-22px) scale(1); }
  100% { opacity: 0; transform: translate(24px,-44px) scale(0.7); }
}

/* ===== 宠物 ===== */
.pet-container {
  position: relative;
  cursor: pointer;
  z-index: 5;
  transition: transform 0.3s ease;
}
.pet-container:active { transform: scale(0.95); }

.pet-svg {
  width: 190px;
  height: 210px;
  filter: drop-shadow(0 6px 12px rgba(46,134,171,0.18));
}

/* 呼吸 */
@keyframes breathe {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}
.pet-body-group { animation: breathe 2.8s ease-in-out infinite; }

/* 尾巴摆动 */
@keyframes tailWag {
  0%, 100% { transform: rotate(-8deg); }
  50% { transform: rotate(12deg); }
}
.tail-group {
  transform-origin: 95px 175px;
  animation: tailWag 1.5s ease-in-out infinite;
}

/* 动画叠加 */
.pet-container.anim-jump { animation: petJump 0.6s ease; }
@keyframes petJump {
  0%, 100% { transform: translateY(0) rotate(0); }
  25% { transform: translateY(-35px) rotate(-6deg); }
  55% { transform: translateY(-18px) rotate(4deg); }
  80% { transform: translateY(-5px) rotate(-1deg); }
}

.pet-container.anim-spin { animation: petSpin 0.7s ease; }
@keyframes petSpin {
  0% { transform: rotate(0deg); }
  50% { transform: rotate(15deg) scale(1.05); }
  100% { transform: rotate(0deg); }
}

.pet-container.anim-sleep { animation: petSleep 2.2s ease-in-out infinite; }
@keyframes petSleep {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  50% { transform: translateY(4px) rotate(2deg); }
}

.pet-container.anim-water { animation: petWater 0.5s ease-in-out 2; }
@keyframes petWater {
  0%, 100% { transform: translateX(0); }
  30% { transform: translateX(-8px) rotate(-3deg); }
  70% { transform: translateX(8px) rotate(3deg); }
}

/* ===== 底部工具栏 ===== */
.toolbar {
  width: 100%;
  max-width: 480px;
  padding: 10px 20px 28px;
  display: flex;
  justify-content: center;
  gap: 14px;
  flex-wrap: wrap;
}

.tool-btn {
  width: 62px;
  height: 62px;
  border-radius: 50%;
  border: 2px solid #D0E8F0;
  background: #FFF;
  font-size: 28px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 10px rgba(46,134,171,0.1);
  transition: all 0.2s ease;
  position: relative;
}
.tool-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 5px 15px rgba(46,134,171,0.18);
  border-color: #7EC8E3;
}
.tool-btn:active { transform: scale(0.88); }

.tool-btn .label {
  position: absolute;
  bottom: -20px;
  font-size: 11px;
  color: #8899AA;
  white-space: nowrap;
}

/* 长按提示 */
.hint {
  position: absolute;
  bottom: -28px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: #99AABB;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.5s;
}
.hint.show { opacity: 1; }

/* 墨镜叠加 */
.sunglasses { display: none; }
.sunglasses.show { display: block; }

/* 水枪特效 */
.water-stream {
  position: absolute;
  width: 6px;
  height: 0;
  background: linear-gradient(90deg, #87CEEB, #4FC3F7);
  border-radius: 3px;
  opacity: 0;
  pointer-events: none;
  z-index: 8;
}
.water-stream.shoot {
  animation: waterShoot 0.8s ease-out forwards;
}
@keyframes waterShoot {
  0% { opacity: 0.8; height: 0; width: 6px; }
  40% { opacity: 0.7; height: 40px; width: 5px; }
  100% { opacity: 0; height: 60px; width: 3px; transform: translateX(30px); }
}
</style>
</head>
<body>

<div class="status-bar">
  <div class="pet-name">杰尼龟 Squirtle</div>
  <div class="status-row">
    <div class="status-item">
      <span class="status-icon">🍖</span>
      <div class="status-track"><div class="status-fill hunger" id="hungerBar" style="width:80%"></div></div>
    </div>
    <div class="status-item">
      <span class="status-icon"></span>
      <div class="status-track"><div class="status-fill mood" id="moodBar" style="width:90%"></div></div>
    </div>
    <div class="status-item">
      <span class="status-icon"></span>
      <div class="status-track"><div class="status-fill energy" id="energyBar" style="width:85%"></div></div>
    </div>
  </div>
  <div class="warn-text" id="warnText"></div>
</div>

<div class="scene" id="scene">
  <div class="ground"></div>
  <div class="bubble" id="bubble"></div>
  <div class="zz-bubble" id="zzBubble">Z z z</div>

  <div class="pet-container" id="petContainer">
    <svg class="pet-svg" viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
      <g class="pet-body-group">

        <!-- 尾巴 -->
        <g class="tail-group">
          <path d="M 100 178 C 115 185, 130 180, 135 168 C 138 160, 132 155, 128 158 C 124 162, 126 170, 120 175"
                fill="#5BA3C9" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M 115 175 Q 120 172, 125 176" fill="none" stroke="#4A90B8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
        </g>

        <!-- 左后腿 -->
        <ellipse cx="75" cy="188" rx="18" ry="13" fill="#5BA3C9" stroke="#333" stroke-width="3"/>
        <ellipse cx="67" cy="196" rx="12" ry="7" fill="#5BA3C9" stroke="#333" stroke-width="2.5"/>
        <!-- 右后腿 -->
        <ellipse cx="125" cy="188" rx="18" ry="13" fill="#5BA3C9" stroke="#333" stroke-width="3"/>
        <ellipse cx="133" cy="196" rx="12" ry="7" fill="#5BA3C9" stroke="#333" stroke-width="2.5"/>

        <!-- 龟壳（背部） -->
        <ellipse cx="100" cy="145" rx="55" ry="48" fill="#8B6914" stroke="#333" stroke-width="3.5"/>
        <path d="M 100 100 L 100 145" fill="none" stroke="#6B4F12" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 60 125 Q 80 115, 100 120 Q 120 115, 140 125" fill="none" stroke="#6B4F12" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 55 145 Q 75 138, 100 143 Q 125 138, 145 145" fill="none" stroke="#6B4F12" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M 65 165 Q 82 158, 100 163 Q 118 158, 135 165" fill="none" stroke="#6B4F12" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="82" cy="125" rx="15" ry="10" fill="#A07828" opacity="0.4"/>

        <!-- 身体（腹部浅黄） -->
        <ellipse cx="100" cy="155" rx="42" ry="38" fill="#FFF4C8" stroke="#333" stroke-width="3.5"/>
        <path d="M 100 120 L 100 190" fill="none" stroke="#E8D8A0" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

        <!-- 左前臂 -->
        <g id="armLeft">
          <path d="M 60 150 C 42 148, 35 158, 38 168 C 40 175, 48 176, 55 172"
                fill="#5BA3C9" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="37" cy="166" r="4" fill="#5BA3C9" stroke="#333" stroke-width="2"/>
        </g>

        <!-- 右前臂 -->
        <g id="armRight">
          <path d="M 140 150 C 158 148, 165 158, 162 168 C 160 175, 152 176, 145 172"
                fill="#5BA3C9" stroke="#333" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="163" cy="166" r="4" fill="#5BA3C9" stroke="#333" stroke-width="2"/>
        </g>

        <!-- 头 -->
        <circle cx="100" cy="85" r="46" fill="#5BA3C9" stroke="#333" stroke-width="3.5"/>
        <ellipse cx="100" cy="95" rx="32" ry="26" fill="#87CEEB" opacity="0.3"/>

        <!-- 左眼 -->
        <g id="eyeLeft">
          <ellipse cx="80" cy="78" rx="12" ry="14" fill="#FFF" stroke="#333" stroke-width="2.5"/>
          <circle cx="83" cy="79" r="7" fill="#333"/>
          <circle cx="80" cy="74" r="3.5" fill="#FFF"/>
          <circle cx="86" cy="81" r="1.5" fill="#FFF" opacity="0.5"/>
        </g>

        <!-- 右眼 -->
        <g id="eyeRight">
          <ellipse cx="120" cy="78" rx="12" ry="14" fill="#FFF" stroke="#333" stroke-width="2.5"/>
          <circle cx="123" cy="79" r="7" fill="#333"/>
          <circle cx="120" cy="74" r="3.5" fill="#FFF"/>
          <circle cx="126" cy="81" r="1.5" fill="#FFF" opacity="0.5"/>
        </g>

        <!-- 眉毛 -->
        <path d="M 70 64 Q 80 58, 90 64" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" id="browLeft"/>
        <path d="M 110 64 Q 120 58, 130 64" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" id="browRight"/>

        <!-- 鼻子 -->
        <circle cx="100" cy="88" r="3" fill="#4A90B8" id="nose"/>

        <!-- 嘴巴 -->
        <path d="M 90 97 Q 100 106, 110 97" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" id="mouth"/>

        <!-- 腮红 -->
        <ellipse cx="68" cy="92" rx="9" ry="5" fill="#FFB6C1" opacity="0.3"/>
        <ellipse cx="132" cy="92" rx="9" ry="5" fill="#FFB6C1" opacity="0.3"/>

        <!-- 墨镜（默认隐藏） -->
        <g id="sunglasses" class="sunglasses">
          <rect x="65" y="67" width="28" height="20" rx="5" fill="#222" stroke="#111" stroke-width="2"/>
          <rect x="107" y="67" width="28" height="20" rx="5" fill="#222" stroke="#111" stroke-width="2"/>
          <line x1="93" y1="76" x2="107" y2="76" stroke="#111" stroke-width="2.5"/>
          <line x1="65" y1="74" x2="55" y2="72" stroke="#111" stroke-width="2.5"/>
          <line x1="135" y1="74" x2="145" y2="72" stroke="#111" stroke-width="2.5"/>
          <line x1="70" y1="72" x2="76" y2="72" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
          <line x1="112" y1="72" x2="118" y2="72" stroke="#FFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
        </g>

      </g>
    </svg>
    <div class="hint" id="petHint">长按戴墨镜 </div>
  </div>
</div>

<div class="toolbar">
  <button class="tool-btn" onclick="doFeed()">
    <span class="label">喂食</span>
  </button>
  <button class="tool-btn" onclick="doPlay()">
    ⚽<span class="label">玩耍</span>
  </button>
  <button class="tool-btn" onclick="doWaterGun()">
    💧<span class="label">水枪</span>
  </button>
  <button class="tool-btn" onclick="doSleep()">
    💤<span class="label" id="sleepLabel">睡觉</span>
  </button>
</div>

<script>
let state = {
  hunger: 80,
  mood: 90,
  energy: 85,
  isSleeping: false,
  hasSunglasses: false
};

const DECAY_MS = 5000;

function updateBars() {
  document.getElementById('hungerBar').style.width = state.hunger + '%';
  document.getElementById('moodBar').style.width = state.mood + '%';
  document.getElementById('energyBar').style.width = state.energy + '%';
  const warn = document.getElementById('warnText');
  let msgs = [];
  if (state.hunger < 20) msgs.push('🍖 杰尼龟饿了！');
  if (state.mood < 20) msgs.push('💖 杰尼龟不开心…');
  if (state.energy < 20) msgs.push(' 杰尼龟没精神…');
  warn.textContent = msgs.join('  ');
  warn.classList.toggle('show', msgs.length > 0);
}

function decay() {
  if (state.isSleeping) {
    state.hunger = Math.max(0, state.hunger - 0.2);
    state.energy = Math.min(100, state.energy + 1);
  } else {
    state.hunger = Math.max(0, state.hunger - 1);
    state.mood = Math.max(0, state.mood - 0.7);
    state.energy = Math.max(0, state.energy - 0.6);
  }
  updateBars();
}
setInterval(decay, DECAY_MS);

function showBubble(emoji) {
  const b = document.getElementById('bubble');
  b.textContent = emoji;
  b.classList.remove('show');
  void b.offsetWidth;
  b.classList.add('show');
}

function spawnWaterBubbles() {
  const scene = document.getElementById('scene');
  for (let i = 0; i < 10; i++) {
    const wb = document.createElement('div');
    wb.className = 'water-bubble';
    const size = 6 + Math.random() * 18;
    wb.style.width = size + 'px';
    wb.style.height = size + 'px';
    wb.style.left = (60 + Math.random() * 100) + 'px';
    wb.style.top = (130 + Math.random() * 70) + 'px';
    wb.style.animationDelay = (i * 0.12) + 's';
    scene.appendChild(wb);
    void wb.offsetWidth;
    wb.classList.add('show');
    setTimeout(() => wb.remove(), 2200);
  }
}

function setExpression(type) {
  const eyeL = document.getElementById('eyeLeft');
  const eyeR = document.getElementById('eyeRight');
  const mouth = document.getElementById('mouth');
  const nose = document.getElementById('nose');
  const browL = document.getElementById('browLeft');
  const browR = document.getElementById('browRight');

  switch(type) {
    case 'happy':
      eyeL.innerHTML = '<path d="M 71 79 Q 80 72, 89 79" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>';
      eyeR.innerHTML = '<path d="M 111 79 Q 120 72, 129 79" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>';
      mouth.setAttribute('d', 'M 85 97 Q 100 112, 115 97');
      browL.setAttribute('d', 'M 70 60 Q 80 54, 90 60');
      browR.setAttribute('d', 'M 110 60 Q 120 54, 130 60');
      break;
    case 'excited':
      eyeL.innerHTML = '<ellipse cx="80" cy="78" rx="14" ry="16" fill="#FFF" stroke="#333" stroke-width="2.5"/><circle cx="83" cy="79" r="9" fill="#333"/><circle cx="79" cy="73" r="4.5" fill="#FFF"/><circle cx="87" cy="82" r="2" fill="#FFF" opacity="0.5"/>';
      eyeR.innerHTML = '<ellipse cx="120" cy="78" rx="14" ry="16" fill="#FFF" stroke="#333" stroke-width="2.5"/><circle cx="123" cy="79" r="9" fill="#333"/><circle cx="119" cy="73" r="4.5" fill="#FFF"/><circle cx="127" cy="82" r="2" fill="#FFF" opacity="0.5"/>';
      mouth.setAttribute('d', 'M 82 96 Q 100 115, 118 96');
      nose.setAttribute('r', '4');
      break;
    case 'cool':
      mouth.setAttribute('d', 'M 88 98 L 112 98');
      mouth.setAttribute('stroke-width', '3');
      browL.setAttribute('d', 'M 70 62 Q 80 56, 90 62');
      browR.setAttribute('d', 'M 110 62 Q 120 56, 130 62');
      break;
    case 'sleepy':
      eyeL.innerHTML = '<path d="M 71 79 Q 80 84, 89 79" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>';
      eyeR.innerHTML = '<path d="M 111 79 Q 120 84, 129 79" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>';
      mouth.setAttribute('d', 'M 93 98 Q 100 101, 107 98');
      browL.setAttribute('d', 'M 72 66 Q 80 68, 88 66');
      browR.setAttribute('d', 'M 112 66 Q 120 68, 128 66');
      break;
    case 'water':
      eyeL.innerHTML = '<path d="M 72 78 Q 80 73, 88 78" fill="none" stroke="#333" stroke-width="3" stroke-linecap="round"/>';
      eyeR.innerHTML = '<ellipse cx="120" cy="78" rx="13" ry="15" fill="#FFF" stroke="#333" stroke-width="2.5"/><circle cx="123" cy="79" r="8" fill="#333"/><circle cx="120" cy="73" r="4" fill="#FFF"/><circle cx="127" cy="82" r="2" fill="#FFF" opacity="0.5"/>';
      mouth.setAttribute('d', 'M 88 96 Q 100 108, 112 96');
      browL.setAttribute('d', 'M 70 58 Q 80 52, 90 58');
      browR.setAttribute('d', 'M 110 62 Q 120 56, 130 62');
      break;
    default:
      eyeL.innerHTML = '<ellipse cx="80" cy="78" rx="12" ry="14" fill="#FFF" stroke="#333" stroke-width="2.5"/><circle cx="83" cy="79" r="7" fill="#333"/><circle cx="80" cy="74" r="3.5" fill="#FFF"/><circle cx="86" cy="81" r="1.5" fill="#FFF" opacity="0.5"/>';
      eyeR.innerHTML = '<ellipse cx="120" cy="78" rx="12" ry="14" fill="#FFF" stroke="#333" stroke-width="2.5"/><circle cx="123" cy="79" r="7" fill="#333"/><circle cx="120" cy="74" r="3.5" fill="#FFF"/><circle cx="126" cy="81" r="1.5" fill="#FFF" opacity="0.5"/>';
      mouth.setAttribute('d', 'M 90 97 Q 100 106, 110 97');
      mouth.setAttribute('stroke-width', '2.5');
      nose.setAttribute('r', '3');
      browL.setAttribute('d', 'M 70 64 Q 80 58, 90 64');
      browR.setAttribute('d', 'M 110 64 Q 120 58, 130 64');
  }
}

function resetExpression() {
  setTimeout(() => {
    if (state.hasSunglasses) {
      setExpression('cool');
    } else {
      setExpression('normal');
    }
  }, 1800);
}

function toggleSunglasses(show) {
  const sg = document.getElementById('sunglasses');
  if (show) {
    sg.classList.add('show');
    state.hasSunglasses = true;
  } else {
    sg.classList.remove('show');
    state.hasSunglasses = false;
  }
}

let pressTimer = null;
let isLongPress = false;
const petContainer = document.getElementById('petContainer');

petContainer.addEventListener('pointerdown', () => {
  isLongPress = false;
  pressTimer = setTimeout(() => {
    isLongPress = true;
    doCuddle();
  }, 600);
});

petContainer.addEventListener('pointerup', () => {
  clearTimeout(pressTimer);
  if (!isLongPress && !state.isSleeping) doPet();
});

petContainer.addEventListener('pointerleave', () => clearTimeout(pressTimer));

function doPet() {
  if (state.isSleeping) return;
  state.mood = Math.min(100, state.mood + 8);
  setExpression('happy');
  showBubble('');
  updateBars();
  resetExpression();
}

function doCuddle() {
  if (state.isSleeping) return;
  state.mood = Math.min(100, state.mood + 12);
  state.energy = Math.min(100, state.energy + 5);

  if (state.hasSunglasses) {
    toggleSunglasses(false);
    showBubble('👓✨');
    setExpression('surprised');
  } else {
    toggleSunglasses(true);
    showBubble('😎');
    setExpression('cool');
  }

  petContainer.classList.add('anim-spin');
  setTimeout(() => petContainer.classList.remove('anim-spin'), 700);
  updateBars();
  resetExpression();
}

function doFeed() {
  if (state.isSleeping) return;
  state.hunger = Math.min(100, state.hunger + 25);
  state.mood = Math.min(100, state.mood + 5);
  setExpression('happy');
  showBubble('😋');
  updateBars();
  resetExpression();
}

function doPlay() {
  if (state.isSleeping) return;
  if (state.energy < 10) { showBubble('😴'); return; }
  state.mood = Math.min(100, state.mood + 18);
  state.hunger = Math.max(0, state.hunger - 8);
  state.energy = Math.max(0, state.energy - 12);
  setExpression('excited');
  showBubble('⚽✨');
  petContainer.classList.add('anim-jump');
  setTimeout(() => petContainer.classList.remove('anim-jump'), 600);
  updateBars();
  resetExpression();
}

function doWaterGun() {
  if (state.isSleeping) return;
  if (state.energy < 15) { showBubble('😢'); return; }
  state.mood = Math.min(100, state.mood + 15);
  state.energy = Math.max(0, state.energy - 10);
  setExpression('water');
  showBubble('💦');
  petContainer.classList.add('anim-water');
  setTimeout(() => petContainer.classList.remove('anim-water'), 1000);
  spawnWaterBubbles();
  updateBars();
  resetExpression();
}

function doSleep() {
  const zz = document.getElementById('zzBubble');
  if (state.isSleeping) {
    state.isSleeping = false;
    zz.classList.remove('show');
    petContainer.classList.remove('anim-sleep');
    toggleSunglasses(false);
    setExpression('normal');
    document.getElementById('sleepLabel').textContent = '睡觉';
    return;
  }
  state.isSleeping = true;
  setExpression('sleepy');
  zz.classList.add('show');
  petContainer.classList.add('anim-sleep');
  document.getElementById('sleepLabel').textContent = '唤醒';
  showBubble('');
  updateBars();
}

setTimeout(() => {
  document.getElementById('petHint').classList.add('show');
  setTimeout(() => document.getElementById('petHint').classList.remove('show'), 4000);
}, 3000);

updateBars();
</script>
</body>
</html>
