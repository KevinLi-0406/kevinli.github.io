<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>城市漫游行程助手 v2.1.0</title>
<script>window._AMapSecurityConfig={securityJsCode:'963431052c20c8c7a9ecf3f2aacba1cf'};</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=27a05ef5de2df3e22acf62cee95b0e2c&plugin=AMap.Geolocation,AMap.PlaceSearch,AMap.Transfer,AMap.Geocoder"></script>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:#283044;background:#f5f6fa}body{display:flex;flex-direction:column}.top{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff;background:linear-gradient(135deg,#667eea,#764ba2);font-size:14px;font-weight:700}.top small{font-size:11px;font-weight:500;background:#ffffff25;padding:4px 8px;border-radius:12px}.map-wrap{height:43vh;min-height:280px;position:relative;flex:none}#map{width:100%;height:100%}.search{position:absolute;left:10px;right:10px;top:10px;z-index:5;display:flex;gap:6px}.search input{min-width:0;flex:1;border:0;border-radius:10px;padding:11px 12px;box-shadow:0 2px 8px #0003;font-size:14px}.search button,.locate{border:0;border-radius:10px;background:#667eea;color:#fff;padding:0 13px;font-weight:600}.locate{position:absolute;z-index:5;right:10px;top:58px;padding:9px 11px}.route-bar{position:absolute;left:10px;right:10px;bottom:10px;z-index:5;background:#fffffff2;border-radius:12px;padding:8px;display:flex;gap:6px;overflow:auto;box-shadow:0 2px 8px #0002}.route-bar button{flex:1;min-width:72px;border:1px solid #e2e5f2;background:#fff;border-radius:16px;padding:7px;font-size:12px}.route-bar button.active{background:#667eea;color:#fff;border-color:#667eea}.panel{flex:1;overflow:auto;padding:10px}.hint{font-size:12px;color:#75809a;margin:2px 2px 9px}.place{background:#fff;border-radius:12px;margin-bottom:9px;padding:12px;display:flex;gap:10px;box-shadow:0 1px 5px #00000010}.avatar{font-size:23px}.place-main{min-width:0;flex:1}.name{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#77809a;margin-top:4px}.actions{display:flex;align-items:center;gap:6px}.actions button{border:0;border-radius:8px;padding:6px 8px;font-size:11px}.detail{background:#edf1ff;color:#526ad7}.nav{background:#e9f7ee;color:#27834b}.empty{text-align:center;padding:35px;color:#9299aa}.modal{display:none;position:fixed;inset:0;z-index:20;background:#0008;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{width:100%;max-width:560px;max-height:87vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:18px}.handle{width:38px;height:4px;border-radius:4px;background:#ddd;margin:0 auto 12px}.title{text-align:center;font-size:17px;font-weight:700;margin-bottom:14px}.section{margin:14px 0}.label{font-size:12px;font-weight:700;color:#697187;margin-bottom:7px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.card{background:#f5f7ff;border-radius:9px;padding:9px 5px;text-align:center}.card b{display:block;color:#536bd9;font-size:14px}.card span{display:block;color:#8b93a6;font-size:11px;margin-top:3px}.walk{padding:9px;background:#f8f8f8;border-radius:8px;font-size:12px;color:#5f677a}.step{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid #edf0f6}.step:last-child{border-bottom:0}.badge{height:max-content;padding:3px 7px;color:#fff;border-radius:5px;font-size:11px;font-weight:700;white-space:nowrap}.step strong{font-size:13px}.step p{font-size:12px;margin:4px 0 0;color:#677087;line-height:1.55}.transfer{font-size:12px;color:#7351b5;background:#f4efff;border-radius:7px;padding:7px 9px;margin:2px 0}.foot{display:flex;gap:8px;margin-top:16px}.foot button{flex:1;border:0;border-radius:10px;padding:11px;font-weight:700}.close{background:#eee;color:#666}.go{background:#667eea;color:#fff}.toast{display:none;position:fixed;z-index:40;top:62px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:9px 14px;border-radius:9px;font-size:13px}.toast.show{display:block}
</style>
</head>
<body>
<header class="top"><span>🗺️ 城市漫游行程助手 · v2.1.0</span><small id="locationText">定位中…</small></header>
<section class="map-wrap"><div id="map"></div><div class="search"><input id="keyword" placeholder="搜索地点（以当前位置为中心）"><button id="searchBtn">🔍 搜索</button></div><button class="locate" id="locateBtn">📍 定位</button><div class="route-bar" id="routeBar"><button class="active" data-mode="walking">🚶 步行</button><button data-mode="riding">🚲 骑行</button><button data-mode="driving">🚗 驾车</button><button data-mode="transit">🚇 地铁</button></div></section>
<main class="panel"><div class="hint">点击地点的“详情”后，将重新请求公交/地铁方案并展示最短耗时方案的原始解析结果。</div><div id="places"></div></main>
<div class="modal" id="modal"><div class="sheet"><div class="handle"></div><div class="title" id="detailTitle">地点详情</div><div id="detailContent"></div><div class="foot"><button class="close" id="closeBtn">关闭</button><button class="go" id="navBtn">🧭 导航</button></div></div></div><div class="toast" id="toast"></div>
<script>
(() => {
'use strict';
const COLORS={'1号线':'#A4343A','2号线':'#004B87','4号线':'#008C95','5号线':'#AA0061','6号线':'#B58500','7号线':'#FFC56E','8号线':'#009B77','9号线':'#97D700','10号线':'#0092BC','13号线':'#F4DA40','14号线':'#CA9A8E','15号线':'#653279','昌平线':'#CCCCCC','亦庄线':'#D0006F','房山线':'#D86018','S1线':'#A45A2A','首都机场线':'#A6CCE2','大兴机场线':'#C9182B'};
let map, geolocation, placeSearch, transfer, myPosition=null, currentPlace=null, markers=[], routeOverlays=[];
let places=[];
try{places=JSON.parse(localStorage.getItem('tp_places')||'[]')}catch(e){places=[]}
const $=id=>document.getElementById(id);
function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2400)}
function num(v){const n=Number(v);return Number.isFinite(n)?n:0}
function minutes(sec){return Math.max(1,Math.round(num(sec)/60))}
function meters(v){const n=num(v);return n>=1000?(n/1000).toFixed(1)+' km':Math.round(n)+' 米'}
function lineKey(name){const s=String(name||'');const m=s.match(/(\d+号线|S\d+线|昌平线|亦庄线|房山线|首都机场线|大兴机场线)/);return m?m[1]:s.replace(/^地铁/,'').replace(/[（(].*$/,'').trim()}
function getLocation(obj){if(!obj)return null;if(typeof obj.getLng==='function')return [obj.getLng(),obj.getLat()];if(Array.isArray(obj))return [num(obj[0]),num(obj[1])];if(obj.lng!==undefined)return [num(obj.lng),num(obj.lat)];const s=String(obj);if(s.includes(',')){const a=s.split(',');return [num(a[0]),num(a[1])]};return null}
function init(){map=new AMap.Map('map',{zoom:13,center:[116.397428,39.90923]});geolocation=new AMap.Geolocation({enableHighAccuracy:true,timeout:10000});placeSearch=new AMap.PlaceSearch({pageSize:20});transfer=new AMap.Transfer({map:null,city:'北京',policy:AMap.TransferPolicy.LEAST_TIME});map.on('complete',()=>{renderPlaces();locate()});$('locateBtn').onclick=locate;$('searchBtn').onclick=search;$('keyword').addEventListener('keydown',e=>{if(e.key==='Enter')search()});$('closeBtn').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};document.querySelectorAll('#routeBar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#routeBar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(currentPlace)drawMode(b.dataset.mode,currentPlace)});}
function locate(){geolocation.getCurrentPosition((status,res)=>{if(status!=='complete'){ $('locationText').textContent='定位失败';toast('定位失败，请允许浏览器定位权限');return}const p=res.position;myPosition={lng:p.getLng(),lat:p.getLat()};$('locationText').textContent='已定位';map.setCenter([myPosition.lng,myPosition.lat]);map.setZoom(14);new AMap.Marker({map,position:[myPosition.lng,myPosition.lat],content:'<div style="width:18px;height:18px;border:3px solid white;border-radius:50%;background:#667eea;box-shadow:0 1px 5px #0005"></div>',offset:new AMap.Pixel(-9,-9),zIndex:200});renderPlaces()})}
function renderPlaces(){markers.forEach(m=>map.remove(m));markers=[];const box=$('places');if(!places.length){box.innerHTML='<div class="empty">暂无地点。可使用上方搜索结果添加地点，或沿用旧版本已保存的地点数据。</div>';return}box.innerHTML=places.map(p=>`<article class="place"><div class="avatar">📌</div><div class="place-main"><div class="name">${escapeHtml(p.name)}</div><div class="meta">${escapeHtml(p.address||'未填写地址')}</div></div><div class="actions"><button class="detail" data-id="${p.id}">📋 详情</button><button class="nav" data-nav="${p.id}">🧭 导航</button></div></article>`).join('');box.querySelectorAll('.detail').forEach(b=>b.onclick=()=>openDetail(Number(b.dataset.id)));box.querySelectorAll('.nav').forEach(b=>navigate(places.find(p=>p.id===Number(b.dataset.nav))));places.filter(p=>p.lng&&p.lat).forEach(p=>{const m=new AMap.Marker({map,position:[p.lng,p.lat],title:p.name});m.on('click',()=>openDetail(p.id));markers.push(m)})}
function escapeHtml(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function search(){const keyword=$('keyword').value.trim();if(!keyword)return;if(!myPosition){toast('正在定位，请稍后重试');return}placeSearch.setCity('北京');placeSearch.searchNearBy(keyword,new AMap.LngLat(myPosition.lng,myPosition.lat),100000,(status,result)=>{if(status!=='complete'||!result.poiList||!result.poiList.pois.length){toast('未找到附近地点');return}const poi=result.poiList.pois[0];const pos=getLocation(poi.location);if(!pos)return;const candidate={id:Date.now(),name:poi.name,address:(poi.district||'')+(poi.address||''),lng:pos[0],lat:pos[1],category:'other'};if(confirm('添加“'+poi.name+'”到地点列表？')){places.push(candidate);localStorage.setItem('tp_places',JSON.stringify(places));renderPlaces();openDetail(candidate.id)}})}
function openDetail(id){const place=places.find(p=>p.id===id);if(!place||!place.lng||!place.lat){toast('该地点缺少有效坐标');return}if(!myPosition){toast('请先完成定位');return}currentPlace=place;$('detailTitle').textContent=place.name;$('detailContent').innerHTML='<div class="empty">正在请求高德公交/地铁方案并解析最短耗时方案…</div>';$('modal').classList.add('open');planTransit(place,(error,data,raw)=>{if(error){$('detailContent').innerHTML='<div class="empty">未获取到公交/地铁方案：'+escapeHtml(error)+'</div>';return}place.transitDetail=data;place.transitRaw=raw;renderTransitDetail(data);drawTransit(data);})}
/* 唯一的公交/地铁解析入口：先选 duration 最小的 transit，再从其 segments 解析 bus.buslines[0]。 */
function parseTransitResponse(response){const transitList=(response&&response.route&&response.route.transits)||(response&&response.transits)||(response&&response.plans)||[];if(!Array.isArray(transitList)||!transitList.length)throw new Error('响应中没有 route.transits / plans');const best=transitList.reduce((winner,item)=>num(item.duration??item.time)<num(winner.duration??winner.time)?item:winner);const segments=Array.isArray(best.segments)?best.segments:[];const rideSegments=[];const walkingSegments=[];segments.forEach((segment,index)=>{const walking=segment.walking||segment.walk||null;if(walking&&num(walking.distance)>0)walkingSegments.push({index,distance:num(walking.distance),origin:walking.origin||null,destination:walking.destination||null});const lines=segment.bus&&Array.isArray(segment.bus.buslines)?segment.bus.buslines:[];if(lines.length){const bus=lines[0];rideSegments.push({index,type:String(bus.type||''),name:String(bus.name||''),line:lineKey(bus.name),departure:String(bus.departure_stop&&bus.departure_stop.name||''),arrival:String(bus.arrival_stop&&bus.arrival_stop.name||''),viaStops:Array.isArray(bus.via_stops)?bus.via_stops.map(s=>String(s&&s.name||'')).filter(Boolean):[],distance:num(bus.distance),duration:num(bus.duration),polyline:String(bus.polyline||'')})}});const subwaySegments=rideSegments.filter(s=>s.type==='地铁线路');const transferStations=[];for(let i=0;i<rideSegments.length-1;i++){if(rideSegments[i].arrival&&rideSegments[i].arrival===rideSegments[i+1].departure)transferStations.push(rideSegments[i].arrival)}const firstRide=rideSegments[0],lastRide=rideSegments[rideSegments.length-1];const firstWalk=firstRide?walkingSegments.filter(w=>w.index<firstRide.index).pop():null;const lastWalk=lastRide?walkingSegments.find(w=>w.index>lastRide.index):null;return {summary:{duration:num(best.duration??best.time),distance:num(best.distance),walkingDistance:num(best.walking_distance??best.walkingDistance),cost:String(best.cost??'0')},segments:rideSegments,subwaySegments,transferStations:[...new Set(transferStations)],startWalk:firstWalk?{distance:firstWalk.distance,station:firstRide.departure}:null,endWalk:lastWalk?{distance:lastWalk.distance,station:lastRide.arrival}:null,rawPlan:best}}
function planTransit(place,done){transfer.setCity('北京');transfer.search([myPosition.lng,myPosition.lat],[place.lng,place.lat],(status,response)=>{if(status!=='complete'){done('高德接口返回 '+status);return}try{done(null,parseTransitResponse(response),response)}catch(e){done(e.message||'解析失败')}})}
function renderTransitDetail(data){const s=data.summary;const rides=data.segments;const subway=data.subwaySegments;$('detailContent').innerHTML=`<div class="section"><div class="label">最短耗时方案</div><div class="summary"><div class="card"><b>${minutes(s.duration)}分钟</b><span>总耗时</span></div><div class="card"><b>${s.cost}元</b><span>费用</span></div><div class="card"><b>${meters(s.distance)}</b><span>总距离</span></div><div class="card"><b>${meters(s.walkingDistance)}</b><span>总步行</span></div></div></div>${data.startWalk?`<div class="section"><div class="walk">🚶 步行 ${meters(data.startWalk.distance)} 到达 ${escapeHtml(data.startWalk.station||'首站')}</div></div>`:''}<div class="section"><div class="label">${subway.length?'地铁换乘步骤':'公交/地铁换乘步骤'}</div>${rides.length?rides.map((r,i)=>{const color=COLORS[r.line]||'#667eea';const transfer=i<rides.length-1&&r.arrival===rides[i+1].departure?`<div class="transfer">🔁 在 ${escapeHtml(r.arrival)} 站换乘</div>`:'';return `<div class="step"><span class="badge" style="background:${color}">${escapeHtml(r.line||'公交')}</span><div><strong>乘坐 ${escapeHtml(r.name)}</strong><p>${escapeHtml(r.departure)} → ${escapeHtml(r.arrival)}，途经 ${r.viaStops.length} 站 · ${meters(r.distance)} · ${minutes(r.duration)}分钟${r.viaStops.length?'<br>途经：'+escapeHtml(r.viaStops.join('、')):''}</p></div></div>${transfer}`}).join(''):'<div class="empty">最短方案不包含公交或地铁乘坐段。</div>'}</div>${data.endWalk?`<div class="section"><div class="walk">🚶 从 ${escapeHtml(data.endWalk.station||'末站')} 出站后步行 ${meters(data.endWalk.distance)} 到达终点</div></div>`:''}`}
function drawTransit(data){clearRoute();const paths=[];data.subwaySegments.forEach(seg=>{if(!seg.polyline)return;const path=seg.polyline.split(';').map(p=>p.split(',').map(Number)).filter(p=>p.length===2&&Number.isFinite(p[0])&&Number.isFinite(p[1]));if(path.length>1){const line=new AMap.Polyline({map,path,strokeColor:COLORS[seg.line]||'#667eea',strokeWeight:7,strokeOpacity:.9,zIndex:120});routeOverlays.push(line);paths.push(...path)}});if(paths.length)map.setFitView(routeOverlays,false,[70,40,90,40])}
function clearRoute(){routeOverlays.forEach(o=>map.remove(o));routeOverlays=[]}
function drawMode(mode,place){if(mode==='transit'){if(place.transitDetail)drawTransit(place.transitDetail);else openDetail(place.id);return}clearRoute();toast(mode==='driving'?'驾车路线请使用导航按钮':'已切换 '+({walking:'步行',riding:'骑行'}[mode]||mode)+' 模式')}
function navigate(place){if(!place)return;const from=myPosition?myPosition.lng+','+myPosition.lat:'';window.open('https://www.amap.com/dir?from[lnglat]='+from+'&to[name]='+encodeURIComponent(place.name)+'&to[lnglat]='+place.lng+','+place.lat+'&type=walk','_blank')}
init();
})();
</script>
</body>
</html>
