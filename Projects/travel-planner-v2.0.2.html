<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>城市漫游行程助手 v2.0.2</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #plannerFrame { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
    .version-badge { position: fixed; top: 6px; left: 8px; z-index: 9999; pointer-events: none; padding: 3px 8px; border-radius: 10px; background: rgba(0,0,0,.62); color: #fff; font: 11px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
</head>
<body>
  <div class="version-badge">城市漫游行程助手 · v2.0.2</div>
  <iframe id="plannerFrame" src="travel-planner.html" title="城市漫游行程助手 v2.0.2"></iframe>
  <script>
  (() => {
    const frame = document.getElementById('plannerFrame');
    frame.addEventListener('load', () => {
      const d = frame.contentDocument;
      const patch = d.createElement('script');
      patch.textContent = String.raw`
(() => {
  if (!window.AMap || window.__travelPlannerV202Patched) return;
  window.__travelPlannerV202Patched = true;

  const FALLBACK_CATEGORY = {
    park: ['🌳', '公园'], museum: ['🏛️', '博物馆'], food: ['🍽️', '美食'],
    cafe: ['☕', '咖啡'], shopping: ['🛍️', '购物'], scenic: ['🎯', '景点'],
    hotel: ['🏨', '酒店'], transport: ['🚉', '交通'], other: ['📌', '其他']
  };
  const fallbackIcon = { walking: '🚶', riding: '🚲', driving: '🚗', transit: '🚇', detail: '📋', edit: '✏️', nav: '🧭', delete: '🗑️' };
  let coloredTransitOverlays = [];

  const category = key => iconConfig && iconConfig.categories && iconConfig.categories[key] || { icon: FALLBACK_CATEGORY[key]?.[0] || '📌', name: FALLBACK_CATEGORY[key]?.[1] || '其他' };
  const uiIcon = (group, key) => iconConfig && iconConfig[group] && iconConfig[group][key] && iconConfig[group][key].icon || fallbackIcon[key] || '';
  const subwayColor = line => iconConfig && iconConfig.subwayColors && iconConfig.subwayColors[line] || SUBWAY_COLORS[line] || '#9C27B0';
  const cleanLineName = value => String(value || '地铁').replace(/[（(].*$/, '').trim() || '地铁';
  const asPath = polyline => String(polyline || '').split(';').map(item => item.split(',').map(Number)).filter(pair => pair.length === 2 && pair.every(Number.isFinite));

  function clearColoredTransit() {
    if (coloredTransitOverlays.length && map) map.remove(coloredTransitOverlays);
    coloredTransitOverlays = [];
  }
  function transitSteps(plan) {
    return (plan && plan.segments || []).map(seg => {
      const busline = seg.bus && Array.isArray(seg.bus.buslines) && seg.bus.buslines[0];
      if (busline) {
        const line = cleanLineName(busline.name || busline.line_name);
        return {
          type: 'subway', line, color: subwayColor(line),
          from: busline.departure_stop && busline.departure_stop.name || '',
          to: busline.arrival_stop && busline.arrival_stop.name || '',
          direction: busline.direction || '', viaNum: Number(busline.via_num || 0), polyline: busline.polyline || ''
        };
      }
      if (seg.walk && Number(seg.walk.distance) > 0) return { type: 'walk', distance: (Number(seg.walk.distance) / 1000).toFixed(1) };
      return null;
    }).filter(Boolean);
  }
  function drawTransitSteps(steps) {
    const polylines = (steps || []).filter(step => step.type === 'subway').map(step => ({ step, path: asPath(step.polyline) })).filter(item => item.path.length > 1);
    if (!polylines.length) return false;
    clearColoredTransit();
    polylines.forEach(({ step, path }) => {
      const line = new AMap.Polyline({ path, strokeColor: step.color, strokeWeight: 7, strokeOpacity: .95, lineJoin: 'round', lineCap: 'round', zIndex: 120 });
      line.setMap(map);
      coloredTransitOverlays.push(line);
    });
    map.setFitView(coloredTransitOverlays, false, [70, 45, 70, 65]);
    return true;
  }
  function transitHtml(steps) {
    if (!steps || !steps.length) return '<div class="transit-detail">暂无可展示的地铁分段信息</div>';
    let html = '<div class="transit-detail">';
    let previous = null;
    steps.forEach(step => {
      if (step.type === 'walk') {
        html += '<div class="transit-step"><span class="transit-walk">🚶 步行 ' + step.distance + 'km</span></div>';
        return;
      }
      if (previous && previous.to && previous.to === step.from) html += '<div class="transit-walk">🔄 在 ' + previous.to + ' 换乘</div>';
      html += '<div class="transit-step"><span class="transit-line-badge" style="background:' + step.color + '">' + step.line + '</span><span>' + (step.direction ? step.direction + '　' : '') + (step.from || '起点站') + ' → ' + (step.to || '终点站') + '（途经 ' + step.viaNum + ' 站）</span></div>';
      previous = step;
    });
    return html + '</div>';
  }

  /* 地铁：先清除高德原生覆盖物，再绘制每条 busline 的真实 polyline；绝不在绘制后再次 clear。 */
  const baseClearRoutes = clearRoutes;
  window.clearRoutes = function() { clearColoredTransit(); return baseClearRoutes(); };
  window.drawRoute = function(place, mode, results) {
    baseClearRoutes();
    clearColoredTransit();
    if (!myPosition || !place || !place.lng || !place.lat) return;
    const from = [myPosition.lng, myPosition.lat], to = [place.lng, place.lat];
    if (mode !== 'transit') {
      ({ walking: walkingInstance, riding: ridingInstance, driving: drivingInstance }[mode]).search(from, to, () => {});
      return;
    }
    transferInstance.search(from, to, (status, response) => {
      const plan = status === 'complete' && response.plans && response.plans[0];
      const steps = plan ? transitSteps(plan) : results && results.transit && results.transit.detail;
      /* Transfer 自带的地图线会覆盖配置色，因此仅将其作为无 polyline 时的兼容回退。 */
      if (drawTransitSteps(steps)) transferInstance.clear();
    });
  };
  window.extractTransitDetail = transitSteps;
  window.renderTransitDetail = transitHtml;

  /* 搜索：将高德已坐标转换后的 myPosition 直接作为 searchNearBy 的 location 圆心。 */
  function searchAroundCurrentLocation(keyword, showLoadingState) {
    if (!myPosition) { showToast('请先完成当前位置定位后再搜索'); return; }
    if (showLoadingState) showLoading('正在以当前位置为圆心搜索 100km 内地点...');
    geocoder.getAddress([myPosition.lng, myPosition.lat], (geoStatus, geoResult) => {
      const component = geoStatus === 'complete' && geoResult.regeocode && geoResult.regeocode.addressComponent;
      const city = component && (Array.isArray(component.city) ? component.city[0] : component.city) || component && component.province || currentCity;
      if (city) currentCity = city;
      const nearby = new AMap.PlaceSearch({ pageSize: 20, city: currentCity, citylimit: false });
      const location = new AMap.LngLat(myPosition.lng, myPosition.lat);
      nearby.searchNearBy(keyword, location, 100000, (status, result) => {
        if (showLoadingState) hideLoading();
        const pois = status === 'complete' && result.poiList && result.poiList.pois || [];
        if (pois.length) renderSearchResults(pois);
        else if (showLoadingState) showToast('当前位置 100km 内未找到相关地点');
      });
    });
  }
  window.doMapSearch = function() {
    const keyword = document.getElementById('mapSearchInput').value.trim();
    if (keyword) searchAroundCurrentLocation(keyword, true);
  };
  window.doAutoComplete = function(keyword) {
    if (myPosition) searchAroundCurrentLocation(keyword, false);
    else autoComplete.search(keyword, (status, result) => {
      if (status === 'complete' && result.tips && result.tips.length) renderSearchResults(result.tips);
    });
  };

  /* 列表图标与详情入口：直接使用 iframe 内原始词法状态，避免跨 frame 访问 let 变量导致按钮无响应。 */
  window.renderPlaceList = function() {
    const container = document.getElementById('placeListContainer');
    const keyword = document.getElementById('placeSearchInput').value.trim().toLowerCase();
    let list = places.filter(p => (currentCategory === 'all' || p.category === currentCategory) && (!keyword || p.name.toLowerCase().includes(keyword))).map(p => {
      const distance = myPosition && p.lng && p.lat ? calcDistance(myPosition.lat, myPosition.lng, p.lat, p.lng) : null;
      const cached = placeRouteCache[p.id] || {};
      return { ...p, distance, walk: cached.walking && cached.walking.time || (distance === null ? null : Math.round(distance / 5 * 60)), ride: cached.riding && cached.riding.time || (distance === null ? null : Math.round(distance / 15 * 60)), drive: cached.driving && cached.driving.time || (distance === null ? null : Math.round(distance / 40 * 60)), transit: cached.transit && cached.transit.time || (distance === null ? null : Math.round(distance / 25 * 60 + 10)) };
    });
    const sortField = { distance: 'distance', walkTime: 'walk', rideTime: 'ride', driveTime: 'drive', transitTime: 'transit' }[currentSort];
    list.sort((a, b) => currentSort === 'name' ? a.name.localeCompare(b.name, 'zh') : ((a[sortField] == null) - (b[sortField] == null) || (a[sortField] || 0) - (b[sortField] || 0)));
    if (!list.length) { container.innerHTML = '<div class="empty-state"><div class="es-icon">📍</div><p>' + (keyword ? '没有找到匹配的地点' : '还没有添加地点') + '</p></div>'; return; }
    container.innerHTML = list.map(p => {
      const c = category(p.category);
      const time = (key, value) => value === null ? '' : '<span class="pd-time-item">' + uiIcon('transport', key) + ' ' + value + '分</span>';
      return '<div class="place-card"><div class="place-avatar">' + c.icon + '</div><div class="place-detail"><div class="pd-name">' + p.name + '</div><div class="pd-meta"><span class="pd-tag">' + c.name + '</span>' + (p.distance !== null ? '<span class="pd-dist">📍 ' + formatDist(p.distance) + '</span>' : '') + '</div><div class="pd-times">' + time('walking', p.walk) + time('riding', p.ride) + time('driving', p.drive) + time('transit', p.transit) + '</div>' + (p.address ? '<div class="pd-note">📌 ' + p.address + '</div>' : '') + '</div><div class="place-actions"><button class="pa-btn detail" onclick="showPlaceDetail(' + p.id + ')">' + uiIcon('buttons', 'detail') + ' 详情</button><button class="pa-btn edit" onclick="editPlace(' + p.id + ')">' + uiIcon('buttons', 'edit') + ' 编辑</button><button class="pa-btn nav" onclick="navToPlace(' + p.id + ')">' + uiIcon('buttons', 'nav') + ' 导航</button><button class="pa-btn del" onclick="deletePlace(' + p.id + ')">' + uiIcon('buttons', 'delete') + ' 删除</button></div></div>';
    }).join('');
  };
  function fetchDetailRoutes(place, done) {
    if (!myPosition || !place.lng || !place.lat) { done(); return; }
    const from = [myPosition.lng, myPosition.lat], to = [place.lng, place.lat], cache = {}, jobs = [
      ['walking', new AMap.Walking(), r => r.routes && r.routes[0]], ['riding', new AMap.Riding(), r => r.routes && r.routes[0]], ['driving', new AMap.Driving(), r => r.routes && r.routes[0]], ['transit', new AMap.Transfer({ city: currentCity }), r => r.plans && r.plans[0]]
    ];
    let finished = 0;
    jobs.forEach(([name, service, getRoute]) => service.search(from, to, (status, result) => {
      const route = status === 'complete' && getRoute(result);
      cache[name] = route ? { time: Math.round(route.time / 60), distance: (route.distance / 1000).toFixed(1), detail: name === 'transit' ? transitSteps(route) : null } : { time: null, distance: null, detail: null };
      if (++finished === jobs.length) { placeRouteCache[place.id] = cache; done(); }
    }));
  }
  window.showPlaceDetail = function(id) {
    const place = places.find(p => p.id === id);
    if (!place) return;
    const cached = placeRouteCache[place.id] || {};
    const c = category(place.category);
    const card = (key, label) => '<div class="pdm-time-card"><div class="ptc-icon">' + uiIcon('transport', key) + '</div><div class="ptc-time">' + (cached[key] && cached[key].time ? cached[key].time + '分钟' : '查询中…') + '</div><div class="ptc-dist">' + (cached[key] && cached[key].distance ? cached[key].distance + 'km' : '') + '</div></div>';
    document.getElementById('pdmTitle').textContent = place.name;
    document.getElementById('pdmContent').innerHTML = '<div class="pdm-section"><div class="pdm-section-title">基本信息</div><p style="font-size:14px;color:#333;">' + c.icon + ' ' + c.name + '</p>' + (place.address ? '<p style="font-size:13px;color:#666;margin-top:4px;">📌 ' + place.address + '</p>' : '') + '</div><div class="pdm-section"><div class="pdm-section-title">交通方式</div><div class="pdm-times-grid">' + card('walking') + card('riding') + card('driving') + card('transit') + '</div></div>' + (cached.transit && cached.transit.detail ? '<div class="pdm-section"><div class="pdm-section-title">地铁路线详情</div>' + transitHtml(cached.transit.detail) + '</div>' : '');
    document.getElementById('pdmNavBtn').onclick = () => { navToPlace(id); closePlaceDetailModal(); };
    document.getElementById('placeDetailModal').classList.add('active');
    if (!placeRouteCache[place.id] && myPosition) {
      showLoading('正在查询路线详情...');
      fetchDetailRoutes(place, () => { hideLoading(); window.showPlaceDetail(id); window.renderPlaceList(); });
    }
  };

  const originalLoadIconConfig = loadIconConfig;
  window.loadIconConfig = async function() { const value = await originalLoadIconConfig.apply(this, arguments); window.renderPlaceList(); return value; };
  window.renderPlaceList();
})();`;
      d.body.appendChild(patch);
    });
  })();
  </script>
</body>
</html>
