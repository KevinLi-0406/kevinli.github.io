<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>城市漫游行程助手 v2.0.10</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #plannerFrame { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
    .version-badge { position: fixed; top: 6px; left: 8px; z-index: 9999; pointer-events: none; padding: 3px 8px; border-radius: 10px; background: rgba(0,0,0,.62); color: #fff; font: 11px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
</head>
<body>
  <div class="version-badge">城市漫游行程助手 · v2.0.10</div>
  <iframe id="plannerFrame" src="travel-planner-v2.0.9.html" title="城市漫游行程助手 v2.0.10"></iframe>
  <script>
  (() => {
    const frame = document.getElementById('plannerFrame');
    function installV210Patch(baseDocument) {
      if (!baseDocument || baseDocument.getElementById('travelPlannerV210Patch')) return;
      const script = baseDocument.createElement('script');
      script.id = 'travelPlannerV210Patch';
      script.textContent = String.raw`
(() => {
  if (window.__travelPlannerV210Installed) return;
  window.__travelPlannerV210Installed = true;
  function mapClickDisplayName(poi) {
    const name = poi && poi.name == null ? '' : String(poi && poi.name || '').trim();
    const address = poi && poi.address == null ? '' : String(poi && poi.address || '').trim();
    if (!name || !address || name !== address) return name;
    const afterHouseNumber = address.replace(/^.*?\d+(?:号院|号|弄|栋|座)/, '').trim();
    if (afterHouseNumber && afterHouseNumber !== address) return afterHouseNumber;
    return '地图选点';
  }
  const originalShowPoiDetail = window.showPoiDetail;
  window.showPoiDetail = function(poi) {
    if (!poi) return originalShowPoiDetail.call(this, poi);
    const displayName = mapClickDisplayName(poi);
    return originalShowPoiDetail.call(this, { ...poi, name: displayName || poi.name });
  };
})();`;
      baseDocument.body.appendChild(script);
    }
    function attachToBase() {
      const v209Document = frame.contentDocument;
      const v208Frame = v209Document && v209Document.getElementById('plannerFrame');
      if (!v208Frame) return;
      const attachToV208 = () => {
        const v208Document = v208Frame.contentDocument;
        const v207Frame = v208Document && v208Document.getElementById('plannerFrame');
        if (!v207Frame) return;
        const attachToV207 = () => {
          const v207Document = v207Frame.contentDocument;
          const baseFrame = v207Document && v207Document.getElementById('plannerFrame');
          if (!baseFrame) return;
          const apply = () => installV210Patch(baseFrame.contentDocument);
          baseFrame.addEventListener('load', apply);
          apply();
        };
        v207Frame.addEventListener('load', attachToV207);
        attachToV207();
      };
      v208Frame.addEventListener('load', attachToV208);
      attachToV208();
    }
    frame.addEventListener('load', attachToBase);
  })();
  </script>
</body>
</html>
