    // ============================================================
    //  地点列表渲染
    // ============================================================
    function renderPlaceList() {
        const container = document.getElementById('placeListContainer');
        const keyword = document.getElementById('placeSearchInput').value.trim().toLowerCase();

        let filtered = places.filter(p => {
            if (currentCategory !== 'all' && p.category !== currentCategory) return false;
            if (keyword && !p.name.toLowerCase().includes(keyword)) return false;
            return true;
        });

        filtered = filtered.map(p => {
            let dist = null;
            let walkTime = null, rideTime = null, driveTime = null, transitTime = null;

            if (myPosition && p.lng && p.lat) {
                dist = calcDistance(myPosition.lat, myPosition.lng, p.lat, p.lng);
                walkTime = Math.round(dist / 5 * 60);
                rideTime = Math.round(dist / 15 * 60);
                driveTime = Math.round(dist / 40 * 60);
                transitTime = Math.round(dist / 25 * 60 + 10);
            }

            const cached = placeRouteCache[p.id];
            if (cached) {
                if (cached.walking && cached.walking.time) walkTime = cached.walking.time;
                if (cached.riding && cached.riding.time) rideTime = cached.riding.time;
                if (cached.driving && cached.driving.time) driveTime = cached.driving.time;
                if (cached.transit && cached.transit.time) transitTime = cached.transit.time;
            }

            return { ...p, distance: dist, walkTime, rideTime, driveTime, transitTime };
        });

        filtered.sort((a, b) => {
            switch(currentSort) {
                case 'distance':
                    if (a.distance === null && b.distance === null) return 0;
                    if (a.distance === null) return 1;
                    if (b.distance === null) return -1;
                    return a.distance - b.distance;
                case 'walkTime':
                    if (a.walkTime === null && b.walkTime === null) return 0;
                    if (a.walkTime === null) return 1;
                    if (b.walkTime === null) return -1;
                    return a.walkTime - b.walkTime;
                case 'rideTime':
                    if (a.rideTime === null && b.rideTime === null) return 0;
                    if (a.rideTime === null) return 1;
                    if (b.rideTime === null) return -1;
                    return a.rideTime - b.rideTime;
                case 'driveTime':
                    if (a.driveTime === null && b.driveTime === null) return 0;
                    if (a.driveTime === null) return 1;
                    if (b.driveTime === null) return -1;
                    return a.driveTime - b.driveTime;
                case 'transitTime':
                    if (a.transitTime === null && b.transitTime === null) return 0;
                    if (a.transitTime === null) return 1;
                    if (b.transitTime === null) return -1;
                    return a.transitTime - b.transitTime;
                case 'name':
                    return a.name.localeCompare(b.name, 'zh');
                default:
                    return 0;
            }
        });

        if (filtered.length === 0) {
            container.innerHTML = `
                <div class="empty-state">
                    <div class="es-icon">📍</div>
                    <p>${keyword ? '没有找到匹配的地点' : '还没有添加地点'}</p>
                    <p style="margin-top:8px;font-size:12px;">在地图上搜索或点击添加</p>
                </div>
            `;
            return;
        }

        container.innerHTML = filtered.map(p => `
            <div class="place-card">
                <div class="place-avatar">${CAT_ICONS[p.category] || ''}</div>
                <div class="place-detail">
                    <div class="pd-name">${p.name}</div>
                    <div class="pd-meta">
                        <span class="pd-tag">${CAT_NAMES[p.category] || '其他'}</span>
                        ${p.distance !== null ? `<span class="pd-dist">📍 ${formatDist(p.distance)}</span>` : ''}
                    </div>
                    <div class="pd-times">
                        ${p.walkTime !== null ? `<span class="pd-time-item">🚶${p.walkTime}分</span>` : ''}
                        ${p.rideTime !== null ? `<span class="pd-time-item">🚲${p.rideTime}分</span>` : ''}
                        ${p.driveTime !== null ? `<span class="pd-time-item">${p.driveTime}分</span>` : ''}
                        ${p.transitTime !== null ? `<span class="pd-time-item">🚇${p.transitTime}分</span>` : ''}
                    </div>
                    ${p.address ? `<div class="pd-note">📌 ${p.address}</div>` : ''}
                    ${p.note ? `<div class="pd-note">💬 ${p.note}</div>` : ''}
                </div>
                <div class="place-actions">
                    <button class="pa-btn detail" onclick="showPlaceDetail(${p.id})" title="详情">📋 详情</button>
                    <button class="pa-btn edit" onclick="editPlace(${p.id})" title="编辑">✏️ 编辑</button>
                    <button class="pa-btn nav" onclick="navToPlace(${p.id})" title="导航"> 导航</button>
                    <button class="pa-btn del" onclick="deletePlace(${p.id})" title="删除">🗑️ 删除</button>
                </div>
            </div>
        `).join('');
    }

    // ============================================================
    //  地点详情
    // ============================================================
    function showPlaceDetail(id) {
        const place = places.find(p => p.id === id);
        if (!place) return;

        document.getElementById('pdmTitle').textContent = place.name;

        const cached = placeRouteCache[place.id];
        let walkTime = null, rideTime = null, driveTime = null, transitTime = null;
        let walkDist = null, rideDist = null, driveDist = null, transitDist = null;

        if (cached) {
            if (cached.walking) { walkTime = cached.walking.time; walkDist = cached.walking.distance; }
            if (cached.riding) { rideTime = cached.riding.time; rideDist = cached.riding.distance; }
            if (cached.driving) { driveTime = cached.driving.time; driveDist = cached.driving.distance; }
            if (cached.transit) { transitTime = cached.transit.time; transitDist = cached.transit.distance; }
        }

        if (myPosition && place.lng && place.lat) {
            const dist = calcDistance(myPosition.lat, myPosition.lng, place.lat, place.lng);
            if (!walkTime) walkTime = Math.round(dist / 5 * 60);
            if (!rideTime) rideTime = Math.round(dist / 15 * 60);
            if (!driveTime) driveTime = Math.round(dist / 40 * 60);
            if (!transitTime) transitTime = Math.round(dist / 25 * 60 + 10);
            if (!walkDist) walkDist = dist.toFixed(1);
            if (!rideDist) rideDist = dist.toFixed(1);
            if (!driveDist) driveDist = dist.toFixed(1);
            if (!transitDist) transitDist = dist.toFixed(1);
        }

        let html = `
            <div class="pdm-section">
                <div class="pdm-section-title">基本信息</div>
                <p style="font-size:14px;color:#333;">${CAT_ICONS[place.category] || '📌'} ${CAT_NAMES[place.category] || '其他'}</p>
                ${place.address ? `<p style="font-size:13px;color:#666;margin-top:4px;">📌 ${place.address}</p>` : ''}
                ${place.note ? `<p style="font-size:13px;color:#666;margin-top:4px;">💬 ${place.note}</p>` : ''}
            </div>
            <div class="pdm-section">
                <div class="pdm-section-title">交通方式</div>
                <div class="pdm-times-grid">
                    <div class="pdm-time-card">
                        <div class="ptc-icon">🚶</div>
                        <div class="ptc-time">${walkTime ? walkTime + '分钟' : '不可达'}</div>
                        <div class="ptc-dist">${walkDist ? walkDist + 'km' : ''}</div>
                    </div>
                    <div class="pdm-time-card">
                        <div class="ptc-icon">🚲</div>
                        <div class="ptc-time">${rideTime ? rideTime + '分钟' : '不可达'}</div>
                        <div class="ptc-dist">${rideDist ? rideDist + 'km' : ''}</div>
                    </div>
                    <div class="pdm-time-card">
                        <div class="ptc-icon">🚗</div>
                        <div class="ptc-time">${driveTime ? driveTime + '分钟' : '不可达'}</div>
                        <div class="ptc-dist">${driveDist ? driveDist + 'km' : ''}</div>
                    </div>
                    <div class="pdm-time-card">
                        <div class="ptc-icon">🚇</div>
                        <div class="ptc-time">${transitTime ? transitTime + '分钟' : '不可达'}</div>
                        <div class="ptc-dist">${transitDist ? transitDist + 'km' : ''}</div>
                    </div>
                </div>
            </div>
        `;

        if (cached && cached.transit && cached.transit.detail) {
            html += `
                <div class="pdm-section">
                    <div class="pdm-section-title">地铁路线详情</div>
                    ${renderTransitDetail(cached.transit.detail)}
                </div>
            `;
        }

        document.getElementById('pdmContent').innerHTML = html;
        document.getElementById('pdmNavBtn').onclick = () => { navToPlace(id); closePlaceDetailModal(); };
        document.getElementById('placeDetailModal').classList.add('active');
    }

    function closePlaceDetailModal() {
        document.getElementById('placeDetailModal').classList.remove('active');
    }

    // 时间轴式地铁换乘详情展示
    function renderTransitDetail(steps) {
        if (!steps || steps.length === 0) return '<p style="color:#999;">暂无地铁路线详情</p>';
        let html = '<div class="transit-timeline">';
        
        steps.forEach((step, index) => {
            if (step.type === 'subway') {
                html += `
                    <div class="transit-timeline-item" style="color:${step.color};">
                        <div class="tti-header">
                            <span class="transit-line-badge" style="background:${step.color};">${step.line}</span>
                            <span class="transit-direction">${step.direction}</span>
                        </div>
                        <div class="transit-stations">
                            <span class="ts-board">🚉 ${step.from}</span>
                            <span class="ts-arrow">→</span>
                            <span class="ts-alight">🚉 ${step.to}</span>
                        </div>
                        <div class="transit-via">途经 ${step.viaNum || 0} 站</div>
                    </div>
                `;
            } else if (step.type === 'walk') {
                html += `<div class="transit-walk-node">步行 ${step.distance}km</div>`;
            }
            
            // 换乘提示
            if (index < steps.length - 1 && steps[index + 1].type === 'subway') {
                const nextStep = steps[index + 1];
                html += `
                    <div class="transit-transfer-node">
                        <span class="transit-transfer-text">在 ${nextStep.from} 换乘 ${nextStep.line}</span>
                    </div>
                `;
            }
        });
        
        html += '</div>';
        return html;
    }

    // ============================================================
    //  地点 CRUD
    // ============================================================
    function closeAddModal() {
        document.getElementById('addModal').classList.remove('active');
        document.getElementById('nameSelector').style.display = 'none';
    }

    function savePlace() {
        const name = document.getElementById('fName').value.trim();
        if (!name) { showToast('请输入地点名称'); return; }

        const coordsStr = document.getElementById('fCoords').value.trim();
        let lng = null, lat = null;
        if (coordsStr) {
            const parts = coordsStr.split(',').map(s => parseFloat(s.trim()));
            if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
                lng = parts[0];
                lat = parts[1];
            }
        }

        const editId = document.getElementById('editPlaceId').value;
        const placeData = {
            name: name,
            category: document.getElementById('fCategory').value,
            address: document.getElementById('fAddress').value.trim(),
            note: document.getElementById('fNote').value.trim(),
            lng: lng,
            lat: lat
        };

        if (editId) {
            const idx = places.findIndex(p => p.id === parseInt(editId));
            if (idx !== -1) {
                places[idx] = { ...places[idx], ...placeData };
                showToast('✅ 地点已更新');
            }
        } else {
            placeData.id = Date.now();
            placeData.createdAt = new Date().toISOString();
            places.push(placeData);
            showToast('✅ 地点已添加');
        }

        saveData();
        renderPlaceMarkers();
        renderPlaceList();
        closeAddModal();
    }

    function editPlace(id) {
        const place = places.find(p => p.id === id);
        if (!place) return;

        document.getElementById('editPlaceId').value = id;
        document.getElementById('addModalTitle').textContent = '编辑地点';
        document.getElementById('fName').value = place.name;
        document.getElementById('fCategory').value = place.category || 'other';
        document.getElementById('fAddress').value = place.address || '';
        document.getElementById('fNote').value = place.note || '';
        document.getElementById('fCoords').value = (place.lng && place.lat) ? `${place.lng.toFixed(6)}, ${place.lat.toFixed(6)}` : '';
        document.getElementById('nameSelector').style.display = 'none';

        document.getElementById('addModal').classList.add('active');
    }

    function deletePlace(id) {
        showConfirmModal('⚠️', '确定要删除这个地点吗？', '删除后无法恢复', () => {
            places = places.filter(p => p.id !== id);
            delete placeRouteCache[id];
            saveData();
            renderPlaceMarkers();
            renderPlaceList();
            showToast('🗑️ 地点已删除');
        });
    }

    function navToPlace(id) {
        const place = places.find(p => p.id === id);
        if (!place || !place.lng || !place.lat) {
            showToast('该地点没有坐标信息');
            return;
        }
        
        const fromLng = myPosition ? myPosition.lng : '';
        const fromLat = myPosition ? myPosition.lat : '';
        
        showLoading('正在获取地址...');
        
        let fromAddr = '', toAddr = place.address || '';
        let completed = 0;
        
        function openNav() {
            completed++;
            if (completed >= 2 || (completed === 1 && !myPosition)) {
                hideLoading();
                const url = `https://www.amap.com/dir?from[name]=${encodeURIComponent(fromAddr || '我的位置')}&from[lnglat]=${fromLng},${fromLat}&to[name]=${encodeURIComponent(place.name)}&to[lnglat]=${place.lng},${place.lat}&type=walk`;
                window.open(url, '_blank');
            }
        }
        
        if (myPosition) {
            geocoder.getAddress([fromLng, fromLat], (status, result) => {
                if (status === 'complete' && result.regeocode) {
                    fromAddr = result.regeocode.formattedAddress;
                } else {
                    fromAddr = '我的位置';
                }
                openNav();
            });
        } else {
            fromAddr = '我的位置';
            openNav();
        }
        
        if (!place.address) {
            geocoder.getAddress([place.lng, place.lat], (status, result) => {
                if (status === 'complete' && result.regeocode) {
                    toAddr = result.regeocode.formattedAddress;
                }
                openNav();
            });
        } else {
            openNav();
        }
    }

    // ============================================================
    //  方案管理
    // ============================================================
    function openSavePlanModal() {
        if (places.length === 0) {
            showToast('请先添加地点');
            return;
        }
        document.getElementById('planNameInput').value = '';
        document.getElementById('planNoteInput').value = '';
        
        const existingGroup = document.getElementById('saveToExistingGroup');
        const existingSelect = document.getElementById('saveToExistingPlan');
        if (plans.length > 0) {
            existingGroup.style.display = 'block';
            existingSelect.innerHTML = '<option value="">-- 创建新方案 --</option>' + 
                plans.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
        } else {
            existingGroup.style.display = 'none';
        }
        
        document.getElementById('savePlanModal').classList.add('active');
    }

    function closeSavePlanModal() {
        document.getElementById('savePlanModal').classList.remove('active');
    }

    function confirmSavePlan() {
        const name = document.getElementById('planNameInput').value.trim();
        const note = document.getElementById('planNoteInput').value.trim();
        const saveToExistingId = document.getElementById('saveToExistingPlan').value;
        
        if (saveToExistingId) {
            const plan = plans.find(p => p.id === parseInt(saveToExistingId));
            if (plan) {
                plan.placesSnapshot = JSON.parse(JSON.stringify(places));
                plan.placeIds = places.map(p => p.id);
                if (note) plan.note = note;
                saveData();
                renderPlanList();
                closeSavePlanModal();
                showToast('✅ 方案已更新');
            }
        } else {
            if (!name) { showToast('请输入方案名称'); return; }
            const plan = {
                id: Date.now(),
                name: name,
                note: note,
                placeIds: places.map(p => p.id),
                placesSnapshot: JSON.parse(JSON.stringify(places)),
                createdAt: new Date().toISOString()
            };
            plans.push(plan);
            saveData();
            renderPlanList();
            closeSavePlanModal();
            showToast('✅ 方案已保存');
        }

        places = [];
        placeRouteCache = {};
        saveData();
        renderPlaceMarkers();
        renderPlaceList();
    }

    function renderPlanList() {
        const container = document.getElementById('planListContainer');
        if (plans.length === 0) {
            container.innerHTML = '<div class="empty-state"><div class="es-icon">📋</div><p>还没有保存方案<br>添加地点后点击"保存当前方案"</p></div>';
            return;
        }

        container.innerHTML = plans.map(plan => {
            const planPlaces = plan.placesSnapshot || plan.placeIds.map(id => places.find(p => p.id === id)).filter(Boolean);
            return `
                <div class="plan-card">
                    <div class="pc-header">
                        <div class="pc-name">📋 ${plan.name}</div>
                        <div class="pc-count">${planPlaces.length} 个地点</div>
                    </div>
                    ${plan.note ? `<div style="font-size:12px;color:#999;margin-bottom:8px;">💬 ${plan.note}</div>` : ''}
                    <div class="pc-places">${planPlaces.map(p => `${CAT_ICONS[p.category] || ''} ${p.name}`).join('、')}</div>
                    <div class="pc-actions">
                        <button style="background:#e8f4fd;color:#1976d2;" onclick="loadPlan(${plan.id})"> 加载</button>
                        <button style="background:#e8f5e9;color:#388e3c;" onclick="editPlan(${plan.id})">✏️ 编辑</button>
                        <button style="background:#fff3e0;color:#f57c00;" onclick="renamePlan(${plan.id})">✏️ 重命名</button>
                        <button style="background:#fee;color:#e74c3c;" onclick="deletePlan(${plan.id})">🗑️ 删除</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function loadPlan(id) {
        const plan = plans.find(p => p.id === id);
        if (!plan) return;
        const planPlaces = plan.placesSnapshot || [];
        if (planPlaces.length === 0) {
            showToast('方案中没有地点');
            return;
        }
        places = JSON.parse(JSON.stringify(planPlaces));
        saveData();
        renderPlaceMarkers();
        renderPlaceList();
        showToast(`📂 已加载方案"${plan.name}"`);
    }

    function editPlan(id) {
        loadPlan(id);
        switchTab('places');
        showToast('✏️ 已加载方案，可以编辑');
    }

    function renamePlan(id) {
        const plan = plans.find(p => p.id === id);
        if (!plan) return;
        
        const newName = prompt('请输入新名称', plan.name);
        if (newName && newName.trim()) {
            plan.name = newName.trim();
            saveData();
            renderPlanList();
            showToast('✅ 方案已重命名');
        }
    }

    function deletePlan(id) {
        showConfirmModal('⚠️', '确定要删除这个方案吗？', '删除后无法恢复', () => {
            plans = plans.filter(p => p.id !== id);
            saveData();
            renderPlanList();
            showToast('🗑️ 方案已删除');
        });
    }

    // ============================================================
    //  自定义确认弹窗
    // ============================================================
    function showConfirmModal(icon, message, submessage, callback) {
        document.getElementById('cmIcon').textContent = icon;
        document.getElementById('cmMessage').textContent = message;
        document.getElementById('cmSubmessage').textContent = submessage || '';
        confirmCallback = callback;
        document.getElementById('confirmModal').classList.add('active');
    }

    function closeConfirmModal() {
        document.getElementById('confirmModal').classList.remove('active');
        confirmCallback = null;
    }

    document.getElementById('cmConfirmBtn').onclick = () => {
        if (confirmCallback) confirmCallback();
        closeConfirmModal();
    };

    // ============================================================
    //  标签切换
    // ============================================================
    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

        document.getElementById(`tab${tab.charAt(0).toUpperCase() + tab.slice(1)}`).classList.add('active');
        document.querySelector(`.nav-item[data-tab="${tab}"]`).classList.add('active');

        if (tab === 'places') renderPlaceList();
        if (tab === 'plans') renderPlanList();
    }

    function setCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.cat === cat);
        });
        renderPlaceList();
    }

    function setSort(sort) {
        currentSort = sort;
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.sort === sort);
        });
        renderPlaceList();
    }

    // ============================================================
    //  底部面板折叠/展开
    // ============================================================
    function toggleBottomPanel() {
        bottomPanelCollapsed = !bottomPanelCollapsed;
        const panel = document.getElementById('bottomPanel');
        const icon = document.getElementById('panelToggleIcon');
        const mapSection = document.getElementById('mapSection');
        
        if (bottomPanelCollapsed) {
            panel.classList.add('collapsed');
            icon.textContent = '▲';
            mapSection.classList.add('expanded');
        } else {
            panel.classList.remove('collapsed');
            icon.textContent = '▼';
            mapSection.classList.remove('expanded');
        }
    }

    // ============================================================
    //  工具函数
    // ============================================================
    function calcDistance(lat1, lng1, lat2, lng2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLng = (lng2 - lng1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLng/2) * Math.sin(dLng/2);
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    function formatDist(km) {
        if (km < 1) return `${Math.round(km * 1000)}m`;
        return `${km.toFixed(1)}km`;
    }

    function showLoading(text) {
        document.getElementById('loadingText').textContent = text || '加载中...';
        document.getElementById('loadingOverlay').classList.add('active');
    }

    function hideLoading() {
        document.getElementById('loadingOverlay').classList.remove('active');
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('active');
        setTimeout(() => toast.classList.remove('active'), 2500);
    }

    document.getElementById('addModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeAddModal();
    });
    document.getElementById('savePlanModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeSavePlanModal();
    });
    document.getElementById('setLocationModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeSetLocationModal();
    });
    document.getElementById('placeDetailModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closePlaceDetailModal();
    });
    document.getElementById('confirmModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeConfirmModal();
    });
    </script>
