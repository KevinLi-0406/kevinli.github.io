<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>行程助手 - 发现身边的好去处</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            padding-bottom: 100px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .location-status {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .location-icon {
            width: 40px;
            height: 40px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .location-info {
            flex: 1;
        }

        .location-info .label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .location-info .value {
            font-size: 14px;
            font-weight: 600;
            color: #333;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f4ff;
            color: #667eea;
        }

        .btn-secondary:hover {
            background: #e0e7ff;
        }

        .btn-danger {
            background: #fee;
            color: #e74c3c;
        }

        .btn-danger:hover {
            background: #fdd;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .place-list {
            list-style: none;
        }

        .place-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }

        .place-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .place-distance {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            margin-right: 15px;
            flex-shrink: 0;
        }

        .place-distance .number {
            font-size: 18px;
            font-weight: 700;
        }

        .place-distance .unit {
            font-size: 10px;
            opacity: 0.9;
        }

        .place-info {
            flex: 1;
            min-width: 0;
        }

        .place-name {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .place-type {
            display: inline-block;
            padding: 3px 8px;
            background: #667eea;
            color: white;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .place-address {
            font-size: 12px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .place-actions {
            display: flex;
            gap: 8px;
            margin-left: 10px;
        }

        .place-actions button {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-navigate {
            background: #e8f5e9;
            color: #4caf50;
        }

        .btn-navigate:hover {
            background: #c8e6c9;
        }

        .btn-delete {
            background: #fee;
            color: #e74c3c;
        }

        .btn-delete:hover {
            background: #fdd;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 25px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 20px;
            color: #333;
        }

        .modal-close {
            width: 32px;
            height: 32px;
            border: none;
            background: #f0f0f0;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            color: #666;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .filter-tab {
            padding: 8px 16px;
            background: #f0f4ff;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .filter-tab.active {
            background: #667eea;
            color: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9ff;
            border-radius: 12px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .header h1 {
                font-size: 24px;
            }

            .card {
                padding: 15px;
            }

            .place-distance {
                width: 50px;
                height: 50px;
            }

            .place-distance .number {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🗺️ 行程助手</h1>
            <p>记录想去的地方，发现身边的好去处</p>
        </div>

        <!-- 位置状态 -->
        <div class="card">
            <div class="location-status">
                <div class="location-icon">📍</div>
                <div class="location-info">
                    <div class="label">当前位置</div>
                    <div class="value" id="currentLocation">点击获取位置</div>
                </div>
            </div>
            <button class="btn btn-primary" onclick="getLocation()">📡 获取我的位置</button>
        </div>

        <!-- 统计信息 -->
        <div class="card">
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="totalPlaces">0</div>
                    <div class="stat-label">总地点</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="nearbyPlaces">0</div>
                    <div class="stat-label">附近地点</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="closestDistance">-</div>
                    <div class="stat-label">最近距离</div>
                </div>
            </div>
        </div>

        <!-- 筛选标签 -->
        <div class="card">
            <div class="filter-tabs">
                <button class="filter-tab active" onclick="filterPlaces('all')">全部</button>
                <button class="filter-tab" onclick="filterPlaces('restaurant')">🍽️ 餐厅</button>
                <button class="filter-tab" onclick="filterPlaces('cafe')">☕ 咖啡</button>
                <button class="filter-tab" onclick="filterPlaces('attraction')">🎯 景点</button>
                <button class="filter-tab" onclick="filterPlaces('shopping')">🛍️ 购物</button>
                <button class="filter-tab" onclick="filterPlaces('other')">📌 其他</button>
            </div>
        </div>

        <!-- 地点列表 -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 style="font-size: 18px; color: #333;"> 地点列表</h3>
                <button class="btn btn-secondary" style="width: auto; padding: 10px 20px; margin: 0;" onclick="openModal()">➕ 添加</button>
            </div>
            <ul class="place-list" id="placeList">
                <div class="empty-state">
                    <div class="icon">📍</div>
                    <p>还没有添加地点<br>点击右上角"添加"开始记录吧！</p>
                </div>
            </ul>
        </div>
    </div>

    <!-- 添加地点弹窗 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>添加新地点</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <form id="addPlaceForm">
                <div class="form-group">
                    <label>地点名称 *</label>
                    <input type="text" id="placeName" placeholder="例如：星巴克咖啡" required>
                </div>
                <div class="form-group">
                    <label>类型</label>
                    <select id="placeType">
                        <option value="restaurant">️ 餐厅</option>
                        <option value="cafe">☕ 咖啡</option>
                        <option value="attraction">🎯 景点</option>
                        <option value="shopping">🛍️ 购物</option>
                        <option value="other">📌 其他</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>地址</label>
                    <input type="text" id="placeAddress" placeholder="例如：北京市朝阳区xxx路">
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="placeNote" placeholder="例如：推荐拿铁，环境不错"></textarea>
                </div>
                <div class="form-group">
                    <label>坐标（可选，不填将使用地图定位）</label>
                    <input type="text" id="placeCoords" placeholder="例如：39.9042, 116.4074">
                </div>
                <button type="submit" class="btn btn-primary">保存地点</button>
            </form>
        </div>
    </div>

    <script>
        // 数据存储
        let places = JSON.parse(localStorage.getItem('travelPlaces') || '[]');
        let currentLocation = null;
        let currentFilter = 'all';

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderPlaces();
            updateStats();
        });

        // 获取当前位置
        function getLocation() {
            const locationEl = document.getElementById('currentLocation');
            locationEl.textContent = '定位中...';

            if (!navigator.geolocation) {
                locationEl.textContent = '浏览器不支持定位';
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    currentLocation = {
                        lat: position.coords.latitude,
                        lng: position.coords.longitude
                    };
                    locationEl.textContent = `${currentLocation.lat.toFixed(4)}, ${currentLocation.lng.toFixed(4)}`;
                    renderPlaces();
                    updateStats();
                },
                (error) => {
                    locationEl.textContent = '定位失败，请检查权限';
                    console.error('定位错误:', error);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // 计算两点距离（Haversine公式）
        function calculateDistance(lat1, lng1, lat2, lng2) {
            const R = 6371; // 地球半径（公里）
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLng = (lng2 - lng1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLng/2) * Math.sin(dLng/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // 格式化距离
        function formatDistance(km) {
            if (km < 1) {
                return `${Math.round(km * 1000)}m`;
            }
            return `${km.toFixed(1)}km`;
        }

        // 渲染地点列表
        function renderPlaces() {
            const listEl = document.getElementById('placeList');
            
            let filteredPlaces = places;
            if (currentFilter !== 'all') {
                filteredPlaces = places.filter(p => p.type === currentFilter);
            }

            // 计算距离并排序
            let placesWithDistance = filteredPlaces.map(place => {
                let distance = null;
                if (currentLocation && place.lat && place.lng) {
                    distance = calculateDistance(
                        currentLocation.lat,
                        currentLocation.lng,
                        place.lat,
                        place.lng
                    );
                }
                return { ...place, distance };
            });

            // 按距离排序（有距离的在前）
            placesWithDistance.sort((a, b) => {
                if (a.distance === null && b.distance === null) return 0;
                if (a.distance === null) return 1;
                if (b.distance === null) return -1;
                return a.distance - b.distance;
            });

            if (placesWithDistance.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📍</div>
                        <p>${currentFilter === 'all' ? '还没有添加地点<br>点击右上角"添加"开始记录吧！' : '该分类下没有地点'}</p>
                    </div>
                `;
                return;
            }

            listEl.innerHTML = placesWithDistance.map((place, index) => `
                <li class="place-item">
                    <div class="place-distance">
                        <div class="number">${place.distance !== null ? index + 1 : '-'}</div>
                        <div class="unit">${place.distance !== null ? '近' : '未知'}</div>
                    </div>
                    <div class="place-info">
                        <div class="place-name">${place.name}</div>
                        <span class="place-type">${getTypeLabel(place.type)}</span>
                        ${place.address ? `<div class="place-address">${place.address}</div>` : ''}
                        ${place.note ? `<div class="place-address" style="margin-top: 4px;">💬 ${place.note}</div>` : ''}
                        ${place.distance !== null ? `<div class="place-address" style="margin-top: 4px; color: #667eea; font-weight: 600;">📍 ${formatDistance(place.distance)}</div>` : ''}
                    </div>
                    <div class="place-actions">
                        ${place.lat && place.lng ? `<button class="btn-navigate" onclick="navigateTo(${place.lat}, ${place.lng})" title="导航">🧭</button>` : ''}
                        <button class="btn-delete" onclick="deletePlace(${place.id})" title="删除">🗑️</button>
                    </div>
                </li>
            `).join('');
        }

        // 获取类型标签
        function getTypeLabel(type) {
            const labels = {
                restaurant: '🍽️ 餐厅',
                cafe: '☕ 咖啡',
                attraction: '🎯 景点',
                shopping: '️ 购物',
                other: ' 其他'
            };
            return labels[type] || '📌 其他';
        }

        // 更新统计
        function updateStats() {
            document.getElementById('totalPlaces').textContent = places.length;
            
            let nearbyCount = 0;
            let closestDist = null;
            
            if (currentLocation) {
                places.forEach(place => {
                    if (place.lat && place.lng) {
                        const dist = calculateDistance(
                            currentLocation.lat,
                            currentLocation.lng,
                            place.lat,
                            place.lng
                        );
                        if (dist < 5) nearbyCount++;
                        if (closestDist === null || dist < closestDist) {
                            closestDist = dist;
                        }
                    }
                });
            }
            
            document.getElementById('nearbyPlaces').textContent = nearbyCount;
            document.getElementById('closestDistance').textContent = closestDist !== null ? formatDistance(closestDist) : '-';
        }

        // 筛选地点
        function filterPlaces(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            renderPlaces();
        }

        // 打开弹窗
        function openModal() {
            document.getElementById('addModal').classList.add('active');
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('addModal').classList.remove('active');
            document.getElementById('addPlaceForm').reset();
        }

        // 添加地点
        document.getElementById('addPlaceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('placeName').value.trim();
            const type = document.getElementById('placeType').value;
            const address = document.getElementById('placeAddress').value.trim();
            const note = document.getElementById('placeNote').value.trim();
            const coordsStr = document.getElementById('placeCoords').value.trim();
            
            let lat = null;
            let lng = null;
            
            if (coordsStr) {
                const coords = coordsStr.split(',').map(c => parseFloat(c.trim()));
                if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                    lat = coords[0];
                    lng = coords[1];
                }
            } else if (currentLocation) {
                // 如果没有输入坐标，尝试使用地图API获取
                alert('提示：建议手动输入坐标或使用地图定位功能。\n\n你可以：\n1. 在地图上找到该地点\n2. 右键点击获取坐标\n3. 粘贴到"坐标"输入框');
                return;
            }
            
            const place = {
                id: Date.now(),
                name,
                type,
                address,
                note,
                lat,
                lng,
                createdAt: new Date().toISOString()
            };
            
            places.push(place);
            savePlaces();
            renderPlaces();
            updateStats();
            closeModal();
        });

        // 删除地点
        function deletePlace(id) {
            if (confirm('确定要删除这个地点吗？')) {
                places = places.filter(p => p.id !== id);
                savePlaces();
                renderPlaces();
                updateStats();
            }
        }

        // 导航到地点
        function navigateTo(lat, lng) {
            const url = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
            window.open(url, '_blank');
        }

        // 保存数据
        function savePlaces() {
            localStorage.setItem('travelPlaces', JSON.stringify(places));
        }

        // 点击弹窗外部关闭
        document.getElementById('addModal').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) {
                closeModal();
            }
        });
    </script>
</body>
</html>
