<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI API 测试工具</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg-primary: #0a0b10;
    --bg-secondary: #12131a;
    --bg-card: #1a1b26;
    --bg-hover: #24253a;
    --bg-input: #16171f;
    --accent: #7c6aef;
    --accent-light: #a78bfa;
    --accent-glow: rgba(124,106,239,0.15);
    --text-primary: #e4e4ed;
    --text-secondary: #8888a0;
    --text-muted: #55556a;
    --border: #2a2b3d;
    --border-light: #353650;
    --danger: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
    --info: #3b82f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* 背景装饰 */
  body::before {
    content: '';
    position: fixed;
    top: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,106,239,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(59,130,246,0.04) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* 顶部导航 */
  .top-bar {
    background: rgba(18,19,26,0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }

  /* 卡片 */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .card:hover { border-color: var(--border-light); }
  .card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px;
    font-weight: 600; font-size: 15px;
  }
  .card-body { padding: 20px; }

  /* 输入框 */
  .input-field {
    width: 100%;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .input-field:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .input-field::placeholder { color: var(--text-muted); }

  /* 按钮 */
  .btn {
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary {
    background: linear-gradient(135deg, var(--accent), #6347e0);
    color: white;
    box-shadow: 0 4px 16px rgba(124,106,239,0.3);
  }
  .btn-primary:hover:not(:disabled) {
    box-shadow: 0 6px 24px rgba(124,106,239,0.45);
    transform: translateY(-1px);
  }
  .btn-secondary {
    background: var(--bg-hover);
    color: var(--text-primary);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover:not(:disabled) { background: var(--border); }
  .btn-success { background: var(--success); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-sm { padding: 7px 14px; font-size: 13px; border-radius: 8px; }

  /* 状态指示器 */
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-dot.connected { background: var(--success); box-shadow: 0 0 8px rgba(34,197,94,0.5); }
  .status-dot.disconnected { background: var(--danger); }
  .status-dot.testing { background: var(--warning); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* 模型列表 */
  .model-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
    max-height: 360px;
    overflow-y: auto;
    padding: 4px;
  }
  .model-chip {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .model-chip:hover {
    border-color: var(--accent);
    background: var(--bg-hover);
  }
  .model-chip.selected {
    border-color: var(--accent);
    background: var(--accent-glow);
  }
  .model-chip .model-icon {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .model-chip .model-name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .model-chip .model-id {
    font-size: 11px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .model-chip .check-mark {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--accent);
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: white;
  }
  .model-chip.selected .check-mark { display: flex; }

  /* 聊天区域 */
  .chat-container {
    display: flex;
    flex-direction: column;
    height: 520px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .message {
    display: flex;
    gap: 12px;
    animation: msgIn 0.3s ease;
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { flex-direction: row-reverse; }
  .message .avatar {
    width: 36px; height: 36px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }
  .message.user .avatar { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .message.assistant .avatar { background: linear-gradient(135deg, var(--accent), #6347e0); }
  .message .bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.7;
    position: relative;
  }
  .message.user .bubble {
    background: linear-gradient(135deg, #3b82f6, #2563eb);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .message.assistant .bubble {
    background: var(--bg-hover);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .message .meta {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .message .meta .speed-badge {
    background: rgba(124,106,239,0.15);
    color: var(--accent-light);
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 600;
  }
  .message .meta .model-badge {
    background: rgba(59,130,246,0.12);
    color: #60a5fa;
    padding: 2px 8px;
    border-radius: 6px;
    font-weight: 500;
  }

  /* 输入区域 */
  .chat-input-area {
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .chat-input-area textarea {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-primary);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    font-family: inherit;
    line-height: 1.5;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .chat-input-area textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .send-btn {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #6347e0);
    border: none;
    color: white;
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover:not(:disabled) {
    box-shadow: 0 4px 16px rgba(124,106,239,0.4);
    transform: translateY(-1px);
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 加载动画 */
  .typing-indicator {
    display: flex; gap: 4px; padding: 4px 0;
  }
  .typing-indicator span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: typing 1.4s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%,60%,100% { opacity: 0.3; transform: scale(0.8); }
    30% { opacity: 1; transform: scale(1); }
  }

  /* Toast */
  .toast-container {
    position: fixed; top: 20px; right: 20px; z-index: 9999;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    font-size: 14px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    animation: toastIn 0.3s ease;
    display: flex; align-items: center; gap: 10px;
    min-width: 300px;
  }
  .toast.success { border-left: 4px solid var(--success); }
  .toast.error { border-left: 4px solid var(--danger); }
  .toast.info { border-left: 4px solid var(--accent); }
  .toast.warning { border-left: 4px solid var(--warning); }
  @keyframes toastIn {
    from { transform: translateX(100%); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  /* 统计卡片 */
  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
  }
  .stat-item {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    text-align: center;
  }
  .stat-item .val {
    font-size: 24px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent-light), #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .stat-item .lbl {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* 选择模型区域 */
  .selected-models {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .selected-tag {
    background: var(--accent-glow);
    border: 1px solid rgba(124,106,239,0.3);
    color: var(--accent-light);
    padding: 5px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .selected-tag:hover {
    background: rgba(124,106,239,0.25);
  }
  .selected-tag .remove {
    font-size: 14px;
    opacity: 0.6;
    transition: opacity 0.2s;
  }
  .selected-tag .remove:hover { opacity: 1; }

  /* 空状态 */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--text-muted);
    gap: 12px;
  }
  .empty-state .icon { font-size: 48px; opacity: 0.4; }
  .empty-state p { font-size: 14px; }

  /* 响应式 */
  @media (max-width: 768px) {
    .model-grid { grid-template-columns: 1fr; }
    .message .bubble { max-width: 85%; }
    .stat-row { grid-template-columns: repeat(2, 1fr); }
  }

  /* Markdown 渲染 */
  .bubble pre {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
    margin: 8px 0;
    font-size: 13px;
  }
  .bubble code {
    background: rgba(0,0,0,0.2);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .bubble pre code {
    background: none;
    padding: 0;
  }
  .bubble p { margin: 4px 0; }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
</style>
</head>
<body>

<!-- Toast 容器 -->
<div class="toast-container" id="toastContainer"></div>

<!-- 顶部导航 -->
<div class="top-bar">
  <div class="max-w-[1400px] mx-auto px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div style="width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#6347e0);display:flex;align-items:center;justify-content:center;font-size:18px;">🤖</div>
      <div>
        <h1 style="font-size:18px;font-weight:700;">AI API 测试工具</h1>
        <p style="font-size:11px;color:var(--text-muted);">Model Comparison & Benchmark</p>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <span id="connStatus" class="flex items-center gap-2 text-sm" style="color:var(--text-muted);">
        <span class="status-dot disconnected" id="statusDot"></span>
        <span id="statusText">未连接</span>
      </span>
    </div>
  </div>
</div>

<!-- 主内容 -->
<div class="max-w-[1400px] mx-auto px-6 py-6 relative z-10">

  <!-- 第一行：API 配置 + 连通性测试 -->
  <div class="card mb-5">
    <div class="card-header">
      <span>🔑</span> API 配置
    </div>
    <div class="card-body">
      <div class="flex flex-wrap gap-4 items-end">
        <div class="flex-1" style="min-width:300px;">
          <label style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px;">API 地址</label>
          <input type="text" id="apiBase" class="input-field" value="https://ai-service.segway-ninebot.com" placeholder="https://your-api-endpoint.com">
        </div>
        <div class="flex-1" style="min-width:250px;">
          <label style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:6px;">API Key</label>
          <div style="position:relative;">
            <input type="password" id="apiKey" class="input-field" placeholder="sk-xxxx 或你的 API Key" style="padding-right:44px;">
            <button onclick="toggleKeyVisibility()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:16px;padding:4px;" id="eyeBtn">👁️</button>
          </div>
        </div>
        <div class="flex gap-2">
          <button class="btn btn-primary" id="testBtn" onclick="testConnection()">
            <span id="testBtnIcon">📡</span> 测试连通
          </button>
          <button class="btn btn-secondary" onclick="fetchModels()">
            📋 获取模型
          </button>
        </div>
      </div>
      <!-- 测试结果 -->
      <div id="testResult" class="mt-4 hidden" style="border-radius:10px;padding:14px 18px;font-size:13px;"></div>
    </div>
  </div>

  <!-- 第二行：模型列表 + 已选模型 -->
  <div class="card mb-5">
    <div class="card-header">
      <span>🧠</span> 可用模型
      <span id="modelCount" style="margin-left:auto;font-size:12px;color:var(--text-muted);font-weight:400;"></span>
      <button class="btn btn-sm btn-secondary" id="selectAllBtn" onclick="toggleSelectAll()" style="display:none;">✅ 全选</button>
    </div>
    <div class="card-body">
      <div id="modelListContainer">
        <div class="empty-state" style="height:120px;">
          <p>👆 点击「获取模型」或「测试连通」加载可用模型列表</p>
        </div>
      </div>
      <div id="selectedModelsArea" class="hidden">
        <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-top:16px;margin-bottom:4px;">
          已选模型（对话时将同时发送给所有已选模型）
        </div>
        <div class="selected-models" id="selectedModelsTags"></div>
      </div>
    </div>
  </div>

  <!-- 第三行：对话区域 -->
  <div class="flex gap-5 flex-wrap">
    <!-- 左侧：对话 -->
    <div class="card flex-1" style="min-width:400px;">
      <div class="card-header">
        <span>💬</span> 对话测试
        <span id="chatModelHint" style="margin-left:4px;font-size:12px;color:var(--text-muted);font-weight:400;"></span>
        <button class="btn btn-sm btn-secondary" style="margin-left:auto;" onclick="clearChat()">🗑️ 清空</button>
      </div>
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <div class="empty-state">
            <div class="icon">💬</div>
            <p>选择模型后输入消息开始测试</p>
          </div>
        </div>
        <div class="chat-input-area">
          <textarea id="chatInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1" onkeydown="handleInputKey(event)"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>➤</button>
        </div>
      </div>
    </div>

    <!-- 右侧：统计 -->
    <div class="card" style="width:320px;min-width:280px;">
      <div class="card-header">
        <span>📊</span> 性能统计
      </div>
      <div class="card-body">
        <div class="stat-row" id="statsGrid">
          <div class="stat-item">
            <div class="val" id="statTotal">0</div>
            <div class="lbl">总请求</div>
          </div>
          <div class="stat-item">
            <div class="val" id="statAvgSpeed">-</div>
            <div class="lbl">平均耗时</div>
          </div>
          <div class="stat-item">
            <div class="val" id="statFastest">-</div>
            <div class="lbl">最快响应</div>
          </div>
          <div class="stat-item">
            <div class="val" id="statSlowest">-</div>
            <div class="lbl">最慢响应</div>
          </div>
        </div>
        <!-- 每个模型的统计 -->
        <div style="margin-top:20px;">
          <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;">各模型耗时</div>
          <div id="modelStats" class="flex flex-col gap-3">
            <div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px 0;">暂无数据</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
// ==================== 全局状态 ====================
const state = {
  models: [],
  selectedModels: new Set(),
  chatHistory: [],
  requestLog: [],
  isConnected: false,
  isSending: false,
};

// ==================== 初始化 ====================
document.addEventListener('DOMContentLoaded', () => {
  // 恢复保存的 API Key
  const savedKey = localStorage.getItem('ai_test_api_key');
  const savedBase = localStorage.getItem('ai_test_api_base');
  if (savedKey) document.getElementById('apiKey').value = savedKey;
  if (savedBase) document.getElementById('apiBase').value = savedBase;

  // 自动调整 textarea 高度
  const textarea = document.getElementById('chatInput');
  textarea.addEventListener('input', () => {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    updateSendBtnState();
  });
});

// ==================== 【修复】发送按钮状态：只检查是否有文本，不再强制要求已选模型 ====================
function updateSendBtnState() {
  const hasText = document.getElementById('chatInput').value.trim().length > 0;
  document.getElementById('sendBtn').disabled = !hasText || state.isSending;
}

// ==================== 工具函数 ====================
function getApiBase() {
  return document.getElementById('apiBase').value.replace(/\/+$/, '');
}
function getApiKey() {
  return document.getElementById('apiKey').value.trim();
}
function getHeaders() {
  const key = getApiKey();
  const h = { 'Content-Type': 'application/json' };
  if (key) h['Authorization'] = `Bearer ${key}`;
  return h;
}

function toggleKeyVisibility() {
  const input = document.getElementById('apiKey');
  const btn = document.getElementById('eyeBtn');
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🙈';
  } else {
    input.type = 'password';
    btn.textContent = '👁️';
  }
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
  toast.innerHTML = `<span>${icons[type] || ''}</span><span>${msg}</span>`;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(100%)';
    toast.style.transition = 'all 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 4000);
}

function formatTime(ms) {
  if (ms < 1000) return ms + 'ms';
  return (ms / 1000).toFixed(2) + 's';
}

// 简易 Markdown 渲染
function renderMarkdown(text) {
  if (!text) return '';
  let html = text
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/\n/g, '<br>');
  return html;
}

// ==================== 连通性测试 ====================
async function testConnection() {
  const btn = document.getElementById('testBtn');
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const result = document.getElementById('testResult');

  btn.disabled = true;
  btn.innerHTML = '<span class="status-dot testing" style="width:12px;height:12px;"></span> 测试中...';
  dot.className = 'status-dot testing';
  text.textContent = '测试中...';

  const startTime = performance.now();

  try {
    const resp = await fetch(`${getApiBase()}/v1/models`, {
      method: 'GET',
      headers: getHeaders(),
    });
    const elapsed = Math.round(performance.now() - startTime);

    if (resp.ok) {
      const data = await resp.json();
      const modelCount = data.data ? data.data.length : 0;
      state.isConnected = true;
      dot.className = 'status-dot connected';
      text.textContent = `已连接 (${elapsed}ms)`;
      result.style.display = 'block';
      result.style.background = 'rgba(34,197,94,0.08)';
      result.style.border = '1px solid rgba(34,197,94,0.2)';
      result.style.color = '#4ade80';
      result.innerHTML = `✅ <strong>连接成功</strong> — 延迟 ${elapsed}ms，发现 ${modelCount} 个模型`;
      result.classList.remove('hidden');
      showToast(`连接成功！延迟 ${elapsed}ms`, 'success');

      localStorage.setItem('ai_test_api_key', getApiKey());
      localStorage.setItem('ai_test_api_base', getApiBase());

      // 【修复】自动加载模型并全选
      if (data.data) {
        state.models = data.data;
        autoSelectAllModels();
        renderModels();
        updateSendBtnState();
      }
    } else {
      throw new Error(`HTTP ${resp.status}: ${resp.statusText}`);
    }
  } catch (e) {
    state.isConnected = false;
    dot.className = 'status-dot disconnected';
    text.textContent = '连接失败';
    result.style.display = 'block';
    result.style.background = 'rgba(239,68,68,0.08)';
    result.style.border = '1px solid rgba(239,68,68,0.2)';
    result.style.color = '#f87171';
    result.innerHTML = `❌ <strong>连接失败</strong> — ${e.message}`;
    result.classList.remove('hidden');
    showToast(`连接失败: ${e.message}`, 'error');
  }

  btn.disabled = false;
  btn.innerHTML = '<span id="testBtnIcon">📡</span> 测试连通';
}

// ==================== 获取模型列表 ====================
async function fetchModels() {
  if (!getApiKey()) {
    showToast('请先输入 API Key', 'error');
    return;
  }

  const container = document.getElementById('modelListContainer');
  container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;padding:40px;gap:10px;color:var(--text-muted);"><div class="loader" style="width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;"></div> 正在获取模型列表...</div>';

  try {
    const resp = await fetch(`${getApiBase()}/v1/models`, {
      method: 'GET',
      headers: getHeaders(),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();
    state.models = data.data || [];

    localStorage.setItem('ai_test_api_key', getApiKey());
    localStorage.setItem('ai_test_api_base', getApiBase());

    // 【修复】获取模型后自动全选
    autoSelectAllModels();
    renderModels();
    updateSendBtnState();
    showToast(`获取到 ${state.models.length} 个模型，已自动全选`, 'success');
  } catch (e) {
    container.innerHTML = `<div style="padding:20px;text-align:center;color:var(--danger);">❌ 获取失败: ${e.message}</div>`;
    showToast(`获取模型失败: ${e.message}`, 'error');
  }
}

// ==================== 【修复】新增：自动全选所有模型 ====================
function autoSelectAllModels() {
  state.selectedModels.clear();
  state.models.forEach(m => {
    const id = m.id || 'unknown';
    state.selectedModels.add(id);
  });
}

// ==================== 【修复】新增：全选/取消全选切换 ====================
function toggleSelectAll() {
  if (state.selectedModels.size === state.models.length) {
    // 当前是全选状态 → 取消全选
    state.selectedModels.clear();
    showToast('已取消全选', 'info');
  } else {
    // 当前不是全选 → 全选
    autoSelectAllModels();
    showToast('已全选所有模型', 'success');
  }
  renderModels();
  renderSelectedTags();
  updateSendBtnState();
}

// ==================== 渲染模型列表 ====================
function renderModels() {
  const container = document.getElementById('modelListContainer');
  const countEl = document.getElementById('modelCount');
  const selectAllBtn = document.getElementById('selectAllBtn');

  if (state.models.length === 0) {
    container.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">暂无模型</div>';
    countEl.textContent = '';
    selectAllBtn.style.display = 'none';
    return;
  }

  countEl.textContent = `共 ${state.models.length} 个 · 已选 ${state.selectedModels.size} 个`;
  selectAllBtn.style.display = '';
  // 更新全选按钮文字
  if (state.selectedModels.size === state.models.length) {
    selectAllBtn.textContent = '☑️ 取消全选';
  } else {
    selectAllBtn.textContent = '✅ 全选';
  }

  const sorted = [...state.models].sort((a, b) => (a.id || '').localeCompare(b.id || ''));

  let html = '<div class="model-grid">';
  sorted.forEach(m => {
    const id = m.id || 'unknown';
    const isSelected = state.selectedModels.has(id);
    const icon = getModelIcon(id);
    html += `
      <div class="model-chip ${isSelected ? 'selected' : ''}" onclick="toggleModel('${id.replace(/'/g, "\\'")}')" title="${id}">
        <div class="model-icon">${icon}</div>
        <div style="overflow:hidden;flex:1;">
          <div class="model-name">${id}</div>
          <div class="model-id">${m.owned_by || m.object || 'model'}</div>
        </div>
        <div class="check-mark">✓</div>
      </div>
    `;
  });
  html += '</div>';
  container.innerHTML = html;

  // 更新对话区模型提示
  updateChatModelHint();
}

function getModelIcon(id) {
  const lower = id.toLowerCase();
  if (lower.includes('gpt') || lower.includes('openai')) return '🧠';
  if (lower.includes('claude')) return '🎭';
  if (lower.includes('gemini') || lower.includes('google')) return '💎';
  if (lower.includes('llama') || lower.includes('meta')) return '🦙';
  if (lower.includes('qwen') || lower.includes('通义')) return '🔮';
  if (lower.includes('deepseek')) return '🔍';
  if (lower.includes('glm') || lower.includes('chatglm')) return '📚';
  if (lower.includes('mistral') || lower.includes('mixtral')) return '🌊';
  if (lower.includes('yi') || lower.includes('零一')) return '🌟';
  if (lower.includes('baichuan')) return '🐟';
  if (lower.includes('dall') || lower.includes('image')) return '🎨';
  if (lower.includes('whisper') || lower.includes('audio')) return '🎤';
  if (lower.includes('embed')) return '📐';
  return '🤖';
}

// ==================== 选择/取消模型 ====================
function toggleModel(id) {
  if (state.selectedModels.has(id)) {
    state.selectedModels.delete(id);
  } else {
    state.selectedModels.add(id);
  }
  renderModels();
  renderSelectedTags();
  updateSendBtnState();
}

function renderSelectedTags() {
  const area = document.getElementById('selectedModelsArea');
  const tags = document.getElementById('selectedModelsTags');

  if (state.selectedModels.size === 0) {
    area.classList.add('hidden');
    return;
  }

  area.classList.remove('hidden');
  let html = '';
  state.selectedModels.forEach(id => {
    html += `<span class="selected-tag" onclick="toggleModel('${id.replace(/'/g, "\\'")}')">${id} <span class="remove">✕</span></span>`;
  });
  tags.innerHTML = html;

  updateChatModelHint();
}

// ==================== 【修复】新增：更新对话区模型提示 ====================
function updateChatModelHint() {
  const hint = document.getElementById('chatModelHint');
  if (state.selectedModels.size === 0) {
    hint.textContent = '— 未选择模型';
    hint.style.color = 'var(--warning)';
  } else {
    hint.textContent = `— ${state.selectedModels.size} 个模型已选中`;
    hint.style.color = 'var(--text-muted)';
  }
}

// ==================== 【修复】发送消息：没有选模型时给出明确提示 ====================
async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  // 【修复】没有选择模型时，给出明确提示而不是静默失败
  if (state.selectedModels.size === 0) {
    showToast('⚠️ 请先在上方选择至少一个模型', 'warning');
    return;
  }

  if (state.isSending) return;

  state.isSending = true;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;

  // 清空初始提示
  const messages = document.getElementById('chatMessages');
  if (messages.querySelector('.empty-state')) {
    messages.innerHTML = '';
  }

  // 添加用户消息
  addUserMessage(text);
  state.chatHistory.push({ role: 'user', content: text });

  // 为每个选中模型发送请求
  const models = [...state.selectedModels];
  const promises = models.map(model => sendToModel(model, text));

  await Promise.allSettled(promises);

  state.isSending = false;
  updateSendBtnState();
  updateStats();
}

function addUserMessage(text) {
  const messages = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message user';
  div.innerHTML = `
    <div class="avatar">👤</div>
    <div class="bubble">${escapeHtml(text)}</div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addAssistantMessage(model, text, elapsed) {
  const messages = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.innerHTML = `
    <div class="avatar">${getModelIcon(model)}</div>
    <div>
      <div class="bubble">${renderMarkdown(text)}</div>
      <div class="meta">
        <span class="model-badge">${model}</span>
        <span class="speed-badge">⚡ ${formatTime(elapsed)}</span>
        <span>${new Date().toLocaleTimeString()}</span>
      </div>
    </div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function addLoadingMessage(model) {
  const messages = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = `loading-${model.replace(/[^a-zA-Z0-9]/g, '_')}`;
  div.innerHTML = `
    <div class="avatar">${getModelIcon(model)}</div>
    <div>
      <div class="bubble">
        <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;">${model}</div>
        <div class="typing-indicator"><span></span><span></span><span></span></div>
      </div>
    </div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function removeLoadingMessage(model) {
  const id = `loading-${model.replace(/[^a-zA-Z0-9]/g, '_')}`;
  const el = document.getElementById(id);
  if (el) el.remove();
}

function addErrorMessage(model, error) {
  const messages = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.innerHTML = `
    <div class="avatar">${getModelIcon(model)}</div>
    <div>
      <div class="bubble" style="border-color:rgba(239,68,68,0.3);">
        <div style="color:var(--danger);font-size:13px;">❌ ${model}: ${escapeHtml(error)}</div>
      </div>
    </div>
  `;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

async function sendToModel(model, userText) {
  addLoadingMessage(model);
  const startTime = performance.now();

  try {
    const msgs = [];
    const history = state.chatHistory.slice(-10);
    for (const h of history) {
      msgs.push({ role: h.role, content: h.content });
    }

    const resp = await fetch(`${getApiBase()}/v1/chat/completions`, {
      method: 'POST',
      headers: getHeaders(),
      body: JSON.stringify({
        model: model,
        messages: msgs,
        temperature: 0.7,
        max_tokens: 2048,
      }),
    });

    const elapsed = Math.round(performance.now() - startTime);

    if (!resp.ok) {
      const errData = await resp.json().catch(() => ({}));
      throw new Error(errData.error?.message || `HTTP ${resp.status}`);
    }

    const data = await resp.json();
    const content = data.choices?.[0]?.message?.content || '(空回复)';
    const usage = data.usage;

    removeLoadingMessage(model);
    addAssistantMessage(model, content, elapsed);

    state.chatHistory.push({ role: 'assistant', content, model });

    state.requestLog.push({
      model,
      elapsed,
      tokens: usage?.total_tokens || 0,
      promptTokens: usage?.prompt_tokens || 0,
      completionTokens: usage?.completion_tokens || 0,
      timestamp: Date.now(),
    });

  } catch (e) {
    const elapsed = Math.round(performance.now() - startTime);
    removeLoadingMessage(model);
    addErrorMessage(model, e.message);
    state.requestLog.push({
      model,
      elapsed,
      error: true,
      timestamp: Date.now(),
    });
  }
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ==================== 输入框快捷键 ====================
function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ==================== 清空对话 ====================
function clearChat() {
  state.chatHistory = [];
  state.requestLog = [];
  const messages = document.getElementById('chatMessages');
  messages.innerHTML = `
    <div class="empty-state">
      <div class="icon">💬</div>
      <p>选择模型后输入消息开始测试</p>
    </div>
  `;
  updateStats();
}

// ==================== 统计更新 ====================
function updateStats() {
  const logs = state.requestLog.filter(l => !l.error);
  const total = state.requestLog.length;

  document.getElementById('statTotal').textContent = total;

  if (logs.length === 0) {
    document.getElementById('statAvgSpeed').textContent = '-';
    document.getElementById('statFastest').textContent = '-';
    document.getElementById('statSlowest').textContent = '-';
    document.getElementById('modelStats').innerHTML = '<div style="color:var(--text-muted);font-size:13px;text-align:center;padding:20px 0;">暂无数据</div>';
    return;
  }

  const times = logs.map(l => l.elapsed);
  const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
  const fastest = Math.min(...times);
  const slowest = Math.max(...times);

  document.getElementById('statAvgSpeed').textContent = formatTime(avg);
  document.getElementById('statFastest').textContent = formatTime(fastest);
  document.getElementById('statSlowest').textContent = formatTime(slowest);

  const modelMap = new Map();
  logs.forEach(l => {
    if (!modelMap.has(l.model)) modelMap.set(l.model, []);
    modelMap.get(l.model).push(l.elapsed);
  });

  let html = '';
  const sorted = [...modelMap.entries()].sort((a, b) => {
    const avgA = a[1].reduce((x, y) => x + y, 0) / a[1].length;
    const avgB = b[1].reduce((x, y) => x + y, 0) / b[1].length;
    return avgA - avgB;
  });

  sorted.forEach(([model, times]) => {
    const avg = Math.round(times.reduce((a, b) => a + b, 0) / times.length);
    const min = Math.min(...times);
    const max = Math.max(...times);
    const count = times.length;
    const barWidth = Math.max(10, Math.min(100, (1 - (avg - fastest) / (slowest - fastest || 1)) * 100));
    html += `
      <div style="background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:12px 14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px;" title="${model}">${getModelIcon(model)} ${model}</span>
          <span style="font-size:13px;font-weight:700;color:var(--accent-light);">${formatTime(avg)}</span>
        </div>
        <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;">
          <div style="height:100%;width:${barWidth}%;background:linear-gradient(90deg,var(--accent),var(--accent-light));border-radius:2px;transition:width 0.5s;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--text-muted);">
          <span>最快 ${formatTime(min)}</span>
          <span>${count} 次</span>
          <span>最慢 ${formatTime(max)}</span>
        </div>
      </div>
    `;
  });

  document.getElementById('modelStats').innerHTML = html;
}
