<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>城市漫游行程助手 v2.0.9</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #plannerFrame { width: 100%; height: 100%; margin: 0; border: 0; overflow: hidden; }
    .version-badge { position: fixed; top: 6px; left: 8px; z-index: 9999; pointer-events: none; padding: 3px 8px; border-radius: 10px; background: rgba(0,0,0,.62); color: #fff; font: 11px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  </style>
</head>
<body>
  <div class="version-badge">城市漫游行程助手 · v2.0.9</div>
  <iframe id="plannerFrame" src="travel-planner-v2.0.8.html" title="城市漫游行程助手 v2.0.9"></iframe>
  <script>
  (() => {
    const frame = document.getElementById('plannerFrame');

    function installV209Patch(baseDocument) {
      if (!baseDocument || baseDocument.getElementById('travelPlannerV209Patch')) return;
      const style = baseDocument.createElement('style');
      style.id = 'travelPlannerV209Style';
      style.textContent = '.transit-detail > .transit-step { margin-top: 10px; padding-top: 10px; } .transit-detail > .transit-step:first-of-type { margin-top: 0; padding-top: 6px; }';
      baseDocument.head.appendChild(style);

      const script = baseDocument.createElement('script');
      script.id = 'travelPlannerV209Patch';
      script.textContent = String.raw`
(() => {
  if (window.__travelPlannerV209Installed) return;
  window.__travelPlannerV209Installed = true;

  function normalizePoiName(value) {
    const original = value == null ? '' : String(value).trim();
    if (!original) return original;
    let name = original;

    /* 地址型 POI：门牌号之后才是实际场所名称，避免显示为“71号悦茂购物中心”。 */
    if (name.length > 12 && /\d+(?:号院|号|弄|栋|座)/.test(name)) {
      name = name.replace(/^.*?\d+(?:号院|号|弄|栋|座)/, '').trim();
    }
    if (name.length > 20) {
      name = name.replace(/^(?:中国)?(?:北京市|天津市|上海市|重庆市|[\u4e00-\u9fa5]{2,}(?:省|自治区))?[\u4e00-\u9fa5]{0,12}(?:区|县|市)(?:[\u4e00-\u9fa5]{0,12}(?:乡|镇|街道|村|路|街))?/, '');
      const bracketIndex = name.search(/[（(]/);
      if (bracketIndex > 0) name = name.slice(0, bracketIndex).trim();
    }
    return name || original;
  }

  const originalShowPoiDetail = window.showPoiDetail;
  window.showPoiDetail = function(poi) {
    if (!poi) return originalShowPoiDetail.call(this, poi);
    return originalShowPoiDetail.call(this, { ...poi, name: normalizePoiName(poi.name) });
  };

  const originalAutoDetectCategory = window.autoDetectCategory;
  window.autoDetectCategory = function(address, poi) {
    const normalizedPoi = poi && poi.name ? { ...poi, name: normalizePoiName(poi.name) } : poi;
    const result = originalAutoDetectCategory.call(this, address, normalizedPoi);
    if (normalizedPoi && normalizedPoi.name) document.getElementById('fName').value = normalizedPoi.name;
    return result;
  };

  const driveSortButton = document.querySelector('.sort-btn[data-sort="driveTime"]');
  if (driveSortButton) driveSortButton.textContent = '🚗 驾车';

  const originalDoMapSearch = window.doMapSearch;
  const originalDoAutoComplete = window.doAutoComplete;
  function searchAroundCurrentLocation(keyword, showLoadingState) {
    if (!myPosition) return false;
    if (showLoadingState) showLoading('正在以当前位置为圆心搜索 100km 内地点...');
    geocoder.getAddress([myPosition.lng, myPosition.lat], (geoStatus, geoResult) => {
      const component = geoStatus === 'complete' && geoResult.regeocode && geoResult.regeocode.addressComponent;
      const city = component && (Array.isArray(component.city) ? component.city[0] : component.city) || component && component.province || currentCity;
      if (city) currentCity = city;
      const nearby = new AMap.PlaceSearch({ pageSize: 20, city: currentCity, citylimit: false });
      nearby.searchNearBy(keyword, new AMap.LngLat(myPosition.lng, myPosition.lat), 100000, (status, result) => {
        if (showLoadingState) hideLoading();
        const pois = status === 'complete' && result.poiList && result.poiList.pois || [];
        if (pois.length) renderSearchResults(pois);
        else if (showLoadingState) showToast('当前位置 100km 内未找到相关地点');
      });
    });
    return true;
  }

  window.doMapSearch = function() {
    const keyword = document.getElementById('mapSearchInput').value.trim();
    if (keyword && !searchAroundCurrentLocation(keyword, true)) return originalDoMapSearch.call(this);
  };
  window.doAutoComplete = function(keyword) {
    if (!searchAroundCurrentLocation(keyword, false)) return originalDoAutoComplete.call(this, keyword);
  };
})();`;
      baseDocument.body.appendChild(script);
    }

    function attachToBase() {
      const v208Document = frame.contentDocument;
      const v207Frame = v208Document && v208Document.getElementById('plannerFrame');
      if (!v207Frame) return;
      const attachToV207 = () => {
        const v207Document = v207Frame.contentDocument;
        const baseFrame = v207Document && v207Document.getElementById('plannerFrame');
        if (!baseFrame) return;
        const apply = () => installV209Patch(baseFrame.contentDocument);
        baseFrame.addEventListener('load', apply);
        apply();
      };
      v207Frame.addEventListener('load', attachToV207);
      attachToV207();
    }

    frame.addEventListener('load', attachToBase);
  })();
  </script>
</body>
</html>
