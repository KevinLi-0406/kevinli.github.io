<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝可梦全国图鉴</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;color:#222;background:#eee3b2;background-image:linear-gradient(45deg,#e0d29e 25%,transparent 25%),linear-gradient(-45deg,#e0d29e 25%,transparent 25%);background-size:32px 32px}header{padding:25px 15px;text-align:center;color:#fff;background:#df3030;border-bottom:8px solid #821414;box-shadow:0 5px #222}h1{margin:0 0 12px;font:clamp(28px,5vw,44px) Georgia,serif;text-shadow:3px 3px #751010}button,input,select{min-height:43px;padding:9px 12px;font-weight:bold;border:4px solid #222;box-shadow:4px 4px #222}button{cursor:pointer}.language-switch,.types,.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:12px}.active{color:#fff;background:#222}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:13px;max-width:1300px;margin:25px auto 15px;padding:0 18px}.status{max-width:1300px;margin:20px auto 12px;padding:0 18px;font-weight:bold}.progress{height:17px;margin-top:9px;background:#fff;border:3px solid #222}.progress i{display:block;height:100%;background:#51a84d}.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;max-width:1300px;margin:22px auto;padding:0 18px 45px}.card,.modal-box{background:#fff6c9;border:4px solid #222;box-shadow:6px 6px #222}.card{padding:12px;text-align:center;cursor:pointer}.card:hover{transform:translate(-3px,-3px);box-shadow:9px 9px #222}.card img{width:125px;height:125px;object-fit:contain;image-rendering:pixelated}.number{color:#821414;font-family:monospace;font-weight:bold}.name{margin-top:8px;font-size:18px;font-weight:bold}.type,.tag{padding:4px 7px;color:#fff;font-size:11px;font-weight:bold;background:#777;border:2px solid #222}.tag{color:#222;background:#fff}.fire{background:#e25822}.water{background:#398bd1}.electric,.ice,.ground,.flying,.steel,.fairy{color:#222;background:#f5c542}.grass{background:#55a630}.fighting{background:#a52a2a}.poison{background:#963db3}.psychic{background:#e85d75}.bug{background:#729c27}.rock{background:#8a7352}.ghost{background:#604080}.dragon{background:#5b3fa3}.dark{background:#3a3a3a}.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#000b}.modal.show{display:flex}.modal-box{position:relative;width:min(800px,100%);max-height:92vh;overflow:auto;padding:24px}.close{position:absolute;top:10px;right:12px;color:#fff;font-size:24px;background:#df3030}.detail-head{display:flex;align-items:center;gap:20px;padding-right:42px}.detail-head>img{width:180px;height:180px;object-fit:contain;image-rendering:pixelated}.section{margin:23px 0 12px;padding:9px 12px;color:#fff;font-weight:bold;background:#df3030;border:3px solid #222}.evolution{display:flex;flex-direction:column;align-items:center;gap:8px;margin:15px 0}.evo{width:170px;padding:9px;text-align:center;background:#fff;border:3px solid #222;box-shadow:3px 3px #222}.evo img{width:105px;height:105px;object-fit:contain}.arrow{text-align:center;color:#821414;font-weight:bold}.arrow b{display:block;font-size:25px}.arrow small{display:inline-block;padding:4px 8px;color:#222;background:#ffd447;border:2px solid #222}.loading{grid-column:1/-1;padding:55px 20px;text-align:center;font-weight:bold}@media(max-width:650px){.filters{grid-template-columns:1fr}.dex-grid{grid-template-columns:repeat(2,1fr);gap:13px}.detail-head{display:block;text-align:center}}
</style></head><body>
<header><h1 id="title">宝可梦全国图鉴</h1><p id="subtitle">关都 · 城都 · 丰缘 全国图鉴</p><div class="language-switch"><button id="zh" class="active">中文</button><button id="en">English</button></div></header><section class="filters"><input id="search" type="search" placeholder="搜索中文名称、英文名称或图鉴编号"><select id="gen"><option value="all">全部世代</option><option value="1">第一世代</option><option value="2">第二世代</option><option value="3">第三世代</option></select><select id="type"><option value="all">全部属性</option></select></section><div class="status"><span id="status">正在加载资料 0 / 386</span><div class="progress"><i id="bar"></i></div></div><main id="grid" class="dex-grid"><div class="loading">正在加载资料……</div></main><div id="modal" class="modal"><div class="modal-box"><button id="close" class="close">×</button><div id="detail"></div></div></div>
<script>
const API='https://pokeapi.co/api/v2',TOTAL=386,SPRITE='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/', $=s=>document.querySelector(s),pad=n=>String(n).padStart(3,'0'),id=u=>+u.split('/').filter(Boolean).pop(),sprite=n=>SPRITE+n+'.png';let lang='zh',dex=[],chains=new Map(),labels=new Map();
const L={zh:{title:'宝可梦全国图鉴',sub:'关都 · 城都 · 丰缘 全国图鉴',load:'正在加载资料',done:'加载完成，共',pokemon:'只宝可梦',no:'没有找到符合条件的宝可梦。',detail:'正在读取详细资料',desc:'图鉴描述',evo:'进化链',ability:'特性',moves:'技能（可通过升级习得）',number:'全国编号',type:'属性',level:'等级',friend:'亲密度',up:'升级',day:'白天升级',night:'夜晚升级',trade:'交换',item:'使用进化道具',special:'特殊条件',none:'暂无进化资料。',all:'全部属性',types:{normal:'一般',fire:'火',water:'水',electric:'电',grass:'草',ice:'冰',fighting:'格斗',poison:'毒',ground:'地面',flying:'飞行',psychic:'超能力',bug:'虫',rock:'岩石',ghost:'幽灵',dragon:'龙',dark:'恶',steel:'钢',fairy:'妖精'}},en:{title:'386 Pokémon National Pokédex',sub:'Kanto · Johto · Hoenn National Pokédex',load:'Loading data',done:'Loading complete:',pokemon:'Pokémon',no:'No Pokémon match the current filters.',detail:'Loading details',desc:'Pokédex Description',evo:'Evolution Chain',ability:'Abilities',moves:'Moves learned by level up',number:'National Number',type:'Type',level:'Level',friend:'Friendship',up:'Level up',day:'Level up during the day',night:'Level up at night',trade:'Trade',item:'Use evolution item',special:'Special condition',none:'No evolution data.',all:'All Types',types:{normal:'Normal',fire:'Fire',water:'Water',electric:'Electric',grass:'Grass',ice:'Ice',fighting:'Fighting',poison:'Poison',ground:'Ground',flying:'Flying',psychic:'Psychic',bug:'Bug',rock:'Rock',ghost:'Ghost',dragon:'Dragon',dark:'Dark',steel:'Steel',fairy:'Fairy'}}};const t=()=>L[lang];
function names(a,f){let n=c=>a?.find(x=>c.includes(x.language?.name))?.name;return{zh:n(['zh-Hans','zh-Hant','zh']),en:n(['en'])||f}}function name(x){return lang==='zh'?(x.zh||x.en):(x.en||x.zh)}function gen(n){return n<=151?1:n<=251?2:3}function types(a){return a.map(x=>{let n=x.type?x.type.name:x;return`<span class="type ${n}">${t().types[n]||n}</span>`}).join('')}
async function load(){for(let s=1;s<=TOTAL;s+=10){let jobs=[];for(let n=s;n<Math.min(s+10,TOTAL+1);n++)jobs.push(Promise.all([fetch(`${API}/pokemon/${n}`).then(r=>r.json()),fetch(`${API}/pokemon-species/${n}`).then(r=>r.json())]).then(([p,sp])=>({id:n,p,s:sp,names:names(sp.names,sp.name),generation:gen(n),types:p.types.map(x=>x.type.name)})).catch(()=>null));(await Promise.all(jobs)).forEach(x=>x&&dex.push(x));let d=Math.min(s+9,TOTAL);$('#bar').style.width=d/TOTAL*100+'%';$('#status').textContent=`${t().load} ${d} / ${TOTAL}`;updateTypes();render()}$('#status').textContent=`${t().done} ${dex.length} ${t().pokemon}`}
function updateTypes(){let old=$('#type').value,a=[...new Set(dex.flatMap(x=>x.types))].sort();$('#type').innerHTML=`<option value="all">${t().all}</option>`+a.map(x=>`<option value="${x}">${t().types[x]}</option>`).join('');$('#type').value=a.includes(old)?old:'all'}function render(){let q=$('#search').value.trim().toLowerCase(),g=$('#gen').value,ty=$('#type').value,r=dex.filter(x=>(!q||`${x.names.zh||''} ${x.names.en||''} ${x.id}`.toLowerCase().includes(q))&&(g==='all'||x.generation==g)&&(ty==='all'||x.types.includes(ty)));$('#grid').innerHTML=r.length?r.map(x=>`<article class="card" data-id="${x.id}"><div class="number">No. ${pad(x.id)}</div><img src="${sprite(x.id)}" alt="${name(x.names)}"><div class="name">${name(x.names)}</div><div class="types">${types(x.types)}</div></article>`).join(''):`<div class="loading">${t().no}</div>`;document.querySelectorAll('.card').forEach(x=>x.onclick=()=>open(+x.dataset.id))}
function condition(d){d=d?.[0];if(!d)return t().up;if(d.trigger?.name==='level-up'){let a=[];if(d.min_level)a.push(`${t().level} ${d.min_level}`);if(d.min_happiness)a.push(`${t().friend} ${d.min_happiness}`);if(d.time_of_day==='day')a.push(t().day);if(d.time_of_day==='night')a.push(t().night);return a.join(' · ')||t().up}if(d.trigger?.name==='trade')return t().trade;if(d.trigger?.name==='use-item')return d.item?.name?.replaceAll('-',' ')||t().item;return t().special}async function evolution(p){if(chains.has(p.id))return chains.get(p.id);let d=await fetch(p.s.evolution_chain.url).then(r=>r.json()),paths=[];function walk(n,path=[],incoming=''){let cur=[...path,{id:id(n.species.url),condition:incoming}];n.evolves_to?.length?n.evolves_to.forEach(x=>walk(x,cur,condition(x.evolution_details))):paths.push(cur)}walk(d.chain);chains.set(p.id,paths);return paths}function renderEvolution(paths){return paths.length?paths.map(path=>`<div class="evolution">${path.map((s,i)=>{let p=dex.find(x=>x.id===s.id);return`${i?`<div class="arrow"><b>↓</b><small>${s.condition}</small></div>`:''}<div class="evo"><img src="${sprite(p.id)}"><div>No. ${pad(p.id)}</div><strong>${name(p.names)}</strong></div>`}).join('')}</div>`).join(''):`<p>${t().none}</p>`}
async function localName(url,fallback){let key=`${lang}:${url}`;if(labels.has(key))return labels.get(key);try{let d=await fetch(url).then(r=>r.json()),v=names(d.names,fallback);let out=name(v);labels.set(key,out);return out}catch{return fallback.replaceAll('-',' ')}}async function info(p){let abilities=await Promise.all(p.p.abilities.map(async a=>`${await localName(a.ability.url,a.ability.name)}${a.is_hidden?(lang==='zh'?'（隐藏特性）':' (Hidden)'):''}`));let learned=p.p.moves.map(m=>{let v=m.version_group_details.filter(x=>x.move_learn_method.name==='level-up'&&x.version_group.name==='emerald').sort((a,b)=>a.level_learned_at-b.level_learned_at)[0];return v&&{...m,level:v.level_learned_at}}).filter(Boolean).sort((a,b)=>a.level-b.level).slice(0,24);let moves=await Promise.all(learned.map(async m=>`${t().level} ${m.level} · ${await localName(m.move.url,m.move.name)}`));return{abilities,moves}}
async function open(n){let p=dex.find(x=>x.id===n);$('#modal').classList.add('show');$('#detail').innerHTML=`<div class="loading">${t().detail}</div>`;try{let [paths,extra]=await Promise.all([evolution(p),info(p)]),f=p.s.flavor_text_entries.find(x=>x.language.name===(lang==='zh'?'zh-Hans':'en'))?.flavor_text?.replace(/\f/g,' ')||'';$('#detail').innerHTML=`<div class="detail-head"><img src="${sprite(n)}"><div><h2>${name(p.names)}</h2><p><b>${t().number}：</b>No. ${pad(n)}</p><p><b>${t().type}：</b></p><div class="types">${types(p.types)}</div></div></div><div class="section">${t().desc}</div><p>${f}</p><div class="section">${t().ability}</div><div class="tags">${extra.abilities.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="section">${t().moves}</div><div class="tags">${extra.moves.map(x=>`<span class="tag">${x}</span>`).join('')||'<span class="tag">—</span>'}</div><div class="section">${t().evo}</div>${renderEvolution(paths)}`}catch{$('#detail').innerHTML='<div class="loading">Failed to load data.</div>'}}
function apply(){document.documentElement.lang=lang==='zh'?'zh-CN':'en';$('#title').textContent=t().title;$('#subtitle').textContent=t().sub;$('#search').placeholder=lang==='zh'?'搜索中文名称、英文名称或图鉴编号':'Search name or Pokédex number';$('#zh').classList.toggle('active',lang==='zh');$('#en').classList.toggle('active',lang==='en');updateTypes();render()}['search','gen','type'].forEach(x=>$('#'+x).addEventListener(x==='search'?'input':'change',render));$('#zh').onclick=()=>{lang='zh';apply()};$('#en').onclick=()=>{lang='en';apply()};$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>e.target===$('#modal')&&$('#modal').classList.remove('show');load();
</script></body></html>
