<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>宝可梦全国图鉴</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;color:#222;background:#eee3b2}header{padding:25px 15px;text-align:center;color:#fff;background:#df3030;border-bottom:8px solid #821414}h1{margin:0 0 12px;font:clamp(28px,5vw,44px) Georgia,serif}button,input,select{min-height:43px;padding:9px 12px;font-weight:bold;border:4px solid #222;box-shadow:4px 4px #222}button{cursor:pointer}.language-switch,.types,.tags{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:12px}.active{color:#fff;background:#222}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:13px;max-width:1300px;margin:25px auto 15px;padding:0 18px}.status{max-width:1300px;margin:20px auto 12px;padding:0 18px;font-weight:bold}.progress{height:17px;margin-top:9px;background:#fff;border:3px solid #222}.progress i{display:block;height:100%;background:#51a84d}.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:18px;max-width:1300px;margin:22px auto;padding:0 18px 45px}.card,.modal-box{background:#fff6c9;border:4px solid #222;box-shadow:6px 6px #222}.card{padding:12px;text-align:center;cursor:pointer}.card img{width:125px;height:125px;object-fit:contain;image-rendering:pixelated}.number{color:#821414;font-family:monospace;font-weight:bold}.name{margin-top:8px;font-size:18px;font-weight:bold}.type,.tag{padding:4px 7px;color:#fff;font-size:11px;font-weight:bold;background:#777;border:2px solid #222}.tag{color:#222;background:#fff}.fire{background:#e25822}.water{background:#398bd1}.electric,.ice,.ground,.flying,.steel,.fairy{color:#222;background:#f5c542}.grass{background:#55a630}.fighting{background:#a52a2a}.poison{background:#963db3}.psychic{background:#e85d75}.bug{background:#729c27}.rock{background:#8a7352}.ghost{background:#604080}.dragon{background:#5b3fa3}.dark{background:#3a3a3a}.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#000b}.modal.show{display:flex}.modal-box{position:relative;width:min(800px,100%);max-height:92vh;overflow:auto;padding:24px}.close{position:absolute;top:10px;right:12px;color:#fff;font-size:24px;background:#df3030}.detail-head{display:flex;align-items:center;gap:20px;padding-right:42px}.detail-head>img{width:180px;height:180px;object-fit:contain}.section{margin:23px 0 12px;padding:9px 12px;color:#fff;font-weight:bold;background:#df3030;border:3px solid #222}.evolution{display:flex;flex-direction:column;align-items:center;gap:8px;margin:15px 0}.evo{width:170px;padding:9px;text-align:center;background:#fff;border:3px solid #222}.evo img{width:105px;height:105px;object-fit:contain}.arrow{text-align:center;color:#821414;font-weight:bold}.arrow b{display:block;font-size:25px}.arrow small{display:inline-block;padding:4px 8px;color:#222;background:#ffd447;border:2px solid #222}.loading{grid-column:1/-1;padding:55px 20px;text-align:center;font-weight:bold}@media(max-width:650px){.filters{grid-template-columns:1fr}.dex-grid{grid-template-columns:repeat(2,1fr);gap:13px}.detail-head{display:block;text-align:center}}</style><body><header><h1 id="title">宝可梦全国图鉴</h1><p id="subtitle">关都 · 城都 · 丰缘 全国图鉴</p><div class="language-switch"><button id="zh" class="active">中文</button><button id="en">English</button></div></header><section class="filters"><input id="search" type="search" placeholder="搜索中文名称、英文名称或图鉴编号"><select id="gen"><option value="all">全部世代</option><option value="1">第一世代</option><option value="2">第二世代</option><option value="3">第三世代</option></select><select id="type"><option value="all">全部属性</option></select></section><div class="status"><span id="status">正在加载资料 0 / 386</span><div class="progress"><i id="bar"></i></div></div><main id="grid" class="dex-grid"><div class="loading">正在加载资料……</div></main><div id="modal" class="modal"><div class="modal-box"><button id="close" class="close">×</button><div id="detail"></div></div></div><script>const A='https://pokeapi.co/api/v2',T=386,S='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/',$=x=>document.querySelector(x),pad=n=>String(n).padStart(3,'0'),pid=u=>+u.split('/').filter(Boolean).pop(),sp=n=>S+n+'.png';let lang='zh',dex=[],cache=new Map(),chains=new Map();const D={zh:{title:'宝可梦全国图鉴',sub:'关都 · 城都 · 丰缘 全国图鉴',load:'正在加载资料',done:'加载完成，共',pokemon:'只宝可梦',no:'没有找到符合条件的宝可梦。',detail:'正在读取详细资料',desc:'图鉴描述',evo:'进化链',ability:'特性',moves:'技能（可通过升级习得）',number:'全国编号',type:'属性',level:'等级',up:'升级',friend:'亲密度',day:'白天升级',night:'夜晚升级',trade:'交换',none:'暂无进化资料。',all:'全部属性',types:{normal:'一般',fire:'火',water:'水',electric:'电',grass:'草',ice:'冰',fighting:'格斗',poison:'毒',ground:'地面',flying:'飞行',psychic:'超能力',bug:'虫',rock:'岩石',ghost:'幽灵',dragon:'龙',dark:'恶',steel:'钢',fairy:'妖精'}},en:{title:'386 Pokémon National Pokédex',sub:'Kanto · Johto · Hoenn National Pokédex',load:'Loading data',done:'Loading complete:',pokemon:'Pokémon',no:'No Pokémon match the current filters.',detail:'Loading details',desc:'Pokédex Description',evo:'Evolution Chain',ability:'Abilities',moves:'Moves learned by level up',number:'National Number',type:'Type',level:'Level',up:'Level up',friend:'Friendship',day:'Level up during the day',night:'Level up at night',trade:'Trade',none:'No evolution data.',all:'All Types',types:{normal:'Normal',fire:'Fire',water:'Water',electric:'Electric',grass:'Grass',ice:'Ice',fighting:'Fighting',poison:'Poison',ground:'Ground',flying:'Flying',psychic:'Psychic',bug:'Bug',rock:'Rock',ghost:'Ghost',dragon:'Dragon',dark:'Dark',steel:'Steel',fairy:'Fairy'}}},t=()=>D[lang],gen=n=>n<152?1:n<252?2:3;function nm(a,f){let get=k=>a?.find(x=>x.language?.name===k)?.name;return{zh:get('zh-Hans')||get('zh-Hant')||get('zh')||'',en:get('en')||f}}function show(n){return lang==='zh'?(n.zh||n.en):(n.en||n.zh)}function ty(a){return a.map(x=>{let n=x.type?x.type.name:x;return`<span class="type ${n}">${t().types[n]||n}</span>`}).join('')}async function json(u){let e;for(let i=0;i<4;i++)try{let r=await fetch(u);if(r.ok)return r.json();throw 0}catch(x){e=x;await new Promise(r=>setTimeout(r,300*(i+1)))}throw e}async function load(){for(let i=1;i<=T;i+=10){let b=await Promise.all([...Array(Math.min(10,T-i+1))].map((_,j)=>{let n=i+j;return Promise.all([json(A+'/pokemon/'+n),json(A+'/pokemon-species/'+n)]).then(([p,s])=>({id:n,p,s,names:nm(s.names,s.name),types:p.types.map(x=>x.type.name),generation:gen(n)}))}));dex.push(...b);let n=Math.min(i+9,T);$('#bar').style.width=n/T*100+'%';$('#status').textContent=`${t().load} ${n} / ${T}`;types();render()}$('#status').textContent=`${t().done} ${T} ${t().pokemon}`}function types(){let v=$('#type').value,a=[...new Set(dex.flatMap(x=>x.types))].sort();$('#type').innerHTML=`<option value="all">${t().all}</option>`+a.map(x=>`<option value="${x}">${t().types[x]}</option>`).join('');$('#type').value=a.includes(v)?v:'all'}function render(){let q=$('#search').value.toLowerCase(),g=$('#gen').value,y=$('#type').value,r=dex.filter(x=>(!q||`${x.names.zh} ${x.names.en} ${x.id}`.toLowerCase().includes(q))&&(g==='all'||x.generation==g)&&(y==='all'||x.types.includes(y)));$('#grid').innerHTML=r.length?r.map(x=>`<article class="card" data-id="${x.id}"><div class="number">No. ${pad(x.id)}</div><img src="${sp(x.id)}"><div class="name">${show(x.names)}</div><div class="types">${ty(x.types)}</div></article>`).join(''):`<div class="loading">${t().no}</div>`;document.querySelectorAll('.card').forEach(x=>x.onclick=()=>open(+x.dataset.id))}async function local(u,f){let k=lang+u;if(cache.has(k))return cache.get(k);let d=await json(u),v=show(nm(d.names,f));cache.set(k,v);return v}function cond(x){x=x?.[0];if(!x)return t().up;if(x.trigger?.name==='trade')return t().trade;if(x.trigger?.name==='level-up'){let a=[];if(x.min_level)a.push(`${t().level} ${x.min_level}`);if(x.min_happiness)a.push(`${t().friend} ${x.min_happiness}`);if(x.time_of_day==='day')a.push(t().day);if(x.time_of_day==='night')a.push(t().night);return a.join(' · ')||t().up}return lang==='zh'?'特殊条件':'Special condition'}async function evo(p){if(chains.has(p.id))return chains.get(p.id);let d=await json(p.s.evolution_chain.url),out=[];!function walk(n,a=[],c=''){let z=[...a,{id:pid(n.species.url),c}];n.evolves_to.length?n.evolves_to.forEach(x=>walk(x,z,cond(x.evolution_details))):out.push(z)}(d.chain);chains.set(p.id,out);return out}function evos(a){return a.map(p=>`<div class="evolution">${p.map((x,i)=>{let z=dex.find(q=>q.id===x.id);return`${i?`<div class="arrow"><b>↓</b><small>${x.c}</small></div>`:''}<div class="evo"><img src="${sp(x.id)}"><div>No. ${pad(x.id)}</div><strong>${show(z.names)}</strong></div>`}).join('')}</div>`).join('')||`<p>${t().none}</p>`}async function open(n){let p=dex.find(x=>x.id===n);$('#modal').classList.add('show');$('#detail').innerHTML=`<div class="loading">${t().detail}</div>`;try{let [e,ab,mv]=await Promise.all([evo(p),Promise.all(p.p.abilities.map(async x=>`${await local(x.ability.url,x.ability.name)}${x.is_hidden?(lang==='zh'?'（隐藏特性）':' (Hidden)'):''}`)),Promise.all(p.p.moves.map(async x=>{let v=x.version_group_details.find(q=>q.version_group.name==='emerald'&&q.move_learn_method.name==='level-up');return v?`${t().level} ${v.level_learned_at} · ${await local(x.move.url,x.move.name)}`:null}))]);let f=p.s.flavor_text_entries.find(x=>x.language.name===(lang==='zh'?'zh-Hans':'en'))?.flavor_text.replace(/\f/g,' ')||'';mv=mv.filter(Boolean).sort((a,b)=>+a.match(/\d+/)-+b.match(/\d+/)).slice(0,24);$('#detail').innerHTML=`<div class="detail-head"><img src="${sp(n)}"><div><h2>${show(p.names)}</h2><p><b>${t().number}：</b>No. ${pad(n)}</p><p><b>${t().type}：</b></p><div class="types">${ty(p.types)}</div></div></div><div class="section">${t().desc}</div><p>${f}</p><div class="section">${t().ability}</div><div class="tags">${ab.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="section">${t().moves}</div><div class="tags">${mv.map(x=>`<span class="tag">${x}</span>`).join('')}</div><div class="section">${t().evo}</div>${evos(e)}`}catch(e){$('#detail').innerHTML='<div class="loading">资料加载失败，请重试。</div>'}}function apply(){$('#title').textContent=t().title;$('#subtitle').textContent=t().sub;$('#search').placeholder=lang==='zh'?'搜索中文名称、英文名称或图鉴编号':'Search name or Pokédex number';$('#zh').classList.toggle('active',lang==='zh');$('#en').classList.toggle('active',lang==='en');types();render()}['search','gen','type'].forEach(x=>$('#'+x).oninput=render);$('#zh').onclick=()=>{lang='zh';apply()};$('#en').onclick=()=>{lang='en';apply()};$('#close').onclick=()=>$('#modal').classList.remove('show');$('#modal').onclick=e=>e.target===$('#modal')&&$('#modal').classList.remove('show');load()</script></body></html>
