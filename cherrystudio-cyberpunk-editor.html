<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CherryStudio Cyberpunk 2077 CSS 编辑器</title>
<style>
/* ========== 编辑器本体样式 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body.editor-body {
  display: flex;
  height: 100vh;
  font-family: 'JetBrains Mono', 'Fira Code', monospace;
  background: #0a0a12;
  color: #e8e8e8;
  overflow: hidden;
}

/* ---- 左侧属性面板 ---- */
.editor-panel {
  width: 420px;
  min-width: 320px;
  background: #0f0f1a;
  border-right: 2px solid rgba(255, 77, 143, 0.25);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.editor-panel-header {
  padding: 12px 16px;
  background: rgba(255, 77, 143, 0.08);
  border-bottom: 2px solid var(--cyber-yellow, #ffdd00);
  font-family: 'Orbitron', sans-serif;
  font-size: 13px;
  font-weight: 700;
  color: #ffdd00;
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}

.editor-panel-header::before { content: '⚡'; }

.editor-panel-search {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(255, 77, 143, 0.15);
  flex-shrink: 0;
}

.editor-panel-search input {
  width: 100%;
  padding: 8px 12px;
  background: rgba(255, 255, 255, 0.04);
  border: 2px solid rgba(255, 77, 143, 0.25);
  border-radius: 2px;
  color: #e8e8e8;
  font-family: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color 0.3s;
}

.editor-panel-search input:focus {
  border-color: #00b4ff;
  box-shadow: 0 0 0 2px rgba(0, 180, 255, 0.15);
}

.editor-panel-search input::placeholder { color: #5a5a72; }

.editor-panel-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0;
}

.editor-panel-content::-webkit-scrollbar { width: 6px; }
.editor-panel-content::-webkit-scrollbar-track { background: #0a0a12; }
.editor-panel-content::-webkit-scrollbar-thumb {
  background: rgba(255, 77, 143, 0.3);
  border-radius: 2px;
}

/* ---- 属性分组 ---- */
.prop-group { border-bottom: 1px solid rgba(255, 255, 255, 0.05); }

.prop-group-title {
  padding: 10px 16px;
  background: rgba(255, 255, 255, 0.02);
  font-family: 'Orbitron', 'Rajdhani', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: #ff4d8f;
  letter-spacing: 1px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
  position: sticky;
  top: 0;
  z-index: 1;
}

.prop-group-title::before {
  content: '▸';
  transition: transform 0.2s;
  font-size: 10px;
}

.prop-group.open .prop-group-title::before { transform: rotate(90deg); }

.prop-group-body { padding: 0 12px 12px 24px; display: none; }
.prop-group.open .prop-group-body { display: block; }

/* ---- 属性行 ---- */
.prop-row {
  display: flex;
  align-items: center;
  padding: 5px 8px;
  border-radius: 2px;
  gap: 8px;
  transition: background 0.2s;
  margin-bottom: 2px;
}

.prop-row:hover { background: rgba(255, 255, 255, 0.03); }

.prop-label {
  font-size: 12px;
  color: #8a8aa0;
  min-width: 110px;
  flex-shrink: 0;
  font-family: 'Rajdhani', sans-serif;
  font-weight: 600;
}

.prop-input {
  flex: 1;
  padding: 4px 8px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 77, 143, 0.2);
  border-radius: 2px;
  color: #e8e8e8;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color 0.3s;
  min-width: 0;
}

.prop-input:focus {
  border-color: #00b4ff;
  box-shadow: 0 0 8px rgba(0, 180, 255, 0.15);
}

.prop-color-input {
  width: 32px;
  height: 28px;
  padding: 2px;
  border: 1px solid rgba(255, 77, 143, 0.3);
  border-radius: 2px;
  cursor: pointer;
  background: transparent;
  flex-shrink: 0;
}

.prop-select {
  padding: 4px 8px;
  background: rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 77, 143, 0.2);
  border-radius: 2px;
  color: #e8e8e8;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  outline: none;
  cursor: pointer;
  flex: 0.6;
  min-width: 0;
}

.prop-select:focus { border-color: #00b4ff; }

/* ---- 主内容区 ---- */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #0a0a12;
}

.main-tabs {
  display: flex;
  background: rgba(10, 10, 18, 0.95);
  border-bottom: 2px solid rgba(255, 77, 143, 0.25);
  flex-shrink: 0;
}

.main-tab {
  padding: 10px 20px;
  font-family: 'Orbitron', 'Rajdhani', sans-serif;
  font-size: 12px;
  font-weight: 600;
  color: #5a5a72;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.3s;
  letter-spacing: 0.5px;
}

.main-tab:hover { color: #8a8aa0; background: rgba(255, 255, 255, 0.02); }

.main-tab.active {
  color: #ff4d8f;
  border-bottom-color: #ff4d8f;
  background: rgba(255, 77, 143, 0.05);
}

.main-content { flex: 1; overflow: auto; position: relative; }

.main-content::-webkit-scrollbar { width: 8px; }
.main-content::-webkit-scrollbar-track { background: #0a0a12; }
.main-content::-webkit-scrollbar-thumb {
  background: rgba(255, 77, 143, 0.2);
  border-radius: 2px;
}

/* ---- 预览面板 ---- */
.preview-panel { height: 100%; overflow: auto; position: relative; }
.preview-panel.dark-mode { background: #0a0a12; color: #e8e8e8; }

/* ---- CSS 输出面板 ---- */
.code-panel {
  height: 100%;
  display: none;
  flex-direction: column;
}
.code-panel.active { display: flex; }

.code-editor-wrap {
  flex: 1;
  overflow: auto;
  padding: 16px;
  position: relative;
}

.code-editor-wrap pre {
  margin: 0;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre;
  tab-size: 2;
  counter-reset: line;
}

.code-editor-wrap pre code { font-family: inherit; font-size: inherit; }

.code-line {
  display: block;
  padding-left: 60px;
  position: relative;
  counter-increment: line;
  color: #e8e8e8;
}

.code-line::before {
  position: absolute;
  left: 0;
  width: 48px;
  text-align: right;
  color: #5a5a72;
  font-size: 11px;
  content: counter(line);
}

.code-comment { color: #5a5a72; font-style: italic; }
.code-selector { color: #ff4d8f; }
.code-property { color: #00b4ff; }
.code-value { color: #ffdd00; }
.code-bracket { color: #8a8aa0; }

.code-actions {
  padding: 10px 16px;
  border-top: 1px solid rgba(255, 77, 143, 0.15);
  display: flex;
  gap: 10px;
  background: rgba(15, 15, 26, 0.95);
  flex-shrink: 0;
}

.copy-btn {
  padding: 8px 20px;
  background: rgba(255, 77, 143, 0.15);
  border: 2px solid #ff4d8f;
  border-radius: 2px;
  color: #ff4d8f;
  font-family: 'Orbitron', sans-serif;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.3s;
  letter-spacing: 1px;
}

.copy-btn:hover {
  background: #ff4d8f;
  color: #fff;
  box-shadow: 0 0 25px rgba(255, 77, 143, 0.3);
}

.copy-btn.copied {
  background: #00ff88;
  border-color: #00ff88;
  color: #0a0a12;
}

/* ---- 底部状态栏 ---- */
.status-bar {
  padding: 4px 16px;
  background: rgba(255, 77, 143, 0.08);
  border-top: 1px solid rgba(255, 77, 143, 0.15);
  font-size: 11px;
  color: #5a5a72;
  display: flex;
  justify-content: space-between;
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}

/* ---- 响应式 ---- */
@media (max-width: 900px) {
  .editor-panel { width: 300px; min-width: 260px; }
  .prop-label { min-width: 80px; font-size: 11px; }
}
</style>
</head>
<body class="editor-body">

<!-- ===== 左侧属性面板 ===== -->
<div class="editor-panel">
  <div class="editor-panel-header">CYBERPUNK 2077 · CSS 编辑器</div>
  <div class="editor-panel-search">
    <input type="text" id="propSearch" placeholder="🔍 搜索选择器或属性名...">
  </div>
  <div class="editor-panel-content" id="propPanel"></div>
</div>

<!-- ===== 主区域 ===== -->
<div class="main-area">
  <div class="main-tabs">
    <div class="main-tab active" data-tab="preview">预览</div>
    <div class="main-tab" data-tab="css-output">CSS 代码</div>
  </div>
  <div class="main-content">
    <div class="preview-panel dark-mode" id="previewPanel">
      <div id="cherryPreview"></div>
    </div>
    <div class="code-panel" id="codePanel">
      <div class="code-actions">
        <button class="copy-btn" id="copyBtn">📋 复制全部 CSS</button>
        <button class="copy-btn" id="copyDarkBtn">🌙 仅暗色</button>
        <button class="copy-btn" id="copyLightBtn">☀️ 仅亮色</button>
      </div>
      <div class="code-editor-wrap">
        <pre><code id="codeContent"></code></pre>
      </div>
    </div>
  </div>
  <div class="status-bar">
    <span id="statusLeft">CherryStudio 2077 CSS 编辑器</span>
    <span id="statusRight">就绪</span>
  </div>
</div>

<script>
// ========== 核心数据：选择器 -> 属性配置 ==========
const PROPS = [
  {
    group: '🎨 CSS 变量定义',
    items: [
      { sel: ':root', label: '霓虹主色', prop: '--cyber-pink', type: 'color', val: '#ff4d8f' },
      { sel: ':root', label: '荒坂黄', prop: '--cyber-yellow', type: 'color', val: '#ffdd00' },
      { sel: ':root', label: '数据流蓝', prop: '--cyber-blue', type: 'color', val: '#00b4ff' },
      { sel: ':root', label: '霓虹青', prop: '--cyber-cyan', type: 'color', val: '#00e5ff' },
      { sel: ':root', label: '赛博橙', prop: '--cyber-orange', type: 'color', val: '#ff6b00' },
      { sel: ':root', label: '矩阵绿', prop: '--cyber-green', type: 'color', val: '#00ff88' },
      { sel: ':root', label: '主背景', prop: '--bg-primary', type: 'color', val: '#0a0a12' },
      { sel: ':root', label: '二级背景', prop: '--bg-secondary', type: 'color', val: '#0f0f1a' },
      { sel: ':root', label: '三级背景', prop: '--bg-tertiary', type: 'color', val: '#1a1a2e' },
      { sel: ':root', label: '卡片背景', prop: '--bg-card', type: 'color', val: '#0f0f1a' },
      { sel: ':root', label: '输入背景', prop: '--bg-input', type: 'color', val: 'rgba(255,255,255,0.04)' },
      { sel: ':root', label: '主文字', prop: '--text-primary', type: 'color', val: '#e8e8e8' },
      { sel: ':root', label: '二级文字', prop: '--text-secondary', type: 'color', val: '#8a8aa0' },
      { sel: ':root', label: '暗淡文字', prop: '--text-muted', type: 'color', val: '#5a5a72' },
      { sel: ':root', label: '边框颜色', prop: '--border-color', type: 'color', val: 'rgba(255,77,143,0.25)' },
      { sel: ':root', label: '悬停边框', prop: '--border-hover', type: 'color', val: 'rgba(255,221,0,0.35)' },
      { sel: ':root', label: '发光阴影', prop: '--shadow-glow', type: 'text', val: '0 0 30px rgba(255,77,143,0.08)' },
      { sel: ':root', label: '用户气泡', prop: '--chat-user-bg', type: 'color', val: 'rgba(255,77,143,0.15)' },
      { sel: ':root', label: '助手气泡', prop: '--chat-assistant-bg', type: 'color', val: 'rgba(0,180,255,0.08)' },
      { sel: ':root', label: '圆角', prop: '--radius', type: 'text', val: '2px' },
      { sel: ':root', label: '边框粗细', prop: '--all-stroke', type: 'text', val: '2px' },
    ]
  },
  {
    group: '🖥 全局',
    items: [
      { sel: 'body', label: '字体族', prop: 'font-family', type: 'text', val: '"Rajdhani","Orbitron","Noto Sans SC",sans-serif' },
      { sel: 'body', label: '背景色', prop: 'background-color', type: 'color', val: '#0a0a12' },
      { sel: 'body', label: '文字颜色', prop: 'color', type: 'color', val: '#e8e8e8' },
    ]
  },
  {
    group: '📊 表格',
    items: [
      { sel: '.markdown table', label: '边框', prop: 'border', type: 'text', val: '2px solid var(--cyber-blue)' },
      { sel: '.markdown table', label: '边框圆角', prop: 'border-radius', type: 'text', val: '2px' },
      { sel: '.markdown th', label: '表头背景', prop: 'background', type: 'color', val: '#1a1a2e' },
      { sel: '.markdown th', label: '表头文字', prop: 'color', type: 'color', val: '#ffdd00' },
      { sel: '.markdown th', label: '表头字号', prop: 'font-size', type: 'text', val: '1.1em' },
      { sel: '.markdown td', label: '单元格背景', prop: 'background', type: 'color', val: 'rgba(0,0,0,0.2)' },
      { sel: '.markdown td', label: '单元格字号', prop: 'font-size', type: 'text', val: 'inherit' },
      { sel: '.markdown tr:nth-child(even) td', label: '偶数行背景', prop: 'background', type: 'color', val: 'rgba(0,180,255,0.04)' },
      { sel: '.markdown tr:hover td', label: '行悬停背景', prop: 'background', type: 'color', val: 'rgba(255,221,0,0.04)' },
    ]
  },
  {
    group: '💬 聊天气泡',
    items: [
      { sel: '.bubble .message-content-container', label: '气泡圆角', prop: 'border-radius', type: 'text', val: '2px' },
      { sel: '.bubble .message-content-container', label: '内边距', prop: 'padding', type: 'text', val: '10px 16px' },
      { sel: '.bubble .message-content-container', label: '边框', prop: 'border', type: 'text', val: '2px solid var(--border-color)' },
      { sel: '.bubble .message-user .message-content-container', label: '用户气泡背景', prop: 'background-color', type: 'color', val: 'rgba(255,77,143,0.15)' },
      { sel: '.bubble .message-assistant .message-content-container', label: '助手气泡背景', prop: 'background-color', type: 'color', val: 'rgba(0,180,255,0.08)' },
      { sel: '.bubble .message-content-container', label: '气泡字号', prop: 'font-size', type: 'text', val: '14px' },
    ]
  },
  {
    group: '⌨️ 输入框',
    items: [
      { sel: '.ant-input-outlined', label: '边框', prop: 'border', type: 'text', val: '2px solid var(--border-color)' },
      { sel: '.ant-input-outlined', label: '背景色', prop: 'background', type: 'color', val: 'rgba(255,255,255,0.04)' },
      { sel: '.ant-input-outlined', label: '文字颜色', prop: 'color', type: 'color', val: '#e8e8e8' },
      { sel: '.ant-input-outlined:focus', label: '聚焦边框', prop: 'border-color', type: 'color', val: '#00b4ff' },
      { sel: '.ant-input-outlined:focus', label: '聚焦阴影', prop: 'box-shadow', type: 'text', val: '0 0 0 2px #00b4ff, 0 0 25px rgba(0,180,255,0.08)' },
      { sel: '.ant-input-outlined', label: '输入字号', prop: 'font-size', type: 'text', val: '14px' },
    ]
  },
  {
    group: '🔘 按钮',
    items: [
      { sel: 'button', label: '背景色', prop: 'background', type: 'color', val: '#0f0f1a' },
      { sel: 'button', label: '文字颜色', prop: 'color', type: 'color', val: '#e8e8e8' },
      { sel: 'button', label: '边框', prop: 'border', type: 'text', val: '2px solid var(--border-color)' },
      { sel: 'button', label: '字号', prop: 'font-size', type: 'text', val: '13px' },
      { sel: 'button:hover', label: '悬停背景', prop: 'background', type: 'color', val: '#ff4d8f' },
      { sel: 'button:hover', label: '悬停文字', prop: 'color', type: 'color', val: '#ffffff' },
    ]
  },
  {
    group: '📝 Markdown',
    items: [
      { sel: '.markdown h2', label: 'H2 颜色', prop: 'color', type: 'color', val: '#ffdd00' },
      { sel: '.markdown h2', label: 'H2 字号', prop: 'font-size', type: 'text', val: '1.4em' },
      { sel: '.markdown h2', label: 'H2 边框', prop: 'border', type: 'text', val: '2px solid var(--cyber-yellow)' },
      { sel: '.markdown h3', label: 'H3 颜色', prop: 'color', type: 'color', val: '#ff4d8f' },
      { sel: '.markdown h3', label: 'H3 字号', prop: 'font-size', type: 'text', val: '1.3em' },
      { sel: '.markdown h4', label: 'H4 颜色', prop: 'color', type: 'color', val: '#00b4ff' },
      { sel: '.markdown h4', label: 'H4 字号', prop: 'font-size', type: 'text', val: '1.2em' },
      { sel: '.markdown p', label: '段落行高', prop: 'line-height', type: 'text', val: '1.8' },
      { sel: '.markdown p', label: '段落字号', prop: 'font-size', type: 'text', val: '14px' },
      { sel: '.markdown code:not(pre code)', label: '行内代码颜色', prop: 'color', type: 'color', val: '#00ff88' },
      { sel: '.markdown code:not(pre code)', label: '行内代码背景', prop: 'background', type: 'color', val: 'rgba(0,0,0,0.6)' },
      { sel: '.markdown blockquote', label: '引用边框', prop: 'border-left-color', type: 'color', val: '#ff4d8f' },
      { sel: '.markdown strong', label: '粗体颜色', prop: 'color', type: 'color', val: '#ffdd00' },
      { sel: '.markdown em', label: '斜体颜色', prop: 'color', type: 'color', val: '#ff4d8f' },
      { sel: '.markdown a', label: '链接颜色', prop: 'color', type: 'color', val: '#00b4ff' },
      { sel: '.markdown hr', label: '分割线渐变色1', prop: 'gradient-color1', type: 'color', val: '#ff4d8f' },
      { sel: '.markdown hr', label: '分割线渐变色2', prop: 'gradient-color2', type: 'color', val: '#ffdd00' },
    ]
  },
  {
    group: '🎭 动画',
    items: [
      { sel: '.bubble .message-content-container', label: '过渡时长', prop: 'transition', type: 'text', val: 'all 0.3s' },
      { sel: 'button', label: '悬停上移', prop: 'transform', type: 'text', val: 'translateY(-2px) scale(1.02)' },
      { sel: 'button:hover', label: '悬停发光', prop: 'box-shadow', type: 'text', val: '0 0 35px rgba(255,77,143,0.20)' },
    ]
  },
  {
    group: '🔑 浅色模式变量',
    items: [
      { sel: 'body[theme-mode="light"]', label: '主背景', prop: '--bg-primary', type: 'color', val: '#ece8e0' },
      { sel: 'body[theme-mode="light"]', label: '二级背景', prop: '--bg-secondary', type: 'color', val: '#ded9cf' },
      { sel: 'body[theme-mode="light"]', label: '三级背景', prop: '--bg-tertiary', type: 'color', val: '#c8c0b2' },
      { sel: 'body[theme-mode="light"]', label: '卡片背景', prop: '--bg-card', type: 'color', val: '#f2eee6' },
      { sel: 'body[theme-mode="light"]', label: '主文字', prop: '--text-primary', type: 'color', val: '#1a1a2a' },
      { sel: 'body[theme-mode="light"]', label: '二级文字', prop: '--text-secondary', type: 'color', val: '#4a4a5a' },
      { sel: 'body[theme-mode="light"]', label: '输入背景', prop: '--bg-input', type: 'color', val: 'rgba(0,0,0,0.03)' },
      { sel: 'body[theme-mode="light"]', label: '用户气泡', prop: '--chat-user-bg', type: 'color', val: 'rgba(255,77,143,0.10)' },
      { sel: 'body[theme-mode="light"]', label: '助手气泡', prop: '--chat-assistant-bg', type: 'color', val: 'rgba(0,180,255,0.06)' },
    ]
  }
];

// ========== 状态管理 ==========
const state = {};
PROPS.forEach(group => {
  group.items.forEach(item => {
    const key = `${item.sel}>>${item.prop}`;
    state[key] = { sel: item.sel, prop: item.prop, value: item.val };
  });
});

// ========== 渲染属性面板 ==========
function renderPropPanel(filter = '') {
  const panel = document.getElementById('propPanel');
  let html = '';
  const f = filter.toLowerCase();

  PROPS.forEach(group => {
    const filtered = group.items.length === 0 ||
      (group.group.toLowerCase().includes(f) && group.items.length > 0) ||
      group.items.some(i => i.label.toLowerCase().includes(f) || i.prop.toLowerCase().includes(f));

    if (!filtered && filter) return;

    html += `<div class="prop-group ${group.items.length > 0 ? 'open' : ''}" data-group="${group.group}">`;
    html += `<div class="prop-group-title" onclick="this.parentElement.classList.toggle('open')">`;
    html += `<span>${group.group}</span>`;
    html += `</div><div class="prop-group-body">`;

    group.items.forEach(item => {
      if (filter && !item.label.toLowerCase().includes(f) && !item.prop.toLowerCase().includes(f) && !item.sel.toLowerCase().includes(f)) return;
      const key = `${item.sel}>>${item.prop}`;
      const val = state[key]?.value ?? item.val;

      html += `<div class="prop-row">`;
      html += `<span class="prop-label" title="${item.prop}">${item.label}</span>`;

      if (item.type === 'color') {
        html += `<input type="color" class="prop-color-input" value="${val}" data-key="${key}" onchange="updateProp(this)">`;
        html += `<input type="text" class="prop-input" value="${val}" data-key="${key}" onchange="updateProp(this)" style="flex:0.4">`;
      } else {
        html += `<input type="text" class="prop-input" value="${val}" data-key="${key}" onchange="updateProp(this)">`;
      }

      html += `</div>`;
    });

    html += `</div></div>`;
  });

  panel.innerHTML = html;
}

// ========== 更新属性 ==========
function updateProp(el) {
  const key = el.dataset.key;
  state[key].value = el.value;
  updatePreview();
  updateCode();
  updateStatus();
}

// ========== 更新 CSS 代码 ==========
function updateCode() {
  const rootProps = [];
  const lightProps = [];
  const otherRules = [];

  Object.values(state).forEach(s => {
    if (s.sel === ':root') {
      rootProps.push(s);
    } else if (s.sel.includes('light') && s.prop.startsWith('--')) {
      lightProps.push(s);
    } else {
      otherRules.push({ sel: s.sel, prop: s.prop, value: s.value });
    }
  });

  // 按选择器分组
  const ruleMap = {};
  otherRules.forEach(r => {
    if (!ruleMap[r.sel]) ruleMap[r.sel] = { sel: r.sel, props: [] };
    ruleMap[r.sel].props.push({ prop: r.prop, value: r.value });
  });

  const rootVars = rootProps.map(r => `  ${r.prop}: ${r.value};`).join('\n');
  const lightVars = lightProps.map(r => `  ${r.prop}: ${r.value};`).join('\n');

  let rulesCss = '';
  const ruleKeys = Object.keys(ruleMap);
  ruleKeys.forEach((key, i) => {
    const rule = ruleMap[key];
    const props = rule.props.map(p => `  ${p.prop}: ${p.value};`).join('\n');
    rulesCss += `\n/* ${key} */\n${key} {\n${props}\n}`;
  });

  let finalCss = `/* ============================================================\n   CHERRYSTUDIO · CYBERPUNK 2077\n   由 CSS 编辑器自动生成\n   ============================================================ */\n\n:root {\n${rootVars}\n}${rulesCss}`;

  if (lightVars.trim()) {
    finalCss += `\n\n/* ---- 浅色模式 ---- */\nbody[theme-mode="light"] {\n${lightVars}\n}`;
  }

  document.getElementById('codeContent').textContent = finalCss;
  document.getElementById('copyBtn').dataset.css = finalCss;
  const parts = finalCss.split('\n\n/* ---- 浅色模式 ---- */');
  document.getElementById('copyDarkBtn').dataset.css = parts[0] || finalCss;
  document.getElementById('copyLightBtn').dataset.css = parts[1] ? `/* ---- 浅色模式 ---- */\n${parts[1]}` : '';
}
