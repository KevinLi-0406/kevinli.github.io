<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宝可梦全国图鉴</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  color: #222;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  background-color: #eee3b2;
  background-image:
    linear-gradient(45deg, #e0d29e 25%, transparent 25%),
    linear-gradient(-45deg, #e0d29e 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e0d29e 75%),
    linear-gradient(-45deg, transparent 75%, #e0d29e 75%);
  background-size: 32px 32px;
  background-position:
    0 0,
    0 16px,
    16px -16px,
    -16px 0;
}

header {
  padding: 25px 15px;
  text-align: center;
  color: white;
  background: #df3030;
  border-bottom: 8px solid #821414;
  box-shadow: 0 5px 0 #222;
}

header h1 {
  margin: 0 0 12px;
  font-family: Georgia, serif;
  font-size: clamp(28px, 5vw, 44px);
  letter-spacing: 3px;
  text-shadow: 3px 3px 0 #751010;
}

header p {
  margin: 0;
  font-weight: bold;
  font-size: 14px;
}

.language-switch {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
}

.language-switch button {
  padding: 8px 18px;
  color: #222;
  font-weight: bold;
  background: white;
  border: 3px solid #222;
  box-shadow: 3px 3px 0 #222;
  cursor: pointer;
}

.language-switch button.active {
  color: white;
  background: #222;
}

.filters {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr 2fr;
  gap: 13px;
  max-width: 1300px;
  margin: 25px auto 15px;
  padding: 0 18px;
}

input,
select {
  width: 100%;
  min-height: 43px;
  padding: 9px 12px;
  color: #222;
  font-size: 14px;
  font-weight: bold;
  background: #fffdf0;
  border: 4px solid #222;
  outline: none;
  box-shadow: 4px 4px 0 #222;
}

.status {
  max-width: 1300px;
  margin: 20px auto 12px;
  padding: 0 18px;
  font-size: 14px;
  font-weight: bold;
}

.progress {
  height: 17px;
  margin-top: 9px;
  overflow: hidden;
  background: white;
  border: 3px solid #222;
  box-shadow: 3px 3px 0 #222;
}

.progress-bar {
  width: 0;
  height: 100%;
  background: #51a84d;
  transition: width .2s;
}

.dex-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 18px;
  max-width: 1300px;
  margin: 22px auto;
  padding: 0 18px 45px;
}

.card {
  padding: 12px;
  text-align: center;
  cursor: pointer;
  background: #fff6c9;
  border: 4px solid #222;
  box-shadow: 6px 6px 0 #222;
  transition: .12s;
}

.card:hover {
  transform: translate(-3px, -3px);
  background: #fff0a2;
  box-shadow: 9px 9px 0 #222;
}

.card img {
  width: 125px;
  height: 125px;
  object-fit: contain;
  image-rendering: pixelated;
}

.number {
  color: #821414;
  font-family: monospace;
  font-weight: bold;
}

.name {
  min-height: 27px;
  margin-top: 8px;
  font-size: 18px;
  font-weight: bold;
}

.types,
.tag-list {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
}

.type {
  display: inline-block;
  padding: 4px 7px;
  color: white;
  font-size: 11px;
  font-weight: bold;
  border: 2px solid #222;
}

.type-normal { background: #999; }
.type-fire { background: #e25822; }
.type-water { background: #398bd1; }
.type-electric { color: #222; background: #f5c542; }
.type-grass { background: #55a630; }
.type-ice { color: #222; background: #87ceeb; }
.type-fighting { background: #a52a2a; }
.type-poison { background: #963db3; }
.type-ground { color: #222; background: #c69c6d; }
.type-flying { color: #222; background: #a8c8e8; }
.type-psychic { background: #e85d75; }
.type-bug { background: #729c27; }
.type-rock { background: #8a7352; }
.type-ghost { background: #604080; }
.type-dragon { background: #5b3fa3; }
.type-dark { background: #3a3a3a; }
.type-steel { color: #222; background: #9aa4ad; }
.type-fairy { color: #222; background: #ee9ab2; }

.loading,
.empty {
  grid-column: 1 / -1;
  padding: 55px 20px;
  text-align: center;
  font-weight: bold;
}

.modal {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 18px;
  background: rgba(0, 0, 0, .75);
}

.modal.show {
  display: flex;
}

.modal-box {
  position: relative;
  width: min(800px, 100%);
  max-height: 92vh;
  overflow-y: auto;
  padding: 24px;
  background: #fff6c9;
  border: 5px solid #222;
  box-shadow: 9px 9px 0 #111;
}

.close {
  position: absolute;
  top: 10px;
  right: 12px;
  width: 38px;
  height: 38px;
  color: white;
  font-size: 24px;
  font-weight: bold;
  background: #df3030;
  border: 3px solid #222;
  cursor: pointer;
}

.detail-head {
  display: flex;
  align-items: center;
  gap: 20px;
  padding-right: 42px;
}

.detail-head > img {
  width: 180px;
  height: 180px;
  object-fit: contain;
  image-rendering: pixelated;
}

.detail-title h2 {
  margin: 0 0 12px;
  font-size: 30px;
}

.detail-title p {
  margin: 7px 0;
}

.section-title {
  margin: 23px 0 12px;
  padding: 9px 12px;
  color: white;
  font-weight: bold;
  background: #df3030;
  border: 3px solid #222;
}

.tag {
  padding: 6px 9px;
  color: #222;
  font-size: 12px;
  font-weight: bold;
  background: #ffd447;
  border: 2px solid #222;
  box-shadow: 2px 2px 0 #222;
}

.tag.move {
  background: #b9e5c0;
}

.stats {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.stat-row {
  display: grid;
  grid-template-columns: 90px 42px 1fr;
  align-items: center;
  gap: 8px;
  font-size: 13px;
}

.stat-bar {
  height: 15px;
  overflow: hidden;
  background: white;
  border: 2px solid #222;
}

.stat-bar i {
  display: block;
  height: 100%;
  background: #51a84d;
}

.evolution {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.evo-item {
  width: 170px;
  padding: 9px;
  text-align: center;
  background: white;
  border: 3px solid #222;
  box-shadow: 3px 3px 0 #222;
}

.evo-item img {
  width: 105px;
  height: 105px;
  object-fit: contain;
  image-rendering: pixelated;
}

.evo-arrow {
  display: flex;
  flex-direction: column;
  align-items: center;
  color: #821414;
  font-weight: bold;
}

.evo-arrow span {
  font-size: 25px;
}

.evo-arrow small {
  padding: 4px 8px;
  color: #222;
  font-size: 11px;
  background: #ffd447;
  border: 2px solid #222;
}

@media (max-width: 1100px) {
  .filters {
    grid-template-columns: 1fr 1fr 1fr;
  }
}

@media (max-width: 650px) {
  .filters {
    grid-template-columns: 1fr;
  }

  .dex-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 13px;
  }

  .card img {
    width: 100px;
    height: 100px;
  }

  .detail-head {
    display: block;
    text-align: center;
  }

  .detail-head > img {
    width: 145px;
    height: 145px;
  }

  .modal-box {
    padding: 17px;
  }
}
</style>
</head>

<body>

<header>
  <h1 id="pageTitle">宝可梦全国图鉴</h1>
  <p id="headerSubtitle">关都 · 城都 · 丰缘 全国图鉴</p>

  <div class="language-switch">
    <button id="zhButton" class="active">中文</button>
    <button id="enButton">English</button>
  </div>
</header>

<section class="filters">
  <input
    id="searchInput"

  >

  <select id="generationFilter">
    <option value="all">全部世代</option>
    <option value="1">第一世代</option>
    <option value="2">第二世代</option>
    <option value="3">第三世代</option>

  <select id="typeFilter">
    <option value="all">全部属性</option>
  </select>

  <select id="abilityFilter">
    <option value="all">全部特性</option>
  </select>

  <input
    id="moveFilter"
    type="search"
    placeholder="按技能名称筛选"
  >
</section>

<div class="status">
  <div id="statusText">正在加载资料 0 / 386</div>

  <div class="progress">
    <div id="progressBar" class="progress-bar"></div>
  </div>
</div>

<main id="dexGrid" class="dex-grid">
  <div class="loading">正在加载资料……</div>
</main>

<div id="modal" class="modal">
  <div class="modal-box">
    <button id="closeModal" class="close">×</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>
const API = "https://pokeapi.co/api/v2";
const TOTAL = 386;

const SPRITE =
  "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/";

let language = "zh";
let allPokemon = [];
let speciesCache = new Map();
let detailCache = new Map();
let evolutionCache = new Map();
let resourceCache = new Map();

const TEXT = {

const itemNames = {
  "fire-stone": ["火之石", "Fire Stone"],
  "water-stone": ["水之石", "Water Stone"],
  "thunder-stone": ["雷之石", "Thunder Stone"],
  "leaf-stone": ["叶之石", "Leaf Stone"],
  "moon-stone": ["月之石", "Moon Stone"],
  "sun-stone": ["日之石", "Sun Stone"],
  "shiny-stone": ["光之石", "Shiny Stone"],
  "dusk-stone": ["暗之石", "Dusk Stone"],
  "dawn-stone": ["觉醒之石", "Dawn Stone"],
  "ice-stone": ["冰之石", "Ice Stone"]
};

const searchInput = document.getElementById("searchInput");
const generationFilter = document.getElementById("generationFilter");
const typeFilter = document.getElementById("typeFilter");
const abilityFilter = document.getElementById("abilityFilter");
const moveFilter = document.getElementById("moveFilter");
const statusText = document.getElementById("statusText");
const progressBar = document.getElementById("progressBar");
const dexGrid = document.getElementById("dexGrid");
const modal = document.getElementById("modal");
const modalContent = document.getElementById("modalContent");
const closeModal = document.getElementById("closeModal");
const zhButton = document.getElementById("zhButton");
const enButton = document.getElementById("enButton");

function t() {
  return TEXT[language];
}

function pad(number) {
  return String(number).padStart(3, "0");
}

function getGeneration(id) {
  if (id <= 151) return 1;
  if (id <= 251) return 2;
  return 3;
}

function getId(url) {
  return Number(url.split("/").filter(Boolean).pop());
}

function sprite(id) {
  return `${SPRITE}${id}.png`;
}

/*
  PokeAPI 中文语言字段可能是：
  zh-Hans、zh-Hant、zh 或 zh-cn。
  这里全部兼容。
*/
function localizedName(names, fallbackEnglish = "Unknown") {
  const list = Array.isArray(names) ? names : [];

  function findName(languageNames) {
    const item = list.find(entry => {
      const code = String(
        entry.language?.name || ""
      ).toLowerCase();

      return languageNames.includes(code);
    });

    return item?.name || null;
  }

  return {
    zh: findName([
      "zh-hans",
      "zh-hant",
      "zh",
      "zh-cn",
      "chinese-simplified"
    ]),

    en:
      findName(["en", "english"]) ||
      fallbackEnglish ||
      "Unknown"
  };
}

function displayName(names) {
  if (language === "zh") {
    return names.zh || names.en || t().unknownName;
  }

  return names.en || names.zh || "Unknown";
}

function typeName(type) {
  return t().types[type] || type;
}

function renderTypes(types) {
  return types.map(item => {
    const type = item.type ? item.type.name : item;

    return `
      <span class="type type-${type}">
        ${typeName(type)}
      </span>
    `;
  }).join("");
}

async function getResourceName(url) {
  if (resourceCache.has(url)) {
    return resourceCache.get(url);
  }

  try {
    const response = await fetch(url);
    const data = await response.json();

    const names = localizedName(
      data.names,
      data.name
    );

    resourceCache.set(url, names);
    return names;
  } catch {
    return {
      zh: null,
      en: "Unknown"
    };
  }
}

async function loadPokemon(id) {
  if (detailCache.has(id)) {
    return detailCache.get(id);
  }

  const response = await fetch(`${API}/pokemon/${id}`);
  const data = await response.json();

  const abilities = await Promise.all(
    data.abilities.map(async item => ({
      names: await getResourceName(item.ability.url),
      hidden: item.is_hidden
    }))
  );

  const moves = await Promise.all(
    data.moves.map(async item => ({
      names: await getResourceName(item.move.url),
      url: item.move.url
    }))
  );

  const result = {
    ...data,
    abilities,
    moves
  };

  detailCache.set(id, result);
  return result;
}

function updateStatus(loaded, finished = false) {
  if (finished) {
    statusText.textContent =
      `${t().complete} ${allPokemon.length} ${t().pokemon}`;
  } else {
    statusText.textContent =
      `${t().loading} ${loaded} / ${TOTAL}`;
  }
}

async function loadDex() {
  const batchSize = 8;

  for (let start = 1; start <= TOTAL; start += batchSize) {
    const end = Math.min(start + batchSize - 1, TOTAL);

    const batch = await Promise.all(
      Array.from(
        { length: end - start + 1 },
        async (_, index) => {
          const id = start + index;

          try {
            const [speciesResponse, pokemon] =
              await Promise.all([
                fetch(`${API}/pokemon-species/${id}`),
                loadPokemon(id)
              ]);

            const species = await speciesResponse.json();

            /*
              关键：
              中文宝可梦名称来自 pokemon-species 接口的 names。
              species.name 只是英文兜底名称。
            */
            const names = localizedName(
              species.names,
              species.name
            );

            const descriptions = {
              zh:
                species.flavor_text_entries?.find(
                  entry => entry.language.name === "zh-Hans"
                )?.flavor_text ||
                species.flavor_text_entries?.find(
                  entry => entry.language.name === "zh-Hant"
                )?.flavor_text ||
                species.flavor_text_entries?.find(
                  entry => entry.language.name === "zh"
                )?.flavor_text ||
                null,

              en:
                species.flavor_text_entries?.find(
                  entry => entry.language.name === "en"
                )?.flavor_text ||
                null
            };

            speciesCache.set(id, species);

            return {
              id,
              names,
              descriptions,
              species,
              pokemon,
              generation: getGeneration(id),
              types: pokemon.types.map(
                item => item.type.name
              ),
              abilities: pokemon.abilities,
              moves: pokemon.moves
            };
          } catch (error) {
            console.error(`Failed to load Pokémon ${id}`, error);
            return null;
          }
        }
      )
    );

    batch.forEach(item => {
      if (item) {
        allPokemon.push(item);
      }
    });

    allPokemon.sort((a, b) => a.id - b.id);

    progressBar.style.width =
      `${Math.min(end, TOTAL) / TOTAL * 100}%`;

    updateStatus(Math.min(end, TOTAL));
    updateFilters();
    renderDex();
  }

  updateStatus(TOTAL, true);
  updateFilters();
  renderDex();
}

function updateFilters() {
  const oldType = typeFilter.value;
  const oldAbility = abilityFilter.value;

  const types = [
    ...new Set(
      allPokemon.flatMap(item => item.types)
    )
  ].sort();

  const abilities = [
    ...new Set(
      allPokemon.flatMap(item =>
        item.abilities.map(
          ability => displayName(ability.names)
        )
      )
    )
  ].sort((a, b) => a.localeCompare(b));

  typeFilter.innerHTML = `
    <option value="all">${t().allTypes}</option>
    ${types.map(type => `
      <option value="${type}">
        ${typeName(type)}
      </option>
    `).join("")}
  `;

  abilityFilter.innerHTML = `
    <option value="all">${t().allAbilities}</option>
    ${abilities.map(ability => `
      <option value="${ability}">${ability}</option>
    `).join("")}
  `;

  if (
    [...typeFilter.options].some(
      option => option.value === oldType
    )
  ) {
    typeFilter.value = oldType;
  }

  if (
    [...abilityFilter.options].some(
      option => option.value === oldAbility
    )
  ) {
    abilityFilter.value = oldAbility;
  }
}

function renderDex() {
  const keyword = searchInput.value.trim().toLowerCase();
  const generation = generationFilter.value;
  const selectedType = typeFilter.value;
  const selectedAbility = abilityFilter.value;
  const moveKeyword = moveFilter.value.trim().toLowerCase();

  const result = allPokemon.filter(item => {
    const allNames = [
      item.names.zh,
      item.names.en
    ]
      .filter(Boolean)
      .join(" ")
      .toLowerCase();

    const matchesSearch =
      !keyword ||
      allNames.includes(keyword) ||
      String(item.id).includes(keyword);

    const matchesGeneration =
      generation === "all" ||
      item.generation === Number(generation);

    const matchesType =
      selectedType === "all" ||
      item.types.includes(selectedType);

    const matchesAbility =
      selectedAbility === "all" ||
      item.abilities.some(
        ability =>
          displayName(ability.names) === selectedAbility
      );

    const matchesMove =
      !moveKeyword ||
      item.moves.some(move => {
        const moveNames = [
          move.names.zh,
          move.names.en
        ]
          .filter(Boolean)
          .join(" ")
          .toLowerCase();

        return moveNames.includes(moveKeyword);
      });

    return (
      matchesSearch &&
      matchesGeneration &&
      matchesType &&
      matchesAbility &&
      matchesMove
    );
  });

  if (!result.length) {
    dexGrid.innerHTML = `
      <div class="empty">${t().noResult}</div>
    `;
    return;
  }

  dexGrid.innerHTML = result.map(item => `
    <article class="card" data-id="${item.id}">
      <div class="number">No. ${pad(item.id)}</div>

      <img
        src="${sprite(item.id)}"
        alt="${displayName(item.names)}"
        loading="lazy"
        onerror="
          this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${item.id}.png'
        "
      >

      <div class="name">
        ${displayName(item.names)}
      </div>

      <div class="types">
        ${renderTypes(item.pokemon.types)}
      </div>
    </article>
  `).join("");

  document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => {
      openDetail(Number(card.dataset.id));
    });
  });
}

function renderStats(stats) {
  return stats.map(item => {
    const statName = item.stat.name;
    const value = item.base_stat;
    const width = Math.min(value / 2.55, 100);

    return `
      <div class="stat-row">
        <span>${t().stats[statName] || statName}</span>
        <strong>${value}</strong>

        <div class="stat-bar">
          <i style="width:${width}%"></i>
        </div>
      </div>
    `;
  }).join("");
}

function evolutionCondition(details) {
  const data = details?.[0];

  if (!data) {
    return t().levelUp;
  }

  if (data.trigger?.name === "level-up") {
    if (data.min_level) {
      return `${t().level} ${data.min_level}`;
    }

    if (data.min_happiness) {
      return `${t().friendship} ${data.min_happiness}`;
    }

    if (data.time_of_day === "day") {
      return t().day;
    }

    if (data.time_of_day === "night") {
      return t().night;
    }

    return t().levelUp;
  }

  if (data.trigger?.name === "trade") {
    return t().trade;
  }

  if (data.trigger?.name === "use-item") {
    const item = itemNames[data.item?.name];

    if (item) {
      return language === "zh" ? item[0] : item[1];
    }

    return t().useItem;
  }

  return t().special;
}

async function getEvolution(id) {
  if (evolutionCache.has(id)) {
    return evolutionCache.get(id);
  }

  const species = speciesCache.get(id);

  if (!species?.evolution_chain?.url) {
    return [];
  }

  const response = await fetch(
    species.evolution_chain.url
  );

  const data = await response.json();
  const paths = [];

  function walk(node, path = []) {
    const currentId = getId(node.species.url);

    const current = [
      ...path,
      {
        id: currentId,
        condition: ""
      }
    ];

    if (!node.evolves_to?.length) {
      paths.push(current);
      return;
    }

    node.evolves_to.forEach(next => {
      const condition = evolutionCondition(
        next.evolution_details
      );

      const nextPath = [
        ...current,
        {
          id: getId(next.species.url),
          condition
        }
      ];

      if (next.evolves_to?.length) {
        next.evolves_to.forEach(child => {
          walk(child, nextPath);
        });
      } else {
        paths.push(nextPath);
      }
    });
  }

  walk(data.chain);

  evolutionCache.set(id, paths);
  return paths;
}

function renderEvolution(paths) {
  if (!paths.length) {
    return `<p>${t().noEvolution}</p>`;
  }

  return paths.map(path => `
    <div class="evolution">
      ${path.map((step, index) => {
        const item = allPokemon.find(
          pokemon => pokemon.id === step.id
        );

        if (!item) {
          return "";
        }

        return `
          ${
            index > 0
              ? `
                <div class="evo-arrow">
                  <span>↓</span>
                  <small>${step.condition}</small>
                </div>
              `
              : ""
          }

          <div class="evo-item">
            <img
              src="${sprite(item.id)}"
              alt="${displayName(item.names)}"
              onerror="
                this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${item.id}.png'
              "
            >

            <div>No. ${pad(item.id)}</div>
            <strong>
              ${displayName(item.names)}
            </strong>
          </div>
        `;
      }).join("")}
    </div>
  `).join("");
}

function getDescription(item) {
  const description =
    language === "zh"
      ? item.descriptions.zh || item.descriptions.en
      : item.descriptions.en || item.descriptions.zh;

  return description
    ? description.replace(/\f/g, " ")
    : t().noDescription;
}

async function openDetail(id) {
  modal.classList.add("show");
  modalContent.dataset.id = id;

  modalContent.innerHTML = `
    <div class="loading">${t().loadingDetails}</div>
  `;

  try {
    const item = allPokemon.find(
      pokemon => pokemon.id === id
    );

    const pokemon = item.pokemon;
    const evolution = await getEvolution(id);

    modalContent.innerHTML = `
      <div class="detail-head">
        <img
          src="${sprite(id)}"
          alt="${displayName(item.names)}"
          onerror="
            this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png'
          "
        >

        <div class="detail-title">
          <h2>${displayName(item.names)}</h2>

          <p>
            <strong>${t().nationalNumber}：</strong>
            No. ${pad(id)}
          </p>

          <p>
            <strong>${t().generation}：</strong>
            ${item.generation}
          </p>

          <p>
            <strong>${t().type}：</strong>
          </p>

          <div class="types">
            ${renderTypes(pokemon.types)}
          </div>
        </div>
      </div>

      <div class="section-title">
        ${t().description}
      </div>

      <p>${getDescription(item)}</p>

      <div class="section-title">
        ${t().stats}
      </div>

      <div class="stats">
        ${renderStats(pokemon.stats)}
      </div>

      <div class="section-title">
        ${t().abilities}
      </div>

      <div class="tag-list">
        ${
          pokemon.abilities.length
            ? pokemon.abilities.map(ability => `
                <span class="tag">
                  ${displayName(ability.names)}
                  ${
                    ability.hidden
                      ? `（${t().hidden}）`
                      : ""
                  }
                </span>
              `).join("")
            : `<span>${t().noData}</span>`
        }
      </div>

      <div class="section-title">
        ${t().moves}
      </div>

      <div class="tag-list">
        ${
          pokemon.moves.length
            ? pokemon.moves.map(move => `
                <span class="tag move">
                  ${displayName(move.names)}
                </span>
              `).join("")
            : `<span>${t().noData}</span>`
        }
      </div>

      <div class="section-title">
        ${t().evolution}
      </div>

      ${renderEvolution(evolution)}
    `;
  } catch (error) {
    console.error(error);

    modalContent.innerHTML = `
      <div class="loading">${t().error}</div>
    `;
  }
}

function applyLanguage() {
  document.documentElement.lang =
    language === "zh" ? "zh-CN" : "en";

  document.title = t().title;

  document.getElementById("pageTitle").textContent =
    t().title;

  document.getElementById("headerSubtitle").textContent =
    t().subtitle;

  searchInput.placeholder = t().search;
  moveFilter.placeholder = t().moveSearch;

  const oldGeneration = generationFilter.value;

  generationFilter.innerHTML = `
    <option value="all">${t().allGenerations}</option>
    <option value="1">${t().gen1}</option>
    <option value="2">${t().gen2}</option>
    <option value="3">${t().gen3}</option>
  `;

  if (
    [...generationFilter.options].some(
      option => option.value === oldGeneration
    )
  ) {
    generationFilter.value = oldGeneration;
  }

  zhButton.classList.toggle(
    "active",
    language === "zh"
  );

  enButton.classList.toggle(
    "active",
    language === "en"
  );

  updateFilters();

  if (allPokemon.length) {
    renderDex();
    updateStatus(TOTAL, true);
  }

  if (modal.classList.contains("show")) {
    const id = modalContent.dataset.id;

    if (id) {
      openDetail(Number(id));
    }
  }
}

searchInput.addEventListener("input", renderDex);
moveFilter.addEventListener("input", renderDex);
generationFilter.addEventListener("change", renderDex);
typeFilter.addEventListener("change", renderDex);
abilityFilter.addEventListener("change", renderDex);

zhButton.addEventListener("click", () => {
  language = "zh";
  applyLanguage();
});

enButton.addEventListener("click", () => {
  language = "en";
  applyLanguage();
});

closeModal.addEventListener("click", () => {
  modal.classList.remove("show");
});

modal.addEventListener("click", event => {
  if (event.target === modal) {
    modal.classList.remove("show");
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    modal.classList.remove("show");
  }
});

applyLanguage();
loadDex();
</script>

</body>
</html>
