<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Studio · 全元素可视化编辑器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09111f;color:#eef4ff;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:330px 280px 1fr}.panel{background:#0d1729;border-right:1px solid #263957;overflow:auto}.brand{padding:18px 20px;border-bottom:1px solid #263957}.brand b{font-size:18px}.brand small{display:block;color:#8ea2c1;font-size:11px;margin-top:3px}.hint{margin:14px;padding:11px;border:1px solid #285270;border-radius:10px;background:#0b2637;color:#bcecff;font-size:12px}.section{padding:15px;border-bottom:1px solid #263957}.section h3{font-size:13px;margin:0 0 13px;color:#d5e3fa}.field{margin:10px 0}.field label{display:block;color:#91a4c2;font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;background:#081221;color:#eef4ff;border:1px solid #2a3d5d;border-radius:7px;padding:8px;outline:0;font:inherit}.field textarea{min-height:75px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#65d4ff}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px}.color{height:34px!important;padding:2px!important}.range{display:flex;gap:8px;align-items:center}.range input{padding:0}.range output{width:42px;color:#65d4ff;text-align:right;font-size:12px}.buttons{display:grid;gap:8px}.btn{cursor:pointer;border:1px solid #2a3d5d;border-radius:7px;padding:9px;background:#172640;color:#fff;font-weight:700}.btn:hover{filter:brightness(1.2)}.primary{background:linear-gradient(135deg,#197d9e,#5752c8);border:0}.publish{background:linear-gradient(135deg,#15845c,#2076ad);border:0}.danger{color:#ffabab}.status{font-size:12px;color:#91a4c2;min-height:20px;margin-top:9px}.ok{color:#7df0b2}.err{color:#ff9b9b}.tree-title{padding:18px 16px 10px;font-weight:700}.tree{padding:0 10px 20px}.node{padding:6px 8px;margin:2px 0;border-radius:5px;color:#b6c7e2;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.node:hover{background:#162a48}.node.selected{background:#174c6a;color:#fff}.node .tag{color:#65d4ff}.node .txt{color:#8fa2bd;margin-left:4px}.indent{margin-left:14px;border-left:1px solid #233a59;padding-left:4px}.stage{padding:18px;display:flex;flex-direction:column;min-width:0}.stagebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.stagebar h1{font-size:19px;margin:0}.stagebar span{font-size:12px;color:#91a4c2}.preview{flex:1;min-height:calc(100vh - 70px);background:#fff;border:1px solid #29405f;border-radius:12px;overflow:hidden}.preview iframe{width:100%;height:100%;min-height:calc(100vh - 70px);border:0}.empty{padding:20px;color:#91a4c2;text-align:center;font-size:12px}.badge{display:inline-block;padding:3px 7px;border-radius:99px;background:#182d4a;color:#65d4ff;font-size:11px;margin-bottom:8px}@media(max-width:1100px){.app{grid-template-columns:300px 240px 1fr}}@media(max-width:800px){.app{display:block}.panel{max-height:none;border-right:0;border-bottom:1px solid #263957}.preview,.preview iframe{min-height:600px}.stage{padding:10px}}
</style></head>
<body><div class="app">
<aside class="panel"><div class="brand"><b>✦ Portal Studio</b><small>全元素可视化编辑器 · index.html</small></div><div class="hint">点击预览中的任意元素，或从元素树选择。你可以修改文字、链接、图片、HTML 属性和常用 CSS；确认后才会写回 GitHub。</div>
<div class="section"><h3>当前元素</h3><div id="selectedInfo" class="badge">尚未选择元素</div><div class="field"><label>元素标签</label><input id="tagName" disabled></div><div class="field"><label>文字内容 / HTML 内容</label><textarea id="content"></textarea></div><div class="twocol"><div class="field"><label>链接 href</label><input id="href"></div><div class="field"><label>图片 src</label><input id="src"></div></div><div class="twocol"><div class="field"><label>元素 ID</label><input id="elid"></div><div class="field"><label>class</label><input id="classes"></div></div><div class="field"><label>内联 style</label><textarea id="inlineStyle" placeholder="例如 color:red; padding:20px"></textarea></div><div class="buttons"><button class="btn" id="apply">应用到元素</button><button class="btn" id="duplicate">复制元素</button><button class="btn danger" id="remove">删除元素</button></div></div>
<div class="section"><h3>常用样式</h3><div class="twocol"><div class="field"><label>文字颜色</label><input class="color" id="color" type="color" value="#000000"></div><div class="field"><label>背景颜色</label><input class="color" id="background" type="color" value="#ffffff"></div></div><div class="twocol"><div class="field"><label>字体大小</label><input id="fontSize" placeholder="如 18px"></div><div class="field"><label>字体粗细</label><select id="fontWeight"><option value="">默认</option><option>400</option><option>500</option><option>600</option><option>700</option><option>900</option></select></div></div><div class="twocol"><div class="field"><label>内边距 padding</label><input id="padding" placeholder="如 20px"></div><div class="field"><label>外边距 margin</label><input id="margin" placeholder="如 10px"></div></div><div class="twocol"><div class="field"><label>圆角 radius</label><input id="radius" placeholder="如 12px"></div><div class="field"><label>透明度</label><div class="range"><input id="opacity" type="range" min="0" max="1" step=".05" value="1"><output id="opacityOut">1</output></div></div></div><div class="field"><label>显示方式</label><select id="display"><option value="">默认</option><option>block</option><option>inline-block</option><option>flex</option><option>grid</option><option>none</option></select></div></div>
<div class="section"><h3>确认发布</h3><div class="field"><label>GitHub Token（仅本次使用）</label><input id="token" type="password" placeholder="github_pat_..."></div><div class="buttons"><button class="btn" id="reset">↺ 重新载入线上版本</button><button class="btn publish" id="publish">✓ 确认并更新 index.html</button></div><div id="status" class="status"></div><small style="color:#7186a5">Token 不会保存、不会写入 HTML。需要 Contents: Read and write 权限。</small></div></aside>
<aside class="panel"><div class="tree-title">页面元素树</div><div id="tree" class="tree"><div class="empty">加载中…</div></div></aside>
<main class="stage"><div class="stagebar"><h1>实时预览</h1><span>KevinLi-0406 / kevinli.github.io / main / index.html</span></div><div class="preview"><iframe id="frame" title="门户预览"></iframe></div></main></div>
<script>
const API='https://api.github.com/repos/KevinLi-0406/kevinli.github.io/contents/index.html?ref=main';let original='',sha='',doc=null,selected=null;const frame=document.querySelector('#frame'),status=document.querySelector('#status');
const $=id=>document.getElementById(id);function msg(t,c=''){status.textContent=t;status.className='status '+c}function decode(b){return decodeURIComponent(escape(atob(b.replace(/\\s/g,''))))}function encode(s){return btoa(unescape(encodeURIComponent(s)))}
function assignIds(){let n=0;doc.querySelectorAll('body *').forEach(el=>{if(!el.getAttribute('data-editor-id'))el.setAttribute('data-editor-id','pe-'+(++n))})}
function runtime(){return `<script>(function(){document.addEventListener('click',function(e){var x=e.target.closest('[data-editor-id]');if(x){e.preventDefault();e.stopPropagation();parent.postMessage({type:'pick',id:x.getAttribute('data-editor-id')},'*')}},true);document.addEventListener('mouseover',function(e){var x=e.target.closest('[data-editor-id]');if(x){x.style.outline='2px solid #ff9d3d';x.style.outlineOffset='2px'}},true);document.addEventListener('mouseout',function(e){var x=e.target.closest('[data-editor-id]');if(x){x.style.outline='';x.style.outlineOffset=''}} ,true)})()<\\/script>`}
function render(){if(!doc)return;let html='<!doctype html>'+doc.documentElement.outerHTML;frame.srcdoc=html.replace('</body>',runtime()+'</body>');renderTree()}
function renderTree(){let root=$('tree');root.innerHTML='';function walk(el,box,depth){if(!el||el.nodeType!==1||el.tagName==='SCRIPT')return;let id=el.getAttribute('data-editor-id'),text=(el.childNodes.length===1&&el.firstChild.nodeType===3?el.textContent.trim():'').replace(/\\s+/g,' ').slice(0,28);let row=document.createElement('div');row.className='node '+(selected===el?'selected':'');row.style.marginLeft=(depth*12)+'px';row.innerHTML='<span class="tag">&lt;'+el.tagName.toLowerCase()+'&gt;</span>'+(text?'<span class="txt">'+esc(text)+'</span>':'');row.onclick=()=>pick(id);box.appendChild(row);Array.from(el.children).forEach(ch=>walk(ch,box,depth+1))}walk(doc.body,root,0)}function esc(s){return s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]))}
function pick(id){selected=doc.querySelector('[data-editor-id="'+CSS.escape(id)+'"]');if(!selected)return;$('selectedInfo').textContent='<'+selected.tagName.toLowerCase()+'>';$('tagName').value=selected.tagName.toLowerCase();$('content').value=selected.innerHTML;$('href').value=selected.getAttribute('href')||'';$('src').value=selected.getAttribute('src')||'';$('elid').value=selected.id||'';$('classes').value=selected.className||'';$('inlineStyle').value=selected.getAttribute('style')||'';let cs=getComputedStyle(selected);$('color').value=toHex(cs.color);$('background').value=toHex(cs.backgroundColor);$('fontSize').value=selected.style.fontSize||'';$('fontWeight').value=selected.style.fontWeight||'';$('padding').value=selected.style.padding||'';$('margin').value=selected.style.margin||'';$('radius').value=selected.style.borderRadius||'';$('opacity').value=selected.style.opacity||1;$('opacityOut').textContent=$('opacity').value;$('display').value=selected.style.display||'';renderTree()}
function toHex(c){let m=c&&c.match(/\\d+/g);if(!m||m.length<3)return '#ffffff';return '#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join('')}
function apply(){if(!selected)return msg('请先选择一个元素','err');selected.innerHTML=$('content').value;let attrs={href:$('href').value,src:$('src').value,id:$('elid').value,class:$('classes').value,style:$('inlineStyle').value};Object.keys(attrs).forEach(k=>{if(attrs[k])selected.setAttribute(k,attrs[k]);else if(k!=='style')selected.removeAttribute(k)});let st=selected.style;[['color','color'],['backgroundColor','background'],['fontSize','fontSize'],['fontWeight','fontWeight'],['padding','padding'],['margin','margin'],['borderRadius','radius'],['opacity','opacity'],['display','display']].forEach(([a,b])=>{if($(b).value!=='')st[a]=$(b).value});render();pick(selected.getAttribute('data-editor-id'));msg('已应用到当前元素','ok')}
$('apply').onclick=apply;$('opacity').oninput=()=>{$('opacityOut').textContent=$('opacity').value};$('duplicate').onclick=()=>{if(!selected)return msg('请先选择元素','err');let c=selected.cloneNode(true);c.setAttribute('data-editor-id','pe-'+Date.now());selected.parentNode.insertBefore(c,selected.nextSibling);render();msg('已复制元素','ok')};$('remove').onclick=()=>{if(!selected||selected===doc.body)return msg('无法删除此元素','err');if(confirm('确定删除当前元素？')){selected.remove();selected=null;render();msg('元素已删除','ok')}};
window.onmessage=e=>{if(e.data&&e.data.type==='pick')pick(e.data.id)};
async function load(){try{msg('正在读取 index.html…');let r=await fetch(API);if(!r.ok)throw Error('无法读取 index.html');let j=await r.json();sha=j.sha;original=decode(j.content);doc=new DOMParser().parseFromString(original,'text/html');assignIds();render();msg('已载入线上版本','ok')}catch(e){msg(e.message,'err')}}
function clean(){let out=doc.documentElement.cloneNode(true);out.querySelectorAll('[data-editor-id]').forEach(x=>x.removeAttribute('data-editor-id'));out.querySelectorAll('script').forEach(x=>{if(x.textContent.includes('parent.postMessage'))x.remove()});return '<!DOCTYPE html>\\n'+out.outerHTML}
$('reset').onclick=load;$('publish').onclick=async()=>{let token=$('token').value.trim();if(!token)return msg('请先输入 GitHub Token','err');if(!confirm('确认把当前所有元素修改写入线上 index.html？'))return;try{msg('正在提交到 GitHub…');let r=await fetch(API,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Update portal with full visual editor',content:encode(clean()),sha,branch:'main'})});let j=await r.json();if(!r.ok)throw Error(j.message||'提交失败');sha=j.content.sha;original=clean();msg('发布成功！GitHub Pages 通常 1–2 分钟后更新。','ok')}catch(e){msg(e.message,'err')}};load();
</script></body></html>
