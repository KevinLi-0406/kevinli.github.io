<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Studio · KevinLI-0406</title>
<style>
:root{--bg:#0b1020;--panel:#111a2e;--line:#263653;--text:#eef4ff;--muted:#91a1bd;--accent:#65d4ff;--good:#7df0b2;--shadow:0 24px 70px #02061199}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#17385b 0,transparent 36%),var(--bg);color:var(--text);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:350px 1fr}.side{padding:24px 20px;border-right:1px solid var(--line);background:#0b1427e8;overflow:auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:24px}.mark{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#55ddff,#8c75ff);color:#061020;font-size:22px;font-weight:900}.brand b{font-size:18px}.brand small{display:block;color:var(--muted);font-size:11px}.notice{padding:12px 13px;border:1px solid #275070;border-radius:12px;background:#0c2435;color:#bcecff;margin-bottom:18px;font-size:12px}.group{padding:16px 0;border-top:1px solid var(--line)}.group h3{margin:0 0 13px;font-size:13px;color:#c9d8f1}.field{display:grid;grid-template-columns:1fr 92px;align-items:center;gap:12px;margin:11px 0}.field label{color:var(--muted);font-size:12px}.field input[type=color]{width:92px;height:32px;padding:2px;background:var(--panel);border:1px solid var(--line);border-radius:7px}.field input[type=text],.field input[type=password],.field input[type=number]{width:100%;padding:8px 9px;background:#0c1425;color:var(--text);border:1px solid var(--line);border-radius:7px;outline:none}.field input:focus{border-color:var(--accent)}.wide{display:block}.wide input{margin-top:7px}.range{display:flex;gap:8px;align-items:center}.range input{width:100%}.range output{width:38px;text-align:right;color:var(--accent);font-size:12px}.actions{display:grid;gap:9px;margin-top:17px}.btn{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#17243c;color:var(--text);font-weight:700}.btn:hover{filter:brightness(1.2)}.primary{background:linear-gradient(135deg,#237d9f,#5b55c8);border:0}.publish{background:linear-gradient(135deg,#14845c,#2074a7);border:0}.status{min-height:20px;color:var(--muted);font-size:12px;margin-top:11px}.status.ok{color:var(--good)}.status.err{color:#ff9b9b}.stage{padding:24px;display:flex;flex-direction:column;min-width:0}.stagebar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.stagebar h1{font-size:20px;margin:0}.stagebar span{color:var(--muted);font-size:12px}.preview{flex:1;min-height:720px;border:1px solid var(--line);border-radius:16px;background:white;box-shadow:var(--shadow);overflow:hidden}.preview iframe{width:100%;height:100%;min-height:720px;border:0;background:white}.tip{color:var(--muted);font-size:11px;margin-top:11px}@media(max-width:850px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line)}.preview,.preview iframe{min-height:620px}.stage{padding:16px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand"><div class="mark">✦</div><div><b>Portal Studio</b><small>可视化美化工具 · index.html</small></div></div><div class="notice">编辑器会实时预览你的门户首页。确认无误后，输入 GitHub Token 即可直接提交更新。</div>
<div class="group"><h3>🎨 视觉主题</h3><div class="field"><label>页面背景</label><input id="bg" type="color" value="#0d1117"></div><div class="field"><label>卡片背景</label><input id="panel" type="color" value="#161b22"></div><div class="field"><label>主题强调色</label><input id="accent" type="color" value="#58a6ff"></div><div class="field"><label>文字颜色</label><input id="text" type="color" value="#f0f6fc"></div><div class="field"><label>卡片圆角</label><div class="range"><input id="radius" type="range" min="0" max="30" value="14"><output id="radiusOut">14px</output></div></div><div class="field"><label>内容宽度</label><div class="range"><input id="width" type="range" min="760" max="1400" value="1120"><output id="widthOut">1120px</output></div></div></div>
<div class="group"><h3>✍️ 门户文案</h3><div class="field wide"><label>主标题</label><input id="title" type="text" value="李奕兴 Kevin"></div><div class="field wide"><label>简介</label><input id="desc" type="text" value="纳恩博（Ninebot / Segway）应用工程师。这里记录我的职业介绍、技术能力和个人项目作品。"></div></div>
<div class="group"><h3>🚀 确认发布</h3><div class="field wide"><label>GitHub Token（仅本次浏览器使用）</label><input id="token" type="password" placeholder="github_pat_..."></div><div class="actions"><button class="btn primary" id="reset">↺ 恢复当前线上版本</button><button class="btn publish" id="publish">✓ 确认并更新 index.html</button></div><div id="status" class="status"></div><div class="tip">Token 需要 Contents: Read and write 权限。不会保存到页面或提交到仓库。</div></div></aside>
<main class="stage"><div class="stagebar"><h1>实时预览</h1><span>目标：KevinLi-0406/kevinli.github.io · main/index.html</span></div><div class="preview"><iframe id="frame" title="门户预览"></iframe></div><div class="tip">提示：这是覆盖式预览，不会影响线上页面；只有点击“确认并更新”后才会写入 GitHub。</div></main></div>
<script>
const API='https://api.github.com/repos/KevinLi-0406/kevinli.github.io/contents/index.html?ref=main',frame=document.querySelector('#frame'),status=document.querySelector('#status');let original='',sha='';
const ids=['bg','panel','accent','text','radius','width','title','desc'];
function val(id){return document.getElementById(id).value}function setStatus(t,c=''){status.textContent=t;status.className='status '+c}
function css(){return `:root{--bg:${val('bg')};--panel:${val('panel')};--card:${val('panel')};--blue:${val('accent')};--text:${val('text')};--line:${val('accent')}55}.container{width:min(${val('width')}px,calc(100% - 36px))}.card,.profile,.info{border-radius:${val('radius')}px}.button.primary{background:${val('accent')};border-color:${val('accent')}.hero h1{background-image:linear-gradient(120deg,#fff,${val('accent')},#d8b4fe)}`}
function build(){if(!original)return;let data={title:val('title'),desc:val('desc')};let injection=`<style id="portal-studio-overrides">${css()}</style><script>(function(){var d=${JSON.stringify(data)};var h=document.querySelector('.hero h1'),p=document.querySelector('.hero p');if(h)h.textContent=d.title;if(p)p.textContent=d.desc;})();<\/script>`;frame.srcdoc=original.replace('</head>',injection+'</head>')}
function b64(s){return btoa(unescape(encodeURIComponent(s)))}
async function load(){try{let r=await fetch(API);if(!r.ok)throw Error('无法读取 index.html');let j=await r.json();original=decodeURIComponent(escape(atob(j.content.replace(/\s/g,''))));sha=j.sha;build();setStatus('已载入线上版本','ok')}catch(e){setStatus(e.message,'err')}}
ids.forEach(id=>document.getElementById(id).addEventListener('input',()=>{if(id==='radius'||id==='width')document.getElementById(id+'Out').textContent=val(id)+'px';build()}));
document.querySelector('#reset').onclick=()=>load();
document.querySelector('#publish').onclick=async()=>{let token=val('token').trim();if(!token){setStatus('请先输入 GitHub Token','err');return}if(!confirm('确认将当前预览写入线上 index.html？'))return;let content=original.replace('</head>',`<style id="portal-studio-overrides">${css()}</style>`+'</head>');let d={title:val('title'),desc:val('desc')};content=content.replace('</body>',`<script>(function(){var d=${JSON.stringify(d)};var h=document.querySelector('.hero h1'),p=document.querySelector('.hero p');if(h)h.textContent=d.title;if(p)p.textContent=d.desc;})();<\/script></body>`);try{setStatus('正在提交到 GitHub…');let r=await fetch(API,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message:'Update portal design via Portal Studio',content:b64(content),sha:sha,branch:'main'})});let j=await r.json();if(!r.ok)throw Error(j.message||'提交失败');sha=j.content.sha;original=content;setStatus('发布成功！GitHub Pages 通常会在 1–2 分钟内更新。','ok')}catch(e){setStatus(e.message,'err')}};
load();
</script></body></html>
