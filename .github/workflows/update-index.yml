name: 自动更新项目首页

on:
  push:
    branches:
      - main
      - master
    paths:
      - "*.html"
      - "**/*.html"
      - "scripts/update-index.js"
      - ".github/workflows/update-index.yml"

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 检查环境和文件
        run: |
          echo "当前目录："
          pwd

          echo ""
          echo "Node.js 版本："
          node --version

          echo ""
          echo "仓库文件："
          find . -maxdepth 3 -type f | sort

      - name: 检查必要文件
        run: |
          test -f index.html || {
            echo "错误：找不到 index.html"
            exit 1
          }

          test -f scripts/update-index.js || {
            echo "错误：找不到 scripts/update-index.js"
            exit 1
          }

          grep -q "// PROJECTS_START" index.html || {
            echo "错误：index.html 中找不到 // PROJECTS_START"
            exit 1
          }

          grep -q "// PROJECTS_END" index.html || {
            echo "错误：index.html 中找不到 // PROJECTS_END"
            exit 1
          }

          echo "必要文件和标记检查通过"

      - name: 更新 index.html
        run: |
          node scripts/update-index.js

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          if git diff --cached --quiet; then
            echo "index.html 没有变化"
          else
            git commit -m "自动更新项目首页"
            git push
          fi
