  <line x1="860" y1="288" x2="160" y2="380" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow-green)"/>
  <line x1="860" y1="288" x2="380" y2="380" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arrow-green)"/>
  <text x="600" y="345" text-anchor="middle" font-size="10" fill="#2563eb" font-weight="bold">Bot 共用同一 Dify 应用</text>

