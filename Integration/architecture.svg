    <rect width="380" height="58" rx="8" fill="#2563eb" filter="url(#shadow)"/>
    <text x="190" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">☁️ Dify 云端 AI 引擎</text>
    <text x="190" y="42" text-anchor="middle" font-size="10" fill="#dbeafe">http://10.232.5.5 · 内网自建 · Bot 共用</text>
