  <g transform="translate(60, 380)">
    <rect width="200" height="75" rx="8" fill="#16a34a" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">💬 企业微信</text>
    <text x="100" y="37" text-anchor="middle" font-size="10" fill="#dcfce7">WebSocket + Dify Bot</text>
    <text x="100" y="52" text-anchor="middle" font-size="10" fill="#dcfce7">消息/日程/会议/待办</text>
    <text x="100" y="67" text-anchor="middle" font-size="10" fill="#dcfce7">wecom-cli v1.2.0</text>
  </g>

  <!-- 飞书 -->
  <g transform="translate(280, 380)">
    <rect width="200" height="75" rx="8" fill="#16a34a" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">💬 飞书</text>
    <text x="100" y="37" text-anchor="middle" font-size="10" fill="#dcfce7">WebSocket + Dify Bot</text>
    <text x="100" y="52" text-anchor="middle" font-size="10" fill="#dcfce7">消息/邮件/日程/会议</text>
    <text x="100" y="67" text-anchor="middle" font-size="10" fill="#dcfce7">lark-cli v1.0.92</text>
  </g>

  <!-- Teams -->
  <g transform="translate(500, 380)">
    <rect width="200" height="75" rx="8" fill="#94a3b8" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">💬 Teams</text>
    <text x="100" y="37" text-anchor="middle" font-size="10" fill="#f1f5f9">⏳ 待开发</text>
    <text x="100" y="52" text-anchor="middle" font-size="10" fill="#f1f5f9">欧洲团队协作</text>
    <text x="100" y="67" text-anchor="middle" font-size="10" fill="#f1f5f9">Azure Graph API</text>
