  <line x1="340" y1="288" x2="160" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="288" x2="380" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="288" x2="600" y2="380" stroke="#64748b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="340" y1="288" x2="820" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="288" x2="1040" y2="380" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

