    <text x="250" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">📚 Dify 知识库</text>
    <text x="250" y="45" text-anchor="middle" font-size="11" fill="#ede9fe">仓库 Markdown 文档 + 业务 PDF/Office 文档</text>
    <text x="250" y="63" text-anchor="middle" font-size="11" fill="#ede9fe">Integration / Knowledge 等目录</text>
  </g>

  <!-- 连线 触角 → Dify 知识库 -->
  <line x1="160" y1="455" x2="420" y2="535" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="380" y1="455" x2="470" y2="535" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="455" x2="530" y2="535" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="820" y1="455" x2="620" y2="535" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="1040" y1="455" x2="730" y2="535" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Dify 引擎 → Dify 知识库 -->
  <line x1="860" y1="288" x2="700" y2="535" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="780" y="410" text-anchor="middle" font-size="10" fill="#2563eb">检索知识库</text>

  <!-- ===== 第五层：GitHub 仓库（代码/工具/文档展示） ===== -->
  <text x="600" y="665" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">📦 GitHub 仓库（代码 / 工具 / 文档展示载体）</text>
  <g transform="translate(350, 680)">
    <rect width="500" height="55" rx="10" fill="#64748b" filter="url(#shadow)"/>
    <text x="250" y="22" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">📚 kevinli.github.io</text>
    <text x="250" y="42" text-anchor="middle" font-size="10" fill="#f1f5f9">Git 版本控制 + Pages 展示 · 公开仓库</text>
  </g>

  <!-- 连线 Dify 知识库 → GitHub 仓库 -->
  <line x1="600" y1="615" x2="600" y2="680" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="680" y="650" text-anchor="middle" font-size="10" fill="#64748b">Markdown 文档同步</text>

  <!-- ===== 底部：两条核心循环 ===== -->
  <text x="600" y="785" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">🔁 两条核心循环</text>
  <rect x="80" y="798" width="1040" height="110" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- 循环1：AI 代答 -->
  <g transform="translate(100, 810)">
    <rect width="480" height="85" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
    <text x="240" y="17" text-anchor="middle" font-size="12" font-weight="bold" fill="#92400e">🟡 循环 1：AI 代答（同事使用）</text>
    <text x="240" y="35" text-anchor="middle" font-size="11" fill="#78350f">同事在群里 @机器人 → Bot WebSocket → Dify Chat API</text>
    <text x="240" y="52" text-anchor="middle" font-size="11" fill="#78350f">→ 检索 Dify 知识库（Markdown + 业务 PDF/Office）</text>
    <text x="240" y="69" text-anchor="middle" font-size="11" fill="#78350f">→ 生成回答（多轮对话） → 回复到群里</text>
  </g>

  <!-- 循环2：知识沉淀 -->
  <g transform="translate(620, 810)">
    <rect width="480" height="85" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
    <text x="240" y="17" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e40af">🔵 循环 2：知识沉淀（Kevin 使用）</text>
    <text x="240" y="35" text-anchor="middle" font-size="11" fill="#1e3a8a">Kevin 通过 Cherry Studio → 各平台 CLI / MCP</text>
    <text x="240" y="52" text-anchor="middle" font-size="11" fill="#1e3a8a">→ 查询数据 / 整理信息 / 生成报告</text>
    <text x="240" y="69" text-anchor="middle" font-size="11" fill="#1e3a8a">→ 沉淀到 GitHub 仓库 → 同步到 Dify 知识库</text>
  </g>

  <!-- 页脚 -->
  <text x="600" y="895" text-anchor="middle" font-size="10" fill="#94a3b8">📅 2026-09-09 · kevinli.github.io · Cherry Studio AI 助手</text>

</svg>
