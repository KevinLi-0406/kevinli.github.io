  <line x1="600" y1="165" x2="860" y2="230" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="198" text-anchor="middle" font-size="10" fill="#64748b">每天使用</text>
  <text x="740" y="198" text-anchor="middle" font-size="10" fill="#64748b">群里 @提问触发</text>

  <!-- ===== 第三层：五个触角 ===== -->
  <text x="600" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b">📡 五个触角 · 全平台集成</text>
  <rect x="50" y="368" width="1100" height="100" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

