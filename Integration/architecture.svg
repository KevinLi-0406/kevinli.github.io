    <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">📧 网易企业邮箱</text>
    <text x="100" y="37" text-anchor="middle" font-size="10" fill="#dcfce7">SMTP + IMAP</text>
    <text x="100" y="52" text-anchor="middle" font-size="10" fill="#dcfce7">收发 / 附件 / 定时任务</text>
    <text x="100" y="67" text-anchor="middle" font-size="10" fill="#dcfce7">smtphz.qiye.163.com:994</text>
  </g>

  <!-- D365 -->
  <g transform="translate(940, 380)">
    <rect width="200" height="75" rx="8" fill="#16a34a" filter="url(#shadow)"/>
    <text x="100" y="20" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">🗄️ D365 MCP</text>
    <text x="100" y="37" text-anchor="middle" font-size="10" fill="#dcfce7">SPP 运维助手</text>
    <text x="100" y="52" text-anchor="middle" font-size="10" fill="#dcfce7">1777 表 · EU SPP 运维</text>
    <text x="100" y="67" text-anchor="middle" font-size="10" fill="#dcfce7">Dataverse MCP</text>
  </g>

