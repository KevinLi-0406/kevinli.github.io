  <!-- 标题 -->
  <text x="600" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">🧠 统一信息平台 · 架构图</text>
  <text x="600" y="58" text-anchor="middle" font-size="12" fill="#64748b">一个大脑 · 五个触角 · 一套 Dify 知识库 · Cherry Studio 整合企微/飞书/Teams/邮箱/D365</text>

  <!-- 图例 -->
  <g transform="translate(380, 78)">
    <rect x="0" y="0" width="70" height="20" rx="4" fill="#16a34a"/>
    <text x="35" y="14" text-anchor="middle" font-size="11" fill="#fff">✅ 已完成</text>
    <rect x="80" y="0" width="70" height="20" rx="4" fill="#94a3b8"/>
    <text x="115" y="14" text-anchor="middle" font-size="11" fill="#fff">⏳ 待开发</text>
    <rect x="160" y="0" width="80" height="20" rx="4" fill="#2563eb"/>
    <text x="200" y="14" text-anchor="middle" font-size="11" fill="#fff">🧠 AI 大脑</text>
    <rect x="250" y="0" width="80" height="20" rx="4" fill="#7c3aed"/>
    <text x="290" y="14" text-anchor="middle" font-size="11" fill="#fff">💾 数据资产</text>
    <rect x="340" y="0" width="80" height="20" rx="4" fill="#ea580c"/>
    <text x="380" y="14" text-anchor="middle" font-size="11" fill="#fff"> 使用者</text>
