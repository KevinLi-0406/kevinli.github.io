  <!-- ===== 第一层：Kevin ===== -->
  <g transform="translate(440, 110)">
    <rect width="320" height="55" rx="28" fill="#f97316" stroke="#ea580c" stroke-width="2" filter="url(#shadow)"/>
    <text x="160" y="25" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">👤 Kevin</text>
    <text x="160" y="42" text-anchor="middle" font-size="10" fill="#fff">九号公司 · 海外销服应用工程师</text>
  </g>

  <!-- ===== 第二层：AI 大脑 ===== -->
  <text x="600" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e293b"> AI 大脑层</text>
  <rect x="100" y="218" width="1000" height="85" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Cherry Studio -->
  <g transform="translate(150, 230)">
    <rect width="380" height="58" rx="8" fill="#2563eb" filter="url(#shadow)"/>
    <text x="190" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">🖥️ Cherry Studio（本地操作中枢）</text>
    <text x="190" y="42" text-anchor="middle" font-size="10" fill="#dbeafe">Kevin 本人使用 · 本地客户端 · MCP 集成</text>
  </g>

  <!-- Dify -->
